<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0820">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Orbit Hop</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#0b0820;color:#fff;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

  /* HUD */
  #hud{position:fixed;inset:0;pointer-events:none}
  .hudtop{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 12px);display:flex;flex-direction:column;align-items:center;gap:4px}
  #score{font-size:68px;font-weight:900;line-height:1;text-shadow:0 4px 24px rgba(0,0,0,.45)}
  #score.pop{animation:pop .25s ease-out}
  @keyframes pop{0%{transform:scale(1.35)}100%{transform:scale(1)}}
  #combo{font-weight:900;font-size:20px;color:#ffb347;text-shadow:0 0 12px rgba(255,120,0,.7)}
  #combo.pop{animation:pop .2s ease-out}
  #powers{display:flex;gap:8px}
  .pw{font-weight:800;font-size:14px;background:rgba(0,0,0,.35);padding:4px 10px;border-radius:999px}
  .starpill{position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 18px);
    font-weight:800;font-size:18px;color:#ffe066;background:rgba(0,0,0,.28);padding:6px 12px;border-radius:999px}

  #banner{position:fixed;left:0;right:0;top:32%;padding:0 24px;text-align:center;pointer-events:none;
    animation:banner 2.4s ease-in-out forwards}
  #banner small{display:block;font-weight:800;letter-spacing:6px;font-size:15px;opacity:.8}
  #banner b{display:block;font-size:clamp(30px,9vw,48px);font-weight:900;letter-spacing:-1px;
    text-shadow:0 4px 30px rgba(0,0,0,.6)}
  @keyframes banner{0%{opacity:0;transform:scale(1.15)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}

  /* Screens */
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px);
    text-align:center;background:radial-gradient(ellipse at center,rgba(11,8,32,.4),rgba(11,8,32,.88));
    animation:fade .25s ease-out}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .hidden{display:none!important}

  .title{font-size:clamp(54px,16vw,92px);font-weight:900;letter-spacing:-3px;line-height:.88;
    background:linear-gradient(180deg,#fff 10%,#ffd166 55%,#ff6b9d 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 30px rgba(255,107,157,.35))}
  .title.sm{font-size:44px;letter-spacing:-1px}
  .sub{opacity:.78;font-weight:600;font-size:15px}
  .tap{margin-top:22px;font-weight:800;font-size:20px;letter-spacing:1px;animation:blink 1.2s ease-in-out infinite}
  @keyframes blink{50%{opacity:.35;transform:scale(.96)}}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

  .btn{border:0;cursor:pointer;font:inherit;font-weight:800;font-size:16px;color:#1a1033;
    background:linear-gradient(180deg,#ffe066,#ffb703);padding:13px 24px;border-radius:16px;
    box-shadow:0 5px 0 #c77d02,0 10px 30px rgba(255,183,3,.3);transition:transform .08s}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 #c77d02}
  .btn.alt{color:#fff;background:linear-gradient(180deg,#7c5cff,#5b3df5);box-shadow:0 5px 0 #3b23b8,0 10px 30px rgba(124,92,255,.3)}
  .btn.alt:active{box-shadow:0 1px 0 #3b23b8}
  .btn.green{color:#fff;background:linear-gradient(180deg,#34d399,#059669);box-shadow:0 5px 0 #047857,0 10px 30px rgba(16,185,129,.3)}
  .btn.green:active{box-shadow:0 1px 0 #047857}
  .btn.ghost{color:#fff;background:rgba(255,255,255,.12);box-shadow:0 5px 0 rgba(0,0,0,.3)}
  .btn.ghost:active{box-shadow:0 1px 0 rgba(0,0,0,.3)}
  .btn.big{font-size:22px;padding:17px 44px}
  .btn.small{font-size:14px;padding:8px 14px;border-radius:12px}
  .btn:disabled{opacity:.5}

  .iconrow{display:flex;gap:10px;margin-top:30px}
  .ibtn{position:relative;border:0;cursor:pointer;font:inherit;color:#fff;background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.12);border-radius:18px;width:74px;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px}
  .ibtn:active{transform:scale(.94)}
  .ibtn span{font-size:26px;line-height:1}
  .ibtn small{font-size:11px;font-weight:700;opacity:.85}
  .badge{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:#ff4d6d;
    color:#fff;font-style:normal;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 3px #0b0820;animation:pop .6s ease-in-out infinite alternate}

  .card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:22px;
    padding:16px 30px;min-width:240px}
  .label{font-size:13px;font-weight:700;letter-spacing:2px;opacity:.6;text-transform:uppercase}
  .bignum{font-size:72px;font-weight:900;line-height:1}
  .newbest{display:inline-block;margin-top:6px;font-weight:900;color:#1a1033;background:#ffe066;
    padding:4px 12px;border-radius:999px;animation:wiggle .6s ease-in-out infinite alternate}
  @keyframes wiggle{from{transform:rotate(-4deg) scale(1)}to{transform:rotate(4deg) scale(1.08)}}

  .scroll{overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;max-height:58vh;width:min(100%,400px);padding:4px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .skin{border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);border-radius:18px;
    padding:12px 4px;color:#fff;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
  .skin.sel{border-color:#ffe066;background:rgba(255,224,102,.12)}
  .skin.locked{opacity:.5}
  .skin b{font-size:14px}
  .skin small{font-size:11px;font-weight:700;color:#ffe066;line-height:1.2}
  .skin small.req{color:#c4b5fd}
  .orb{width:30px;height:30px;border-radius:50%}

  .list{display:flex;flex-direction:column;gap:10px;text-align:left}
  .item{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px 14px;
    display:flex;align-items:center;gap:12px}
  .item .grow{flex:1;min-width:0}
  .item .t{font-weight:700;font-size:15px}
  .item .s{font-size:12px;opacity:.7;margin-top:2px}
  .bar{height:8px;background:rgba(255,255,255,.12);border-radius:4px;margin-top:6px;overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#7c5cff,#ff6b9d);border-radius:4px}
  .item .v{font-weight:900;font-size:18px}
  .item.done{border-color:rgba(52,211,153,.5)}

  .daygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(100%,360px)}
  .day{background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.1);border-radius:14px;padding:10px 4px}
  .day small{display:block;font-size:11px;font-weight:700;opacity:.7}
  .day b{display:block;font-size:16px;color:#ffe066;margin-top:4px}
  .day.past{opacity:.45}
  .day.today{border-color:#ffe066;background:rgba(255,224,102,.15);transform:scale(1.06)}
  .day.big{grid-column:span 2}

  a.link{color:#c4b5fd;font-weight:700;font-size:14px}

  .toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 120px);transform:translateX(-50%);
    background:#ffe066;color:#1a1033;font-weight:900;padding:10px 18px;border-radius:999px;max-width:90vw;
    box-shadow:0 10px 30px rgba(0,0,0,.35);animation:toast 2.6s ease-in-out forwards;pointer-events:none;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;z-index:10}
  @keyframes toast{0%{opacity:0;transform:translate(-50%,-20px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-10px)}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div class="hudtop">
    <div id="score">0</div>
    <div id="combo" class="hidden"></div>
    <div id="powers"></div>
  </div>
  <div class="starpill">★ <span id="hudStars">0</span></div>
</div>
<div id="banner" class="hidden"><small id="bannerZone"></small><b id="bannerName"></b></div>

<div id="menu" class="screen">
  <div class="title">ORBIT<br>HOP</div>
  <div class="sub"><span data-t="best"></span>: <b id="menuBest">0</b> &nbsp;·&nbsp; ★ <b id="menuStars">0</b></div>
  <div class="sub" id="menuZone"></div>
  <div class="tap" data-t="tap"></div>
  <div class="iconrow">
    <button class="ibtn" id="btnMissions"><span>🎯</span><small data-t="missions"></small><i class="badge hidden" id="missionBadge"></i></button>
    <button class="ibtn" id="btnShop"><span>🛍️</span><small data-t="shop"></small></button>
    <button class="ibtn" id="btnStats"><span>📊</span><small data-t="stats"></small></button>
    <button class="ibtn" id="btnSettings"><span>⚙️</span><small data-t="settings"></small></button>
  </div>
</div>

<div id="over" class="screen hidden">
  <div class="card">
    <div class="label" data-t="score"></div>
    <div class="bignum" id="ovScore">0</div>
    <div id="ovNew" class="newbest" data-t="newBest"></div>
    <div class="sub" style="margin-top:8px"><span data-t="best"></span>: <b id="ovBest">0</b> &nbsp;·&nbsp; <span style="color:#ffe066">★ <b id="ovStars">+0</b></span></div>
    <div class="sub" id="ovZone" style="margin-top:4px"></div>
  </div>
  <button class="btn green hidden" id="btnAdCont" data-t="adCont"></button>
  <button class="btn alt hidden" id="btnCont"></button>
  <button class="btn big" id="btnRetry" data-t="retry"></button>
  <div class="row">
    <button class="btn ghost hidden" id="btnDouble" data-t="adDouble"></button>
    <button class="btn ghost" id="btnShare" data-t="share"></button>
  </div>
  <div class="row">
    <button class="btn ghost" id="btnOvShop" data-t="shop"></button>
    <button class="btn ghost" id="btnMenu" data-t="menu"></button>
  </div>
</div>

<div id="shop" class="screen hidden">
  <div class="title sm" data-t="shop"></div>
  <div class="sub" style="color:#ffe066;opacity:1;font-size:20px">★ <b id="shopStars">0</b></div>
  <div class="scroll"><div class="grid" id="skinGrid"></div></div>
  <button class="btn" data-back data-t="back"></button>
</div>

<div id="missions" class="screen hidden">
  <div class="title sm" data-t="missions"></div>
  <div class="sub" id="streakLine"></div>
  <div class="scroll"><div class="list" id="missionList"></div></div>
  <div class="sub" data-t="missionsReset" style="font-size:12px"></div>
  <button class="btn" data-back data-t="back"></button>
</div>

<div id="stats" class="screen hidden">
  <div class="title sm" data-t="stats"></div>
  <div class="scroll"><div class="list" id="statList"></div></div>
  <button class="btn" data-back data-t="back"></button>
</div>

<div id="settings" class="screen hidden">
  <div class="title sm" data-t="settings"></div>
  <div class="scroll"><div class="list" id="settingList"></div></div>
  <a class="link" href="privacy.html" target="_blank" data-t="privacy"></a>
  <button class="btn" data-back data-t="back"></button>
</div>

<div id="daily" class="screen hidden">
  <div class="title sm" data-t="daily"></div>
  <div class="sub" id="dailyStreak"></div>
  <div class="daygrid" id="dayGrid"></div>
  <button class="btn big" id="btnClaimDaily" data-t="claim"></button>
</div>

<div id="adfake" class="screen hidden">
  <div class="title sm">AD</div>
  <div class="sub" data-t="adLoading"></div>
</div>

<script src="game.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doğal İngilizce</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="İngilizce">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e8553d">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f3ec;--card:#fff;--ink:#1e1b29;--mut:#6d6979;--acc:#e8553d;--acc-soft:#fde7e2;--blue:#2f6fed;--blue-soft:#e4ecfd;--ok:#1d9a5f;--ok-soft:#dcf3e7;--bad:#d64545;--bad-soft:#fbe2e2;--line:#e8e2d6;--sh:0 2px 10px rgba(40,30,10,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#16141c;--card:#211e29;--ink:#f1eef7;--mut:#a29eae;--acc:#ff6f55;--acc-soft:#3a221e;--blue:#6b9bff;--blue-soft:#1d2740;--ok:#3ccf8a;--ok-soft:#163327;--bad:#ff7070;--bad-soft:#3a1d1d;--line:#332f3d;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.45}
main{max-width:640px;margin:0 auto;padding:14px 14px 96px}
header{display:flex;align-items:center;justify-content:space-between;max-width:640px;margin:0 auto;padding:14px 16px 0}
header h1{font-size:19px;margin:0;font-weight:900;letter-spacing:-.3px}
header h1 span{color:var(--acc)}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-weight:800;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--sh)}
.hero{background:linear-gradient(135deg,var(--acc),#f08a3c);color:#fff;border:none}
.hero .mut{color:rgba(255,255,255,.85)}
h2{font-size:20px;margin:0 0 6px;font-weight:900}
h3{font-size:16px;margin:0 0 6px;font-weight:800}
.mut{color:var(--mut);font-size:14px}
.small{font-size:13px}
button,.btn{font-family:inherit;font-weight:800;font-size:15px;border:none;border-radius:12px;padding:11px 14px;cursor:pointer;background:var(--blue-soft);color:var(--blue);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
button:active{transform:scale(.97)}
.primary{background:var(--acc);color:#fff}
.hero .primary{background:#fff;color:var(--acc)}
.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.okb{background:var(--ok-soft);color:var(--ok)}
.badb{background:var(--bad-soft);color:var(--bad)}
.full{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1}
.grid30{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:10px}
.dc{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:var(--mut);padding:0}
.dc.done{background:var(--ok);color:#fff;border-color:var(--ok)}
.dc.cur{background:var(--acc-soft);color:var(--acc);border:2px solid var(--acc)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:900}
.stat span{font-size:12px;color:var(--mut)}
.chk{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border:none}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:14px}
.chk.on .box{background:var(--ok);border-color:var(--ok)}
.chk.on .lbl{text-decoration:line-through;color:var(--mut)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav .in{display:flex;max-width:640px;width:100%}
nav button{flex:1;flex-direction:column;gap:1px;background:none;color:var(--mut);font-size:10.5px;padding:6px 2px;border-radius:10px}
nav button i{font-style:normal;font-size:21px;line-height:1.1}
nav button.on{color:var(--acc);background:var(--acc-soft)}
.steps{display:flex;gap:4px;margin:6px 0 12px}
.steps div{flex:1;height:6px;border-radius:9px;background:var(--line)}
.steps div.on{background:var(--acc)}
.line{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border:none}
.who{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;background:var(--blue-soft);color:var(--blue)}
.who.B{background:var(--acc-soft);color:var(--acc)}
.en{font-weight:800;font-size:17px}
.tr{color:var(--mut);font-size:14px}
.tr.hid{filter:blur(5px);cursor:pointer;user-select:none}
.play{flex:none;width:40px;height:40px;border-radius:50%;padding:0;font-size:16px}
.big{font-size:23px;font-weight:900;line-height:1.3;margin:6px 0}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:13px;font-weight:700;margin:2px}
input[type=text],textarea{width:100%;font-family:inherit;font-size:17px;border:2px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);color:var(--ink);outline:none}
input[type=text]:focus,textarea:focus{border-color:var(--blue)}
.w-ok{color:var(--ok);font-weight:900}
.w-no{color:var(--bad);font-weight:900;text-decoration:underline wavy}
.score{font-size:28px;font-weight:900}
.tip{background:var(--blue-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.tip b{color:var(--blue)}
.sound{cursor:pointer}
.items{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.items button{font-size:15px;padding:8px 12px}
.timer{font-size:46px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;margin:8px 0}
.flash{text-align:center;padding:22px 12px}
.msgs{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.msg{max-width:86%;padding:10px 12px;border-radius:16px;font-size:16px}
.msg.ai{background:var(--card);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--blue);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.fix{align-self:flex-end;max-width:86%;background:var(--ok-soft);border-radius:12px;padding:8px 10px;font-size:14px}
.fix b{color:var(--ok)}
.sys{align-self:center;max-width:94%;background:var(--blue-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.chatbar{display:flex;gap:6px;align-items:flex-end}
.chatbar textarea{min-height:48px;max-height:120px;resize:none;font-size:16px}
details{margin:6px 0}
summary{font-weight:800;cursor:pointer;padding:6px 0}
a{color:var(--blue);font-weight:700}
.res{display:block;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.res:last-child{border:none}
.res b{color:var(--blue)}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:800;font-size:14px;z-index:30;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
select{font-family:inherit;font-size:15px;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;background:none;color:var(--mut);padding:7px;font-size:13px}
.lvh{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 2px;font-weight:900}
.lvh span{font-size:12px;color:var(--mut);font-weight:700}
.st{cursor:pointer;padding:8px 6px;border-radius:10px;margin:2px -6px}
.st.on{background:var(--acc-soft)}
.st .tr{margin-top:2px}
.gtip{background:var(--ok-soft);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.storyrow{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.storyrow:last-child{border:none}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
</style>
</head>
<body>
<header><h1>🗣️ Doğal <span>İngilizce</span></h1><div class="row" style="flex:none;gap:6px"><span class="pill" id="sync" title="Senkron" style="display:none">☁️</span><span class="pill" id="streak">🔥 0</span></div></header>
<main id="app"></main>
<nav><div class="in">
<button data-act="tab" data-v="home" class="on"><i>🏠</i>Bugün</button>
<button data-act="tab" data-v="review"><i>🧠</i>Tekrar</button>
<button data-act="tab" data-v="stories"><i>📚</i>Hikâye</button>
<button data-act="tab" data-v="chat"><i>💬</i>Sohbet</button>
<button data-act="tab" data-v="sounds"><i>👄</i>Sesler</button>
<button data-act="tab" data-v="guide"><i>🧭</i>Rehber</button>
</div></nav>
<div class="toast" id="toast"></div>
<script>
/* ======================= İÇERİK ======================= */
const DAYS=[
{t:"Doğal selamlaşma",d:["A|Hey! What's up?|Selam! N'aber?","B|Not much. Just chilling. You?|Pek bir şey yok. Takılıyorum. Sen?","A|Same old, same old. How's it going with work?|Her zamanki gibi. İşler nasıl gidiyor?","B|Pretty good, actually. Busy, but good.|Aslında gayet iyi. Yoğun ama iyi.","A|Nice! Good to see you, man.|Süper! Seni görmek güzel, dostum.","B|You too. Catch you later!|Ben de. Sonra görüşürüz!"],c:["What's up?|N'aber?","Not much.|Pek bir şey yok.","How's it going?|Nasıl gidiyor?","Pretty good, actually.|Aslında gayet iyi.","Same old, same old.|Her zamanki gibi.","Good to see you.|Seni görmek güzel.","Catch you later!|Sonra görüşürüz!","Take care!|Kendine iyi bak!"],p:"Önce telefonunun Ses Kayıt uygulamasıyla 1 dakika İngilizce konuşup kendini kaydet (ne biliyorsan). 30. gün bununla karşılaştıracaksın! Sonra aynaya bak ve bir arkadaşınla karşılaşmış gibi selamlaş: \"Hey! What's up?\""},
{t:"Kendini tanıtma",d:["A|So, what do you do?|Peki, ne iş yapıyorsun?","B|I work as an SAP consultant.|SAP danışmanı olarak çalışıyorum.","A|Oh, cool. How long have you been doing that?|Aa, güzel. Ne zamandır bunu yapıyorsun?","B|About eight years now. What about you?|Sekiz yıl kadar oldu. Ya sen?","A|I'm a teacher. I'm originally from Izmir, but I live in Istanbul now.|Öğretmenim. Aslen İzmirliyim ama şimdi İstanbul'da yaşıyorum.","B|Oh, nice to meet you!|Aa, tanıştığımıza memnun oldum!"],c:["What do you do?|Ne iş yapıyorsun?","I work as a...|... olarak çalışıyorum.","How long have you been doing that?|Ne zamandır bunu yapıyorsun?","About eight years now.|Sekiz yıl kadar oldu.","What about you?|Ya sen?","I'm originally from...|Aslen ...lıyım.","Nice to meet you.|Tanıştığımıza memnun oldum.","I'm really into...|...e çok meraklıyım."],p:"Kendini 30 saniyede tanıt: ne iş yaptığın, nereli olduğun, neye meraklı olduğun. 3 kez tekrar et, her seferinde daha akıcı."},
{t:"Tepki vermek",d:["A|I got the job!|İşi aldım!","B|No way! That's awesome!|Yok artık! Harika!","A|I know, right? I can't believe it.|Değil mi ama? İnanamıyorum.","B|Seriously, good for you. You deserve it.|Cidden, aferin sana. Hak ettin.","A|Thanks! But I start on Monday.|Sağ ol! Ama pazartesi başlıyorum.","B|Oh wow, that's soon!|Vay, bu çok yakın!"],c:["No way!|Yok artık!","That's awesome!|Harika!","I know, right?|Değil mi ama?","Seriously?|Cidden mi?","Good for you!|Aferin sana! / Ne güzel!","You deserve it.|Hak ettin.","Oh, come on!|Hadi ama!","That sucks.|Çok kötü. / Berbat."],p:"Bugün duyduğun 5 olayı düşün ve her birine yüksek sesle İngilizce tepki ver: No way! / That's awesome! / That sucks. / Seriously?"},
{t:"Günlük rutin",d:["A|What's your morning like?|Sabahların nasıl geçiyor?","B|I usually wake up around seven and grab a coffee.|Genelde yedi gibi uyanıp bir kahve kaparım.","A|Do you have breakfast?|Kahvaltı yapar mısın?","B|Not really. I'm always in a rush.|Pek değil. Hep acelem var.","A|Same here. I'm not a morning person at all.|Bende de aynı. Hiç sabah insanı değilim.","B|Me neither. Weekends are a different story, though.|Ben de değilim. Ama hafta sonları başka tabii."],c:["I usually...|Genelde ...","around seven|yedi gibi","grab a coffee|bir kahve kapmak","I'm always in a rush.|Hep acelem var.","Same here.|Bende de aynı.","I'm not a morning person.|Sabah insanı değilim.","Me neither.|Ben de değilim.","..., though.|... ama / gerçi"],p:"Sabah rutinini \"I usually...\" ile 6 cümlede anlat. Yarın sabah kahve yaparken kafanda tekrar anlat."},
{t:"Rica etmek",d:["A|Hey, could you do me a favor?|Hey, bana bir iyilik yapabilir misin?","B|Sure, what's up?|Tabii, ne oldu?","A|Do you mind if I borrow your charger?|Şarj aletini ödünç alsam sorun olur mu?","B|Not at all. Here you go.|Hiç olmaz. Buyur.","A|Thanks a lot. I owe you one.|Çok sağ ol. Sana bir borçluyum.","B|No worries.|Dert etme."],c:["Could you do me a favor?|Bana bir iyilik yapabilir misin?","Do you mind if I...?|...sam sorun olur mu?","Not at all.|Hiç olmaz. / Ne demek.","Here you go.|Buyur.","I owe you one.|Sana bir borçluyum.","No worries.|Dert etme.","Would you mind ...ing?|...r misin? (kibar)","Is it okay if I...?|...sam olur mu?"],p:"Evdeki ya da işteki insanlardan kafanda İngilizce 5 rica yap: Could you...? / Do you mind if I...? / Would you mind...?"},
{t:"Kafede sipariş",d:["A|Hi, what can I get for you?|Merhaba, size ne vereyim?","B|Can I get a large latte, please?|Büyük bir latte alabilir miyim lütfen?","A|Sure. For here or to go?|Tabii. Burada mı, götürmek için mi?","B|To go, please.|Götürmek için lütfen.","A|Anything else?|Başka bir şey?","B|That's it, thanks. Can I pay by card?|Bu kadar, teşekkürler. Kartla ödeyebilir miyim?"],c:["Can I get..., please?|... alabilir miyim lütfen?","For here or to go?|Burada mı, paket mi?","Anything else?|Başka bir şey?","That's it, thanks.|Bu kadar, teşekkürler.","Can I pay by card?|Kartla ödeyebilir miyim?","I'll have the...|Ben ...yı alayım.","Could we get the check?|Hesabı alabilir miyiz?","Keep the change.|Üstü kalsın."],p:"Hayali bir kafede hem garson hem müşteri ol, siparişi baştan sona oyna. Sonra aynı konuşmayı hızlandırarak tekrar et."},
{t:"Hafta sonu planı",d:["A|Got any plans for the weekend?|Hafta sonu için planın var mı?","B|Not yet. I'm gonna sleep in on Saturday, for sure.|Henüz yok. Cumartesi kesin geç kalkacağım.","A|Wanna grab dinner on Sunday?|Pazar akşam yemek yiyelim mi?","B|Sounds good! Where do you wanna go?|Olur! Nereye gitmek istersin?","A|How about that new burger place?|Şu yeni burgerciye ne dersin?","B|I'm down. Let's do it.|Varım. Yapalım."],c:["Got any plans?|Planın var mı?","I'm gonna...|...cağım.","sleep in|geç kalkmak (bilerek)","Wanna...?|...mak ister misin?","Sounds good!|Olur! / Kulağa hoş geliyor!","How about...?|...ye ne dersin?","I'm down.|Varım.","Let's do it.|Yapalım."],p:"Bu hafta sonu planını \"I'm gonna...\" ile 5 cümlede anlat. Bir arkadaşını davet et: \"Wanna...?\""},
{t:"Fikir bildirmek",d:["A|What do you think about the new office?|Yeni ofis hakkında ne düşünüyorsun?","B|To be honest, I'm not a big fan.|Açıkçası pek hayranı değilim.","A|Really? Why not?|Gerçekten mi? Neden?","B|I mean, it's nice, but it's way too far.|Yani güzel ama fazlasıyla uzak.","A|Fair enough. I kind of like it, though.|Anlaşılır. Ama ben biraz seviyorum gerçi.","B|Well, I guess it depends on your commute.|Eh, sanırım yolun ne kadar sürdüğüne bağlı."],c:["What do you think about...?|... hakkında ne düşünüyorsun?","To be honest,|Açıkçası,","I'm not a big fan.|Pek hayranı değilim.","I mean,|Yani,","way too...|fazlasıyla ...","Fair enough.|Anlaşılır. / Mantıklı.","kind of|biraz / bir nevi","It depends.|Duruma bağlı."],p:"Son izlediğin dizi ya da film hakkında 1 dakika fikrini söyle: To be honest... / I mean... / kind of..."},
{t:"Katılmak / katılmamak",d:["A|I think we should leave early to avoid traffic.|Bence trafiğe kalmamak için erken çıkmalıyız.","B|Totally. I couldn't agree more.|Kesinlikle. Sonuna kadar katılıyorum.","A|And maybe skip the highway?|Belki otoyola da girmeyiz?","B|Hmm, I'm not so sure about that.|Hmm, ondan pek emin değilim.","A|Why? It's usually faster.|Neden? Genelde daha hızlı.","B|I see your point, but there's construction this week.|Haklısın ama bu hafta yol çalışması var."],c:["Totally.|Kesinlikle.","I couldn't agree more.|Sonuna kadar katılıyorum.","I'm not so sure about that.|Ondan pek emin değilim.","I see your point, but...|Ne demek istediğini anlıyorum ama...","You've got a point.|Haklısın. / Bir noktan var.","That's true.|Doğru.","Exactly!|Aynen!","I don't think so.|Sanmıyorum."],p:"\"Evden çalışmak daha iyi\" fikrine önce katıl, sonra katılma. İki tarafı da 30'ar saniye savun."},
{t:"Geçmişi anlatmak",d:["A|So, how was your trip?|Eee, gezin nasıldı?","B|It was amazing! We walked all over the city.|Harikaydı! Şehrin her yerini yürüdük.","A|Did anything funny happen?|Komik bir şey oldu mu?","B|Oh yeah. I missed the last train and ended up taking a taxi.|Aa evet. Son treni kaçırdım, sonunda taksiye bindim.","A|Ha! That's so you.|Ha! Tam senlik.","B|I know. Anyway, it turned out fine.|Biliyorum. Neyse, sonunda iyi oldu."],c:["How was...?|... nasıldı?","It was amazing!|Harikaydı!","Guess what happened.|Bil bakalım ne oldu.","I ended up ...ing|Sonunda ... yaptım","Anyway,|Neyse,","It turned out fine.|Sonunda iyi oldu.","That's so you.|Tam senlik.","Long story short,|Uzun lafın kısası,"],p:"Dün başına gelen bir şeyi anlat: \"So yesterday...\" ile başla, \"Anyway...\" ve \"It turned out...\" kullan."},
{t:"Duygular",d:["A|You look a bit down. Are you okay?|Biraz keyifsiz görünüyorsun. İyi misin?","B|I'm just stressed out about work.|Sadece iş yüzünden stresliyim.","A|I'm sorry to hear that. What's going on?|Buna üzüldüm. Neler oluyor?","B|Too many deadlines. I'm totally burned out.|Çok fazla teslim tarihi. Tamamen tükendim.","A|That sounds rough. Wanna talk about it?|Zor görünüyor. Konuşmak ister misin?","B|Thanks. That means a lot.|Sağ ol. Bu benim için çok değerli."],c:["You look a bit down.|Biraz keyifsiz görünüyorsun.","I'm stressed out.|Stresliyim.","I'm sorry to hear that.|Buna üzüldüm.","What's going on?|Neler oluyor?","I'm burned out.|Tükendim.","That sounds rough.|Zor görünüyor.","That means a lot.|Bu benim için çok değerli.","I'm so excited about...|... için çok heyecanlıyım."],p:"Bu hafta nasıl hissettiğini 1 dakika anlat: stressed out, excited, tired, happy... Her duyguya bir sebep söyle."},
{t:"İş hayatı",d:["A|How's work these days?|Bu aralar işler nasıl?","B|Pretty hectic. We're in the middle of a big project.|Epey yoğun. Büyük bir projenin ortasındayız.","A|What are you working on?|Ne üzerinde çalışıyorsun?","B|We're setting up a new payment system for a client.|Bir müşteri için yeni bir ödeme sistemi kuruyoruz.","A|Sounds like a lot. Do you get along with your team?|Çok iş gibi. Ekibinle iyi anlaşıyor musun?","B|Yeah, they're great. We get a lot done.|Evet, harikalar. Çok iş çıkarıyoruz."],c:["How's work these days?|Bu aralar işler nasıl?","Pretty hectic.|Epey yoğun.","in the middle of|...ın ortasında","What are you working on?|Ne üzerinde çalışıyorsun?","set up|kurmak","get along with|iyi anlaşmak","get a lot done|çok iş çıkarmak","I'll get back to you.|Sana dönerim."],p:"İşini SAP'yi hiç bilmeyen yabancı bir arkadaşa 1 dakikada anlat. Teknik kelime değil, basit kelimeler kullan."},
{t:"Gelecek planları",d:["A|What are you gonna do after the project?|Projeden sonra ne yapacaksın?","B|I'm thinking about taking some time off.|Biraz izin almayı düşünüyorum.","A|Good idea. Where are you headed?|İyi fikir. Nereye gidiyorsun?","B|I'm planning to go to Italy, if everything works out.|Her şey yolunda giderse İtalya'ya gitmeyi planlıyorum.","A|Oh, you'll love it.|Oo, bayılacaksın.","B|I hope so. I've been wanting to go for years.|Umarım. Yıllardır gitmek istiyorum."],c:["I'm thinking about ...ing|...meyi düşünüyorum","take some time off|biraz izin almak","Where are you headed?|Nereye gidiyorsun?","I'm planning to...|...meyi planlıyorum","if everything works out|her şey yolunda giderse","You'll love it.|Bayılacaksın.","I hope so.|Umarım.","I've been wanting to...|Uzun zamandır ... istiyorum"],p:"Önümüzdeki bir yıl için 4 plan söyle: I'm thinking about... / I'm planning to... / I've been wanting to..."},
{t:"Telefon ve mesaj",d:["A|Hey, did you get my text?|Hey, mesajımı aldın mı?","B|Sorry, I just saw it. My phone was on silent.|Kusura bakma, şimdi gördüm. Telefonum sessizdeydi.","A|No problem. Are we still on for tonight?|Sorun değil. Bu akşam hâlâ geçerli mi?","B|Yeah, but I'm running a bit late.|Evet, ama biraz gecikiyorum.","A|Okay, just text me when you're on your way.|Tamam, yola çıkınca bana yaz.","B|Will do. See you soon!|Tamamdır. Görüşürüz!"],c:["Did you get my text?|Mesajımı aldın mı?","I just saw it.|Şimdi gördüm.","Are we still on for...?|... hâlâ geçerli mi?","I'm running late.|Gecikiyorum.","Text me when...|...ınca bana yaz.","I'm on my way.|Yoldayım.","Will do.|Tamamdır. / Yaparım.","I'll call you back.|Seni geri ararım."],p:"Bir arkadaşına sesli mesaj bırakıyormuş gibi konuş: geç kaldığını söyle, özür dile, ne zaman varacağını söyle."},
{t:"Hikâye anlatmak",d:["A|So, you know my neighbor?|Hani komşumu biliyorsun ya?","B|The guy with the dog?|Köpekli adam mı?","A|Yeah. So, like, yesterday his dog got into my apartment.|Evet. İşte, dün köpeği benim daireye girdi.","B|Wait, what? How?|Dur, ne? Nasıl?","A|I left the door open, and it just walked in like it owned the place.|Kapıyı açık bırakmışım, ev onunmuş gibi girdi.","B|That's hilarious!|Çok komik!"],c:["So, you know...?|Hani ... var ya?","like,|işte, yani (dolgu)","Wait, what?|Dur, ne?","you know|bilirsin işte (dolgu)","out of nowhere|birdenbire","like it owned the place|evin sahibiymiş gibi","That's hilarious!|Çok komik!","The thing is,|Mesele şu ki,"],p:"Başına gelen komik bir olayı \"So, you know...\" ile başlatıp anlat. Dolgu kelimeleri kullan: like, you know, so, and then."},
{t:"Sorun bildirmek",d:["A|Excuse me, I think there's a problem with my order.|Affedersiniz, siparişimde bir sorun var sanırım.","B|Oh, I'm sorry. What seems to be the problem?|Ah, özür dilerim. Sorun nedir?","A|I ordered the chicken, but this is beef.|Tavuk sipariş ettim ama bu dana.","B|My bad. I'll fix that right away.|Benim hatam. Hemen düzeltiyorum.","A|Thanks. No rush.|Teşekkürler. Acelesi yok.","B|And it's on the house, by the way.|Bu arada bizden, ikram."],c:["Excuse me,|Affedersiniz,","There's a problem with...|...da bir sorun var.","What seems to be the problem?|Sorun nedir?","My bad.|Benim hatam.","right away|hemen","No rush.|Acelesi yok.","It's on the house.|İkramımız.","by the way|bu arada"],p:"Restoranda yanlış yemek geldiğini, sonra da kafede kahvenin soğuk olduğunu kibarca bildir."},
{t:"Öneri vermek",d:["A|I can't sleep well lately.|Son zamanlarda iyi uyuyamıyorum.","B|Have you tried putting your phone away before bed?|Yatmadan önce telefonu bırakmayı denedin mi?","A|Not really.|Pek değil.","B|You should give it a shot. It really helps.|Bir denemelisin. Gerçekten işe yarıyor.","A|Maybe. Any other tips?|Belki. Başka tavsiye?","B|If I were you, I'd stop drinking coffee after lunch.|Senin yerinde olsam öğleden sonra kahveyi bırakırdım."],c:["Have you tried ...ing?|...meyi denedin mi?","You should...|...malısın.","give it a shot|bir denemek","It really helps.|Gerçekten işe yarıyor.","If I were you, I'd...|Senin yerinde olsam ...rdım.","Why don't you...?|Neden ... yapmıyorsun?","It's worth a try.|Denemeye değer.","Any other tips?|Başka tavsiye?"],p:"İngilizce öğrenmek isteyen bir arkadaşına 4 tavsiye ver: Have you tried...? / You should... / If I were you, I'd..."},
{t:"Seyahat",d:["A|Excuse me, how do I get to the train station?|Affedersiniz, tren istasyonuna nasıl giderim?","B|Go straight and take the second left.|Düz gidin, ikinci soldan dönün.","A|Is it within walking distance?|Yürüme mesafesinde mi?","B|Yeah, it's about ten minutes on foot.|Evet, yürüyerek on dakika kadar.","A|Great. Thanks so much!|Harika. Çok teşekkürler!","B|You're welcome. Have a nice trip!|Rica ederim. İyi yolculuklar!"],c:["How do I get to...?|...ya nasıl giderim?","Go straight.|Düz gidin.","Take the second left.|İkinci soldan dönün.","within walking distance|yürüme mesafesinde","on foot|yürüyerek","I'm lost.|Kayboldum.","Could you show me on the map?|Haritada gösterebilir misiniz?","Have a nice trip!|İyi yolculuklar!"],p:"Evinden en yakın markete ya da metroya yol tarif et. Sonra kaybolmuş bir turist gibi yol sor."},
{t:"Alışveriş",d:["A|Can I help you with anything?|Yardımcı olabilir miyim?","B|I'm just looking, thanks.|Sadece bakıyorum, teşekkürler.","A|No problem. Let me know if you need anything.|Sorun değil. Bir şey lazım olursa haber verin.","B|Actually, do you have this in a medium?|Aslında, bunun M bedeni var mı?","A|Let me check. Here you go.|Bir bakayım. Buyurun.","B|Perfect. Can I try it on?|Harika. Deneyebilir miyim?"],c:["I'm just looking.|Sadece bakıyorum.","Let me know if...|...sa haber verin.","Do you have this in...?|Bunun ... var mı?","Let me check.|Bir bakayım.","Can I try it on?|Deneyebilir miyim?","It's a bit pricey.|Biraz pahalı.","Is it on sale?|İndirimde mi?","I'll take it.|Alıyorum."],p:"Mağazada bir mont alıyormuş gibi konuş: bak, beden sor, dene, fiyatı yorumla, satın al."},
{t:"Hobiler",d:["A|What do you do in your free time?|Boş zamanında ne yaparsın?","B|I'm really into video games. I even make my own.|Video oyunlarına çok meraklıyım. Kendi oyunlarımı bile yapıyorum.","A|That's so cool! What kind of games?|Çok havalı! Ne tür oyunlar?","B|Simple mobile games, mostly. It's just a hobby.|Çoğunlukla basit mobil oyunlar. Sadece hobi.","A|I'd love to try one.|Birini denemeyi çok isterim.","B|Sure! I'll send you the link.|Tabii! Linki atarım."],c:["What do you do in your free time?|Boş zamanında ne yaparsın?","I'm really into...|...ya çok meraklıyım.","That's so cool!|Çok havalı!","What kind of...?|Ne tür ...?","mostly|çoğunlukla","It's just a hobby.|Sadece hobi.","I'd love to...|...mayı çok isterim.","I'll send you the link.|Linki atarım."],p:"Hobilerini 1 dakika anlat: neye meraklısın, ne zamandır yapıyorsun, neden seviyorsun?"},
{t:"Phrasal verbs 1",d:["A|Did you figure out the problem?|Sorunu çözebildin mi?","B|Not yet. I'm gonna look into it tomorrow.|Henüz değil. Yarın inceleyeceğim.","A|Don't give up. You'll work it out.|Pes etme. Halledeceksin.","B|Thanks. Can you help me out if I get stuck?|Sağ ol. Takılırsam bana yardım eder misin?","A|Of course. Just reach out.|Tabii. Bana yazman yeter.","B|Awesome. I'll let you know.|Süper. Haber veririm."],c:["figure out|çözmek, anlamak","look into|incelemek","give up|pes etmek","work it out|halletmek","help me out|bana yardım et","get stuck|takılmak","reach out|ulaşmak, yazmak","find out|öğrenmek, öğrenip anlamak"],p:"Bugünkü 8 phrasal verb'ün her biriyle kendi hayatından bir cümle kur. Örnek: \"I need to figure out my budget.\""},
{t:"Phrasal verbs 2",d:["A|Are you coming to the party tonight?|Bu akşam partiye geliyor musun?","B|I can't. I have to catch up on some work.|Gelemem. Biraz iş yetiştirmem lazım.","A|Come on! Just show up for an hour.|Hadi ama! Bir saatliğine uğra.","B|Okay, fine. But I can't stay up late.|Tamam, peki. Ama geç saate kadar kalamam.","A|Deal. I'll pick you up at eight.|Anlaştık. Seni sekizde alırım.","B|Alright. Don't let me down!|Tamam. Sakın beni ekme!"],c:["catch up on|(geride kalanı) yetiştirmek","show up|gelmek, uğramak","stay up late|geç saate kadar oturmak","pick someone up|birini (arabayla) almak","hang out|takılmak","turn down|reddetmek","let someone down|birini hayal kırıklığına uğratmak","call off|iptal etmek"],p:"Geçen haftanı bu phrasal verb'lerle anlat: hang out, catch up on, stay up late, show up..."},
{t:"Deyimler",d:["A|How's the new job going?|Yeni iş nasıl gidiyor?","B|Honestly, it's a piece of cake.|Açıkçası çocuk oyuncağı.","A|Lucky you! My boss keeps changing the rules.|Şanslısın! Patronum sürekli kuralları değiştiriyor.","B|Ugh. Hang in there.|Off. Dayan.","A|I'm trying, but I'm already on thin ice.|Deniyorum ama zaten ince buz üstündeyim.","B|Let's grab a drink and blow off some steam.|Hadi bir şeyler içip biraz stres atalım."],c:["a piece of cake|çocuk oyuncağı","Hang in there.|Dayan.","on thin ice|ince buz üstünde","blow off steam|stres atmak","break the ice|buzları eritmek","hit the sack|yatmak (uyumak)","It's not rocket science.|Çok zor bir şey değil.","under the weather|keyifsiz, hafif hasta"],p:"Her deyimi kendi hayatından gerçek bir örnekle kullan. Örnek: \"SAP is a piece of cake for me.\""},
{t:"Small talk",d:["A|Crazy weather today, huh?|Bugün hava çıldırmış, değil mi?","B|Tell me about it. It was sunny an hour ago.|Sorma. Bir saat önce güneşliydi.","A|Have you been here before?|Daha önce buraya geldin mi?","B|Yeah, a couple of times. The food's great.|Evet, birkaç kez. Yemekleri harika.","A|Good to know. So, how do you know Ali?|İyi bilmek. Peki Ali'yi nereden tanıyorsun?","B|We went to college together.|Üniversitede beraber okuduk."],c:["..., huh?|..., değil mi?","Tell me about it.|Sorma. / Bana mı anlatıyorsun.","Have you been here before?|Daha önce buraya geldin mi?","a couple of times|birkaç kez","Good to know.|İyi bilmek.","How do you know...?|...yı nereden tanıyorsun?","We went to ... together.|...ya beraber gittik.","It was nice talking to you.|Seninle konuşmak güzeldi."],p:"Asansörde ya da düğünde tanımadığın biriyle 1 dakika small talk yap: hava, mekan, ortak tanıdık."},
{t:"Şaka ve ironi",d:["A|I spilled coffee on my laptop this morning.|Bu sabah laptopuma kahve döktüm.","B|Oh, great. Just what you needed.|Ah süper. Tam da ihtiyacın olan şey.","A|Yeah, perfect start to the day.|Evet, güne mükemmel başlangıç.","B|Are you kidding me? Does it still work?|Dalga mı geçiyorsun? Hâlâ çalışıyor mu?","A|I'm just messing with you. It's fine.|Sadece seninle dalga geçiyorum. Bir şey olmadı.","B|Oh, you got me!|Ah, yuttum!"],c:["Oh, great.|Ah süper. (ironik)","Just what I needed.|Tam da ihtiyacım olan şey. (ironik)","Are you kidding me?|Dalga mı geçiyorsun?","I'm just messing with you.|Seninle dalga geçiyorum.","You got me!|Yuttum! / Beni kandırdın!","Just kidding!|Şaka şaka!","Very funny.|Çok komik. (ironik)","Nice try!|İyi denemeydi!"],p:"Başına gelen 3 kötü şeyi ironik bir tonla anlat: \"Oh, great. Just what I needed.\" Tonlamayı abart!"},
{t:"İkna etmek",d:["A|We should get a dog.|Bir köpek almalıyız.","B|I don't know. It's a big responsibility.|Bilmem. Büyük sorumluluk.","A|True, but think about it: we'd go for walks every day.|Doğru ama bir düşün: her gün yürüyüşe çıkarız.","B|That's a fair point. But who's gonna take care of it?|Haklısın. Ama ona kim bakacak?","A|Me! I promise. Come on, at least think about it.|Ben! Söz veriyorum. Hadi, en azından düşün.","B|Okay, I'll think about it. No promises.|Tamam, düşüneceğim. Söz vermiyorum."],c:["I don't know.|Bilmem.","Think about it:|Bir düşün:","That's a fair point.|Haklı bir nokta.","take care of|bakmak, ilgilenmek","at least|en azından","I promise.|Söz veriyorum.","No promises.|Söz vermiyorum.","The point is,|Asıl mesele şu,"],p:"Bir arkadaşını seninle haftada 2 gün spor yapmaya ikna et. Onun itirazlarını da sen söyle ve cevapla."},
{t:"Toplantı İngilizcesi",d:["A|Okay, let's get started.|Tamam, başlayalım.","B|Sorry to interrupt, but can we go over the numbers first?|Böldüğüm için kusura bakma ama önce rakamların üzerinden geçebilir miyiz?","A|Sure. Can everyone see my screen?|Tabii. Herkes ekranımı görebiliyor mu?","B|Yes. Could you scroll down a bit?|Evet. Biraz aşağı kaydırabilir misin?","A|Here. Any questions so far?|İşte. Şu ana kadar soru var mı?","B|Just one. Can we follow up on this next week?|Bir tane. Bunu gelecek hafta takip edebilir miyiz?"],c:["Let's get started.|Başlayalım.","Sorry to interrupt, but...|Böldüğüm için kusura bakma ama...","go over|üzerinden geçmek","Can everyone see my screen?|Herkes ekranımı görebiliyor mu?","Any questions so far?|Şu ana kadar soru var mı?","follow up on|takip etmek","Let's wrap it up.|Toparlayalım.","I'll keep you posted.|Sizi haberdar ederim."],p:"Hayali bir müşteri toplantısını İngilizce aç, bir konuyu sun, soru al ve kapat: \"Let's get started... Let's wrap it up.\""},
{t:"Teşekkür ve özür",d:["A|I'm so sorry I missed your call.|Aramanı kaçırdığım için çok üzgünüm.","B|Don't worry about it.|Dert etme.","A|And I really appreciate you helping me yesterday.|Ve dün bana yardım etmeni gerçekten takdir ediyorum.","B|Anytime. That's what friends are for.|Her zaman. Arkadaşlar bunun için var.","A|Still, I feel bad. Let me buy you lunch.|Yine de içim rahat değil. Sana öğle yemeği ısmarlayayım.","B|You don't have to, but I won't say no!|Gerek yok ama hayır demem!"],c:["I'm so sorry I...|...dığım için çok üzgünüm.","Don't worry about it.|Dert etme.","I really appreciate...|...yı gerçekten takdir ediyorum.","Anytime.|Her zaman.","That's what friends are for.|Arkadaşlar bunun için var.","I feel bad.|İçim rahat değil.","Let me buy you...|Sana ... ısmarlayayım.","I won't say no!|Hayır demem!"],p:"Gerçek hayatından birine teşekkür et, birinden de özür dile. İkisini de 3'er cümleyle, içten söyle."},
{t:"Sokak dili (slang)",d:["A|Dude, that concert was lit!|Kanka, o konser efsaneydi!","B|For real! The vibe was insane.|Gerçekten! Ortam çılgındı.","A|I'm so down to go again next year.|Seneye tekrar gitmeye kesinlikle varım.","B|Same. But I'm totally broke now.|Aynen. Ama şu an tam meteliksizim.","A|No cap, me too.|Yalan yok, ben de.","B|Let's just chill at home this weekend, then.|O zaman bu hafta sonu evde takılalım."],c:["Dude|Kanka / Abi","lit|efsane, çok iyi","For real!|Gerçekten!","the vibe|ortam, hava, enerji","I'm down.|Varım.","I'm broke.|Meteliksizim.","No cap.|Yalan yok.","chill|takılmak, rahatlamak"],p:"Bir arkadaşınla gittiğin bir maç, konser ya da oyun hakkında slang kullanarak 1 dakika konuş."},
{t:"FİNAL: Kendini anlat",d:["A|So, tell me a bit about yourself.|Eee, biraz kendinden bahset.","B|Well, I'm an SAP consultant, and in my free time I make games.|Şey, SAP danışmanıyım ve boş zamanlarımda oyun yapıyorum.","A|Interesting! And how is your English so good?|İlginç! Peki İngilizcen nasıl bu kadar iyi?","B|Thanks! I've been practicing every single day.|Sağ ol! Her gün düzenli pratik yapıyorum.","A|It really shows.|Gerçekten belli oluyor.","B|I appreciate that. I'm still learning, though.|Teşekkür ederim. Gerçi hâlâ öğreniyorum."],c:["Tell me a bit about yourself.|Biraz kendinden bahset.","Well,|Şey,","in my free time|boş zamanlarımda","I've been practicing...|... pratik yapıyorum (bir süredir)","every single day|her gün istisnasız","It really shows.|Gerçekten belli oluyor.","I appreciate that.|Teşekkür ederim, sağ ol.","I'm still learning.|Hâlâ öğreniyorum."],p:"FİNAL: Ses Kayıt uygulamasıyla 2 dakika kesintisiz kendini anlat. Sonra 1. gün yaptığın kaydı dinle ve farkı duy. 🎉"}
];
const SOUNDS=[
{n:"TH /θ/ — think",tr:"Dilinin ucunu dişlerinin arasına koy ve üfle. 't' ya da 's' deme: 'tink' değil 'think'.",w:["think|sink","three|tree","thank|tank","mouth|mouse","Thank you so much."]},
{n:"TH /ð/ — this",tr:"Aynı dil pozisyonu ama ses tellerin titresin. 'd' ya da 'z' deme.",w:["they|day","then|den","those|doze","breathe|breeze","This is the other one."]},
{n:"W ve V",tr:"W'de dudaklarını öpücük gibi yuvarla, dişler dudağa değmez. V'de üst dişlerin alt dudağa değer.",w:["wine|vine","west|vest","wet|vet","while|vile","We were very worried."]},
{n:"Kısa i / uzun ee",tr:"ship'teki i kısa ve gevşektir (ı ile i arası). sheep'teki ee uzun ve gergindir, dudaklar gülümser.",w:["ship|sheep","live|leave","bit|beat","sit|seat","fill|feel"]},
{n:"/æ/ — cat",tr:"Türkçede yok. 'e' derken ağzını iyice aşağı aç: cat, bad, man. 'ket' değil.",w:["bad|bed","man|men","sad|said","pan|pen","That's a bad habit."]},
{n:"Schwa /ə/",tr:"İngilizcenin en sık sesi. Vurgusuz heceler zayıf bir 'ı'ya düşer: about = ı-BAUT, banana = bı-NA-nı.",w:["about","banana","today","problem","a cup of tea"]},
{n:"-ed'in 3 sesi",tr:"p, k, f, s, ş, ç'den sonra /t/ (walked), sesli harf ve yumuşak ünsüzlerden sonra /d/ (played), t ve d'den sonra /ɪd/ (wanted). 'walk-ed' deme!",w:["walked","played","wanted","stopped","needed","I worked late and missed the bus."]},
{n:"-s'in 3 sesi",tr:"cats /s/, dogs /z/, watches /ɪz/. Sondaki -s'i yutma: 'He work' değil 'He works'.",w:["cats","dogs","watches","She works and he plays.","It costs a lot."]},
{n:"Amerikan R",tr:"Dilin hiçbir yere değmez, hafifçe geriye kıvrılır. Türkçedeki gibi titretme.",w:["right","very","car","world","girl","Are you ready?"]},
{n:"gonna, wanna, gotta",tr:"Gündelik konuşmada going to → gonna, want to → wanna, got to → gotta, kind of → kinda, let me → lemme olur. Böyle söylemek seni anında doğal gösterir.",w:["I'm gonna call you.","Do you wanna go?","I gotta go.","It's kinda weird.","Let me see."]},
{n:"Amerikan T (flap)",tr:"İki sesli arasındaki t, hızlı ve yumuşak bir 'd' gibi çıkar: water → 'vadır', better → 'bedır'.",w:["water","better","little","a lot of","Get it?","What about it?"]},
{n:"Kelime vurgusu",tr:"Yanlış hecedeki vurgu, yanlış sesten daha çok anlaşılmayı bozar: PHO-to-graph, pho-TO-gra-phy, de-VE-lop, COMF-ter-bıl. Dinle ve vurgulu heceye bas.",w:["photograph","photography","develop","comfortable","interesting","vegetable"]},
{n:"Kısaltmalar",tr:"Anadili İngilizce olanlar neredeyse hep kısaltır: I am → I'm, do not → don't. Tam hâlini söylemek robotik durur.",w:["I'm","you're","it's","I'll","won't","should've","I'd love to."]},
{n:"Tonlama",tr:"Evet/hayır sorularında ses sonda yükselir ↗, wh- sorularında düşer ↘. Düz tonla konuşmak ilgisiz gibi duyulur.",w:["Are you coming?","Where are you going?","Really?","You're kidding!","What do you mean?"]},
{n:"Bağlama (linking)",tr:"Ünsüzle biten kelime, sesliyle başlayana yapışır: pick it up → 'pi-ki-tap', not at all → 'na-dı-dol'.",w:["pick it up","turn off","not at all","an apple","Check it out."]},
{n:"Sondaki b, d, g",tr:"Türkçede sondaki ses sertleşir (kitap). İngilizcede sertleştirme: bad ≠ bat. Önceki sesli de biraz uzar.",w:["bad|bat","bag|back","dog|dock","prize|price","need|neat"]},
{n:"Baştaki ünsüz grupları",tr:"Başa ya da araya sesli ekleme: 'ıstasyon, sipor' değil 'station, sport'.",w:["sport","school","street","station","special","Stop it."]},
{n:"NG sesi",tr:"Sonuna g ya da k ekleme: 'sing-g' değil 'sing'. Ses burundan çıkar.",w:["sing","thing","going","long","I'm thinking."]},
{n:"Kalın L",tr:"Kelime sonundaki l kalın ve koyudur, dil geride durur: feel, milk, people.",w:["feel","milk","people","world","I'll tell you."]},
{n:"Cümle ritmi",tr:"İngilizce vurgu zamanlıdır: önemli kelimelere bas, 'a, the, to, of, can' gibi küçükleri hızlıca yut. I can GO (kın) ama I CAN'T go (kent).",w:["I want to go to the store.","What do you think about it?","Can I get a coffee?","I can go.","I can't go."]}
];
DAYS.push(
{t:"Eskiden...",g:"'used to' + fiil = eskiden yapardım (artık yapmıyorum). 'I used to play football' = Eskiden futbol oynardım. Telaffuz: 'yustu'.",d:["A|Did you always live in Istanbul?|Hep İstanbul'da mı yaşadın?","B|No, I used to live in Izmir when I was a kid.|Hayır, çocukken İzmir'de yaşardım.","A|Oh nice. Do you miss it?|Aa güzel. Özlüyor musun?","B|Sometimes. We used to go to the beach every weekend.|Bazen. Her hafta sonu denize giderdik.","A|That sounds amazing. I used to hate the beach, actually.|Harika görünüyor. Ben aslında eskiden denizden nefret ederdim.","B|Seriously? What changed?|Cidden mi? Ne değişti?"],c:["I used to...|Eskiden ...rdım.","when I was a kid|çocukken","Do you miss it?|Özlüyor musun?","every weekend|her hafta sonu","That sounds amazing.|Harika görünüyor.","What changed?|Ne değişti?","I didn't use to...|Eskiden ...mazdım.","back then|o zamanlar"],p:"Çocukluğunu 'I used to...' ile anlat: nerede yaşardın, ne oynardın, neyi severdin? En az 6 cümle."},
{t:"Deneyimler",g:"'Have you ever...?' = Hiç ...dın mı? Hayat deneyimini sorar, zaman belirtmez. Cevap: 'Yeah, once.' / 'No, never.' Zaman söylersen geçmiş zamana geç: 'I went there in 2019.'",d:["A|Have you ever been to London?|Hiç Londra'ya gittin mi?","B|Yeah, once. A couple of years ago.|Evet, bir kere. Birkaç yıl önce.","A|How was it?|Nasıldı?","B|Loved it, but it rained the whole time.|Bayıldım ama baştan sona yağmur yağdı.","A|Classic London. I've never been abroad, actually.|Tam Londra. Ben aslında hiç yurt dışına çıkmadım.","B|Really? You've got to go somewhere this year.|Gerçekten mi? Bu yıl bir yere gitmelisin."],c:["Have you ever been to...?|Hiç ...ya gittin mi?","Yeah, once.|Evet, bir kere.","a couple of years ago|birkaç yıl önce","the whole time|baştan sona, sürekli","I've never...|Hiç ...madım.","I've been there twice.|Oraya iki kez gittim.","You've got to...|Mutlaka ...malısın.","It was worth it.|Değdi."],p:"Kendine 5 tane 'Have you ever...?' sorusu sor ve dürüstçe cevapla. Evetse ne zaman olduğunu da söyle."},
{t:"Karşılaştırma",g:"Kısa sıfatlar: cheap → cheaper → the cheapest. Uzunlar: expensive → more expensive → the most expensive. Düzensiz: good → better → the best, bad → worse → the worst.",d:["A|Should I get the iPhone or the Samsung?|iPhone mu alayım Samsung mu?","B|Honestly, the Samsung is way cheaper.|Açıkçası Samsung çok daha ucuz.","A|Yeah, but the iPhone camera is better.|Evet ama iPhone'un kamerası daha iyi.","B|True. But is it worth twice the price?|Doğru. Ama iki katı fiyata değer mi?","A|Good point. It's not that much better.|Haklısın. O kadar da iyi değil.","B|Exactly. Go with the cheaper one.|Aynen. Ucuz olanı al."],c:["way cheaper|çok daha ucuz","better than|...dan daha iyi","the best|en iyisi","Is it worth it?|Değer mi?","twice the price|iki katı fiyat","It's not that much better.|O kadar da iyi değil.","Go with...|...yı seç.","the same as|... ile aynı"],p:"İki şeyi karşılaştır: İstanbul ile İzmir, kahve ile çay, ya da iki telefon. 'better, cheaper, more expensive, the best' kullan."},
{t:"Tavsiye istemek",g:"'What would you do?' = Sen olsan ne yapardın? 'would' hayali durumlar için. Cevap: 'I'd (I would) take the job.'",d:["A|Can I ask you something?|Sana bir şey sorabilir miyim?","B|Sure, go ahead.|Tabii, sor.","A|I got a job offer, but it's in another city. What would you do?|Bir iş teklifi aldım ama başka şehirde. Sen olsan ne yapardın?","B|Hmm, tough one. Is the pay better?|Hmm, zor soru. Maaş daha mı iyi?","A|A lot better. But my family is here.|Çok daha iyi. Ama ailem burada.","B|If I were you, I'd talk it over with them first.|Senin yerinde olsam önce onlarla konuşurdum."],c:["Can I ask you something?|Sana bir şey sorabilir miyim?","Go ahead.|Buyur, sor.","What would you do?|Sen olsan ne yapardın?","Tough one.|Zor soru.","a lot better|çok daha iyi","talk it over|etraflıca konuşmak","What do you suggest?|Ne önerirsin?","I'd go for it.|Ben olsam denerdim."],p:"Kafandaki gerçek bir kararı düşün. Bir arkadaşına anlatıp tavsiye iste, sonra onun yerine geçip kendine tavsiye ver."},
{t:"Plan değişikliği",g:"Plan değiştirirken 'Something came up' (bir şey çıktı) altın kalıptır; detay vermek zorunda değilsin.",d:["A|Hey, about tomorrow... Something came up.|Hey, yarın meselesi... Bir şey çıktı.","B|Oh no. Do you wanna reschedule?|Eyvah. Başka bir güne alalım mı?","A|Yeah, sorry about that. How about Thursday?|Evet, kusura bakma. Perşembe nasıl?","B|Thursday doesn't really work for me. Friday?|Perşembe bana pek uymuyor. Cuma?","A|Friday works. Same time?|Cuma olur. Aynı saat?","B|Perfect. Let's just push it back a day.|Harika. Bir gün erteleyelim o zaman."],c:["Something came up.|Bir şey çıktı.","reschedule|başka zamana almak","Sorry about that.|Kusura bakma.","It doesn't work for me.|Bana uymuyor.","Friday works.|Cuma olur.","Same time?|Aynı saat?","push it back|ertelemek","Can we move it to...?|...ya alabilir miyiz?"],p:"Bir arkadaşınla buluşmayı iptal edip yeni gün ayarla. Önce sen iptal et, sonra o iptal etsin."},
{t:"Doktorda",g:"Ağrıyı anlatmanın en doğal yolu: 'My ... hurts' ya da 'I've got a ...ache' (headache, stomachache, backache).",d:["A|So, what brings you in today?|Eee, bugün sizi buraya ne getirdi?","B|I've had a terrible headache for three days.|Üç gündür korkunç bir baş ağrım var.","A|I see. Any fever?|Anlıyorum. Ateş var mı?","B|A little, at night. And my throat hurts.|Biraz, geceleri. Bir de boğazım ağrıyor.","A|Okay, let me take a look. Open wide.|Tamam, bir bakayım. Ağzınızı açın.","B|Is it serious?|Ciddi bir şey mi?"],c:["What brings you in today?|Bugün neden geldiniz?","I've had ... for three days.|Üç gündür ... var.","a terrible headache|korkunç baş ağrısı","My throat hurts.|Boğazım ağrıyor.","Any fever?|Ateş var mı?","Let me take a look.|Bir bakayım.","Is it serious?|Ciddi mi?","I feel dizzy.|Başım dönüyor."],p:"Doktora gittiğini hayal et. Hangi şikâyetin var, ne zamandır, ne yaptın? Hem doktor hem hasta ol."},
{t:"Otel",g:"'I'd like to...' (I would like) kibar istek kalıbıdır. 'I want' kaba durabilir; resmi yerde 'I'd like' de.",d:["A|Hi, I have a reservation under Ozen.|Merhaba, Özen adına rezervasyonum var.","B|Welcome! Can I see your ID, please?|Hoş geldiniz! Kimliğinizi görebilir miyim?","A|Here you go. Is breakfast included?|Buyurun. Kahvaltı dahil mi?","B|Yes, it's served from seven to ten.|Evet, yediden ona kadar veriliyor.","A|Great. And I'd like a late checkout, if possible.|Harika. Mümkünse geç çıkış da istiyorum.","B|No problem. I can do one o'clock for you.|Sorun değil. Size saat bire kadar verebilirim."],c:["I have a reservation under...|... adına rezervasyonum var.","Is breakfast included?|Kahvaltı dahil mi?","I'd like...|...istiyorum (kibar)","if possible|mümkünse","late checkout|geç çıkış","What's the Wi-Fi password?|Wi-Fi şifresi ne?","The AC isn't working.|Klima çalışmıyor.","Could I get an extra towel?|Bir havlu daha alabilir miyim?"],p:"Otele giriş yap: rezervasyonunu söyle, kahvaltıyı sor, Wi-Fi şifresini iste, odadaki bir sorunu bildir."},
{t:"Havalimanı",g:"Havalimanında soru kalıbı: 'Where's the...?' ve 'Is this the line for...?' çoğu durumu çözer.",d:["A|Excuse me, is this the line for check-in?|Affedersiniz, check-in sırası bu mu?","B|Yes, but you can also check in online.|Evet ama online da yapabilirsiniz.","A|I already did. I just need to drop off my bag.|Yaptım zaten. Sadece bavulumu bırakmam lazım.","B|Then go to the bag drop over there.|O zaman şuradaki bagaj bırakma noktasına gidin.","A|Thanks. Do you know if the flight is on time?|Sağ olun. Uçuş zamanında mı, biliyor musunuz?","B|It's delayed about thirty minutes, I'm afraid.|Maalesef yarım saat kadar rötarlı."],c:["Is this the line for...?|... sırası bu mu?","check in online|online check-in yapmak","drop off my bag|bavulumu bırakmak","over there|şurada","on time|zamanında","It's delayed.|Rötarlı.","I'm afraid...|Maalesef...","Where's gate twelve?|On iki numaralı kapı nerede?"],p:"Havalimanında baştan sona yolculuk yap: sırayı sor, bavulu bırak, rötarı öğren, kapıyı bul."},
{t:"Ev ve kira",g:"'There is / There are' bir yerde ne olduğunu anlatır: 'There's a balcony.' 'There are two bedrooms.' Konuşmada hep 'There's' diye kısalt.",d:["A|So, how's the new apartment?|Eee, yeni ev nasıl?","B|I love it. There's a big balcony and lots of light.|Bayılıyorum. Büyük bir balkon var, bol ışık alıyor.","A|Nice! How much is the rent?|Güzel! Kira ne kadar?","B|It's a bit steep, but it's close to work.|Biraz tuzlu ama işe yakın.","A|That's worth it. No more traffic!|Buna değer. Artık trafik yok!","B|Exactly. I just walk there in ten minutes.|Aynen. On dakikada yürüyerek gidiyorum."],c:["There's a...|Bir ... var.","lots of light|bol ışık","How much is the rent?|Kira ne kadar?","It's a bit steep.|Biraz tuzlu. (pahalı)","close to work|işe yakın","No more...|Artık ... yok!","The landlord is great.|Ev sahibi harika.","I'm moving out.|Taşınıyorum. (evden çıkıyorum)"],p:"Evini bir yabancıya tanıt: kaç oda var, en sevdiğin yer neresi, neyi değiştirmek isterdin? 'There's / There are' kullan."},
{t:"Teknoloji sorunları",g:"'keep + -ing' = sürekli ...yor (sinir bozucu tekrar): 'It keeps crashing.' Çok doğal ve sık kullanılır.",d:["A|My laptop keeps freezing. It's driving me crazy.|Laptopum sürekli donuyor. Beni deli ediyor.","B|Have you tried turning it off and on again?|Kapatıp açmayı denedin mi?","A|Ha, of course. It didn't help.|Ha, tabii ki. İşe yaramadı.","B|Maybe it needs an update. Or more memory.|Belki güncelleme lazım. Ya da daha fazla bellek.","A|Can you take a look at it later?|Sonra bir bakabilir misin?","B|Sure, bring it over tonight.|Tabii, bu akşam getir."],c:["It keeps freezing.|Sürekli donuyor.","It's driving me crazy.|Beni deli ediyor.","turn it off and on again|kapatıp açmak","It didn't help.|İşe yaramadı.","It needs an update.|Güncelleme lazım.","take a look at it|bir bakmak","bring it over|getirmek (bana)","It's not working.|Çalışmıyor."],p:"Bilgisayarında ya da telefonunda yaşadığın bir sorunu anlat: ne oluyor, ne denedin, ne işe yaramadı?"},
{t:"Spor ve sağlık",g:"Düzenli alışkanlık için 'I try to...' (…meye çalışıyorum) ve sıklık: 'three times a week' (haftada üç kez).",d:["A|You look great! Have you been working out?|Harika görünüyorsun! Spor mu yapıyorsun?","B|Thanks! I've been going to the gym three times a week.|Sağ ol! Haftada üç kez spor salonuna gidiyorum.","A|Wow. I keep telling myself I'll start.|Vay. Ben de sürekli başlayacağım diyorum kendime.","B|Just start small. Even a walk helps.|Küçük başla. Yürüyüş bile işe yarar.","A|Yeah, I need to cut down on sugar, too.|Evet, şekeri de azaltmam lazım.","B|Same. It's harder than it sounds.|Aynen. Göründüğünden zor."],c:["Have you been working out?|Spor mu yapıyorsun?","three times a week|haftada üç kez","I keep telling myself...|Kendime sürekli ... diyorum.","Start small.|Küçük başla.","cut down on|azaltmak","I try to...|...meye çalışıyorum.","It's harder than it sounds.|Göründüğünden zor.","I'm out of shape.|Formsuzum."],p:"Sağlık alışkanlıklarını anlat: ne yapıyorsun, neyi azaltmak istiyorsun, hangi hedefin var?"},
{t:"Dizi ve film",g:"Önermek için 'You should watch...', uyarmak için 'No spoilers!' Bir dizi bağımlılığı: 'I binge-watched it.'",d:["A|Have you seen anything good lately?|Son zamanlarda iyi bir şey izledin mi?","B|Yes! I just binge-watched a crime series. So good.|Evet! Bir suç dizisini bir oturuşta bitirdim. Çok iyi.","A|What's it about?|Ne hakkında?","B|A detective who... Actually, no spoilers. Just watch it.|Bir dedektif... Aslında spoiler yok. Sadece izle.","A|Okay, but is it scary? I can't do scary.|Tamam ama korkunç mu? Korku kaldıramam.","B|Not really. It's more of a thriller.|Pek değil. Daha çok gerilim."],c:["Have you seen anything good lately?|Son zamanlarda iyi bir şey izledin mi?","binge-watch|bir oturuşta izlemek","What's it about?|Ne hakkında?","No spoilers!|Spoiler yok!","Just watch it.|Sadece izle.","I can't do scary.|Korkuya gelemem.","It's more of a...|Daha çok bir ...","It's worth watching.|İzlemeye değer."],p:"En sevdiğin diziyi spoiler vermeden anlat ve neden izlenmesi gerektiğini söyle."},
{t:"Haber ve dedikodu",g:"'Did you hear about...?' haber açar; 'Apparently, ...' (Duyduğuma göre) emin olmadığın bilgiyi verir.",d:["A|Did you hear about Emre?|Emre'yi duydun mu?","B|No, what happened?|Hayır, ne oldu?","A|Apparently, he quit his job and moved to Bali.|Duyduğuma göre işi bırakıp Bali'ye taşınmış.","B|No way! Out of nowhere?|Yok artık! Durduk yere mi?","A|Pretty much. He said he needed a change.|Hemen hemen. Değişime ihtiyacı varmış.","B|Good for him. I'm kind of jealous, honestly.|Ne güzel. Açıkçası biraz kıskandım."],c:["Did you hear about...?|...yı duydun mu?","What happened?|Ne oldu?","Apparently,|Duyduğuma göre,","quit his job|işi bıraktı","Out of nowhere?|Durduk yere mi?","Pretty much.|Hemen hemen.","He needed a change.|Değişime ihtiyacı vardı.","I'm kind of jealous.|Biraz kıskandım."],p:"Son duyduğun bir haberi (ünlü, spor, iş) 'Did you hear about...? Apparently...' ile anlat."},
{t:"Pişmanlık",g:"'I should have + V3' = ...malıydım (ama yapmadım). Konuşmada 'should've' → 'şudıv'. 'I shouldn't have...' = ...mamalıydım.",d:["A|Ugh, I'm so tired today.|Off, bugün çok yorgunum.","B|Late night?|Geç mi yattın?","A|Yeah. I should've gone to bed earlier.|Evet. Daha erken yatmalıydım.","B|What were you doing?|Ne yapıyordun?","A|Watching videos. I shouldn't have started that series.|Video izliyordum. O diziye hiç başlamamalıydım.","B|Ha, we've all been there.|Ha, hepimiz yaşadık."],c:["I should've...|...malıydım.","I shouldn't have...|...mamalıydım.","Late night?|Geç mi yattın?","go to bed earlier|daha erken yatmak","What were you doing?|Ne yapıyordun?","We've all been there.|Hepimiz yaşadık.","I wish I had...|Keşke ...saydım.","Lesson learned.|Ders alındı."],p:"Hayatında 3 küçük pişmanlığını 'I should've...' ve 'I shouldn't have...' ile anlat (komik olanları seç)."},
{t:"Hayaller ve varsayımlar",g:"Hayali durum: 'If I won the lottery, I'd buy a house.' If + geçmiş zaman, sonra 'I'd'. Gerçek değil, hayal.",d:["A|What would you do if you won the lottery?|Piyango çıksa ne yapardın?","B|First, I'd quit my job. Obviously.|Önce işi bırakırdım. Tabii ki.","A|Ha! And then?|Ha! Sonra?","B|I'd travel the world for a year.|Bir yıl dünyayı gezerdim.","A|Same. And I'd buy my parents a house.|Aynen. Bir de anneme babama ev alırdım.","B|Aw, that's sweet.|Ay, ne tatlı."],c:["What would you do if...?|... olsa ne yapardın?","If I won the lottery,|Piyango çıksa,","I'd quit my job.|İşi bırakırdım.","Obviously.|Tabii ki. / Belli.","And then?|Sonra?","travel the world|dünyayı gezmek","If I were rich,|Zengin olsam,","That's sweet.|Ne tatlı."],p:"Piyango çıksa, süper gücün olsa ve bir gün görünmez olsan ne yapardın? Her biri için 3 cümle."},
{t:"Kibarca reddetmek",g:"İngilizcede direkt 'No' kaba durabilir. 'I'd love to, but...' ile yumuşat, sonra bir alternatif sun.",d:["A|We're going bowling tonight. You in?|Bu akşam bowlinge gidiyoruz. Var mısın?","B|I'd love to, but I've got a deadline tomorrow.|Çok isterdim ama yarın teslim tarihim var.","A|Come on, just for an hour!|Hadi ama, bir saatliğine!","B|I really can't. Maybe next time?|Gerçekten olmaz. Belki bir dahaki sefere?","A|Okay, I'll hold you to that.|Tamam, sözünü tutmanı bekliyorum.","B|Deal. Have fun!|Anlaştık. İyi eğlenceler!"],c:["You in?|Var mısın?","I'd love to, but...|Çok isterdim ama...","I've got a deadline.|Teslim tarihim var.","I really can't.|Gerçekten olmaz.","Maybe next time?|Belki bir dahaki sefere?","I'll hold you to that.|Sözünü tutacaksın ama.","Rain check?|Başka zaman olur mu?","Have fun!|İyi eğlenceler!"],p:"Üç farklı daveti kibarca reddet ve her birine alternatif öner: düğün, maç, iş yemeği."},
{t:"Pazarlık",g:"Pazarlıkta 'Is there any way...?' ve 'Can you do better?' kibar ama nettir.",d:["A|This jacket is nice. How much is it?|Bu ceket güzel. Ne kadar?","B|It's two hundred dollars.|İki yüz dolar.","A|Hmm, that's a bit out of my budget. Can you do better?|Hmm, bütçemi biraz aşıyor. Daha iyi yapabilir misiniz?","B|I could do one eighty.|Yüz seksen yapabilirim.","A|How about one fifty if I pay cash?|Nakit ödersem yüz elliye ne dersiniz?","B|Let's meet in the middle. One sixty-five.|Ortada buluşalım. Yüz altmış beş."],c:["How much is it?|Ne kadar?","out of my budget|bütçemin dışında","Can you do better?|Daha iyi yapabilir misiniz?","How about...?|...ye ne dersiniz?","if I pay cash|nakit ödersem","Let's meet in the middle.|Ortada buluşalım.","That's my final offer.|Son teklifim bu.","It's a deal.|Anlaştık."],p:"Kapalıçarşı'da bir halı al gibi pazarlık et. Hem satıcı hem müşteri ol, en az 3 tur pazarlık yap."},
{t:"Resmi telefon",g:"Telefonda kendini tanıtırken 'This is Safa' denir, 'I am Safa' değil. 'Could I speak to...?' resmi ve kibar.",d:["A|Good morning, ABC Company. How can I help you?|Günaydın, ABC Şirketi. Nasıl yardımcı olabilirim?","B|Hi, this is Safa from Delta. Could I speak to Mr. Brown?|Merhaba, ben Delta'dan Safa. Bay Brown ile görüşebilir miyim?","A|I'm afraid he's in a meeting right now.|Maalesef şu an toplantıda.","B|No problem. Could you ask him to call me back?|Sorun değil. Beni geri aramasını söyler misiniz?","A|Of course. Can I get your number?|Tabii. Numaranızı alabilir miyim?","B|Sure. It's five five five, two one two, eight nine eight nine.|Tabii. Beş beş beş, iki bir iki, sekiz dokuz sekiz dokuz."],c:["This is ... from ...|Ben ...dan ...","Could I speak to...?|... ile görüşebilir miyim?","He's in a meeting.|Toplantıda.","Could you ask him to call me back?|Beni geri aramasını söyler misiniz?","Can I get your number?|Numaranızı alabilir miyim?","Can I leave a message?|Mesaj bırakabilir miyim?","Sorry, you're breaking up.|Pardon, sesiniz kesiliyor.","Could you repeat that?|Tekrar eder misiniz?"],p:"Yabancı bir müşteriyi ara: kendini tanıt, kişiyi iste, mesaj bırak, numaranı söyle. Numarayı İngilizce rakam rakam söyle."},
{t:"İş e-postası (sesli)",g:"İş dilinde 'Just following up on...' (… konusunu takip ediyorum) ve 'Let me know' en çok kullanılan kalıplardır.",d:["A|Hi Tom, just following up on my email from Monday.|Selam Tom, pazartesi attığım e-postayı takip ediyorum.","B|Oh, sorry! It totally slipped my mind.|Ah, kusura bakma! Tamamen aklımdan çıkmış.","A|No worries. Did you get a chance to look at the report?|Dert etme. Rapora bakma fırsatın oldu mu?","B|Not yet, but I'll get to it today.|Henüz değil ama bugün bakacağım.","A|Great. Let me know if you have any questions.|Harika. Sorun olursa haber ver.","B|Will do. I'll get back to you by end of day.|Tamamdır. Gün sonuna kadar dönerim."],c:["Just following up on...|... konusunu takip ediyorum.","It slipped my mind.|Aklımdan çıktı.","Did you get a chance to...?|...me fırsatın oldu mu?","I'll get to it today.|Bugün ilgileneceğim.","Let me know if...|...sa haber ver.","by end of day|gün sonuna kadar","Please find attached...|Ekte ... bulabilirsiniz.","Looking forward to hearing from you.|Dönüşünüzü bekliyorum."],p:"Bir müşteriye sesli e-posta yaz (yüksek sesle söyleyerek): rapor gönderdiğini, geri dönüş beklediğini, soru olursa ulaşmasını söyle."},
{t:"İş görüşmesi 1",g:"Deneyimini anlatırken 'I've been working as... for... years' (… yıldır … olarak çalışıyorum) en güçlü cümledir.",d:["A|So, tell me a little about your background.|Peki, biraz geçmişinden bahset.","B|Sure. I've been working as an SAP FI consultant for eight years.|Tabii. Sekiz yıldır SAP FI danışmanı olarak çalışıyorum.","A|What kind of projects have you worked on?|Ne tür projelerde çalıştın?","B|Mostly S/4HANA implementations and custom finance reports.|Çoğunlukla S/4HANA geçişleri ve özel finans raporları.","A|Impressive. Why are you interested in this role?|Etkileyici. Bu pozisyonla neden ilgileniyorsun?","B|I'm looking for a new challenge and an international team.|Yeni bir meydan okuma ve uluslararası bir ekip arıyorum."],c:["Tell me about your background.|Geçmişinden bahset.","I've been working as ... for ... years.|... yıldır ... olarak çalışıyorum.","What kind of projects...?|Ne tür projeler...?","I'm responsible for...|...dan sorumluyum.","I'm looking for a new challenge.|Yeni bir meydan okuma arıyorum.","Why are you interested in this role?|Bu pozisyonla neden ilgileniyorsun?","hands-on experience|uygulamalı deneyim","I'm a fast learner.|Hızlı öğrenirim."],p:"Yabancı bir şirkette iş görüşmesindesin. Geçmişini, projelerini ve neden bu işi istediğini 2 dakika anlat."},
{t:"İş görüşmesi 2",g:"Zayıf yönü sorulunca: zayıflık + nasıl geliştirdiğin. 'I'm working on it' cümlesi çok işe yarar.",d:["A|What would you say is your biggest strength?|En büyük güçlü yönün nedir?","B|I'm really good at solving problems under pressure.|Baskı altında sorun çözmekte çok iyiyim.","A|And your biggest weakness?|Peki en büyük zayıflığın?","B|Honestly, my English. But I'm working on it every day.|Açıkçası İngilizcem. Ama her gün üzerinde çalışıyorum.","A|I appreciate the honesty. It sounds great so far.|Dürüstlüğün için teşekkürler. Şu ana kadar çok iyi.","B|Thank you. Can I ask you a few questions about the team?|Teşekkürler. Ekip hakkında birkaç soru sorabilir miyim?"],c:["my biggest strength|en güçlü yönüm","I'm good at ...ing|...mekte iyiyim","under pressure|baskı altında","my biggest weakness|en büyük zayıflığım","I'm working on it.|Üzerinde çalışıyorum.","I appreciate the honesty.|Dürüstlüğünü takdir ediyorum.","so far|şu ana kadar","What does a typical day look like?|Tipik bir gün nasıl geçiyor?"],p:"İş görüşmesinde güçlü ve zayıf yönlerini anlat, sonra görüşmeciye 2 soru sor."},
{t:"Sunum yapmak",g:"Sunum geçiş kalıpları: 'Let me walk you through...' (adım adım anlatayım), 'Moving on to...' (… konusuna geçelim).",d:["A|Okay, let me walk you through the new process.|Tamam, size yeni süreci adım adım anlatayım.","A|First, the invoice comes in and gets checked automatically.|Önce fatura gelir ve otomatik kontrol edilir.","B|What happens if there's an error?|Hata olursa ne oluyor?","A|Good question. It goes back to the team for review.|Güzel soru. İnceleme için ekibe geri döner.","A|Moving on to the timeline. We go live in March.|Takvime geçelim. Martta canlıya geçiyoruz.","B|Sounds clear. Thanks for walking us through it.|Gayet net. Anlattığın için teşekkürler."],c:["Let me walk you through...|Size ...yı adım adım anlatayım.","First,|Önce,","What happens if...?|... olursa ne olur?","Good question.|Güzel soru.","Moving on to...|...ya geçelim.","We go live in March.|Martta canlıya geçiyoruz.","To sum up,|Özetlemek gerekirse,","Does that make sense?|Anlaşılır mı?"],p:"İşindeki bir süreci (ör. ödeme süreci) 2 dakikalık mini sunum gibi anlat. 'First, then, moving on, to sum up' kullan."},
{t:"Birlikte çözüm bulmak",g:"Öneri sunmanın yumuşak yolu: 'What if we...?' (Ya şöyle yapsak?) ve 'Why don't we...?'",d:["A|We're running out of time. Any ideas?|Zaman daralıyor. Fikri olan?","B|What if we split the work into two teams?|Ya işi iki ekibe bölsek?","A|That could work. But who's gonna lead the second team?|Olabilir. Ama ikinci ekibi kim yönetecek?","B|I can take it on.|Ben üstlenebilirim.","A|Are you sure? You've got a lot on your plate.|Emin misin? Zaten başın kalabalık.","B|I'll manage. Let's give it a try.|Hallederim. Bir deneyelim."],c:["We're running out of time.|Zaman daralıyor.","Any ideas?|Fikri olan?","What if we...?|Ya ... yapsak?","That could work.|Olabilir. / İşe yarayabilir.","take it on|üstlenmek","You've got a lot on your plate.|Başın kalabalık.","I'll manage.|Hallederim.","Let's give it a try.|Bir deneyelim."],p:"İşte bir sorun hayal et ve 'What if we...? Why don't we...?' ile 3 çözüm öner, her birinin artısını söyle."},
{t:"Kibarca rahatsızlık",g:"İngilizcede öfke yumuşatılarak söylenir: 'I'm a bit frustrated' aslında 'çok sinirliyim' demektir.",d:["A|Can I be honest with you about something?|Sana bir konuda dürüst olabilir miyim?","B|Of course. What's up?|Tabii. Ne oldu?","A|I'm a bit frustrated that the report was late again.|Raporun yine geç gelmesine biraz bozuldum.","B|You're right. I'm sorry. I underestimated the work.|Haklısın. Özür dilerim. İşi hafife aldım.","A|I get it. Just give me a heads-up next time.|Anlıyorum. Bir dahaki sefere önceden haber ver yeter.","B|Absolutely. It won't happen again.|Kesinlikle. Bir daha olmayacak."],c:["Can I be honest with you?|Sana dürüst olabilir miyim?","I'm a bit frustrated.|Biraz bozuldum.","You're right.|Haklısın.","I underestimated...|...yı hafife aldım.","I get it.|Anlıyorum.","Give me a heads-up.|Önceden haber ver.","It won't happen again.|Bir daha olmayacak.","No hard feelings.|Kırgınlık yok."],p:"Seni rahatsız eden bir durumu kibarca dile getir, sonra karşı tarafın özrünü kabul et."},
{t:"Övgü ve iltifat",g:"Doğal övgü kalıpları: 'You nailed it' (tam on ikiden vurdun), 'Great job'. İltifatı kabul ederken 'Thanks, that means a lot.'",d:["A|That presentation was amazing. You nailed it!|O sunum harikaydı. Tam on ikiden vurdun!","B|Really? I was so nervous.|Gerçekten mi? Çok gergindim.","A|It didn't show at all. You were super confident.|Hiç belli olmadı. Çok özgüvenliydin.","B|Thanks, that means a lot coming from you.|Sağ ol, senden duymak çok değerli.","A|And I love your new haircut, by the way.|Bu arada yeni saç kesimine de bayıldım.","B|Ha, thanks! I wasn't sure about it.|Ha, sağ ol! Emin değildim aslında."],c:["You nailed it!|Tam on ikiden vurdun!","I was so nervous.|Çok gergindim.","It didn't show at all.|Hiç belli olmadı.","super confident|çok özgüvenli","That means a lot.|Çok değerli.","coming from you|senden duymak","I love your...|...na bayıldım.","Great job!|Harika iş!"],p:"Üç kişiye (eş, iş arkadaşı, arkadaş) içten iltifat et. Sonra sana yapılan bir iltifatı kabul et."},
{t:"Tarif anlatmak",g:"Talimat verirken emir kipi kullanılır: 'Chop the onions. Add some salt.' Sıralama: First, then, after that, finally.",d:["A|This menemen is so good! How do you make it?|Bu menemen çok güzel! Nasıl yapıyorsun?","B|It's easy. First, you chop some peppers and fry them.|Kolay. Önce biber doğrayıp kızartıyorsun.","A|Okay. And then?|Tamam. Sonra?","B|Then you add tomatoes and let them cook down.|Sonra domatesleri ekleyip suyunu çektiriyorsun.","A|And the eggs go in last?|Yumurtalar en son mu giriyor?","B|Exactly. Crack the eggs and stir gently. That's it!|Aynen. Yumurtaları kır ve yavaşça karıştır. Bu kadar!"],c:["How do you make it?|Nasıl yapıyorsun?","First, you...|Önce ...","chop|doğramak","fry|kızartmak","Then you add...|Sonra ... ekliyorsun","let it cook|pişmeye bırakmak","stir gently|yavaşça karıştırmak","That's it!|Bu kadar!"],p:"En sevdiğin Türk yemeğinin tarifini bir yabancıya anlat. 'First, then, after that, finally' kullan."},
{t:"Yolculuk anısı",g:"Hikâyede arka plan için 'was/were + -ing', ani olay için geçmiş zaman: 'I was walking home when it started to rain.'",d:["A|So I was walking around Rome when it started pouring.|Roma'da geziniyordum ki sağanak başladı.","B|Oh no! Did you have an umbrella?|Eyvah! Şemsiyen var mıydı?","A|Nope. So I ran into this tiny café.|Yok. Ben de küçücük bir kafeye daldım.","B|Let me guess, best coffee of your life?|Dur tahmin edeyim, hayatının en iyi kahvesi?","A|Exactly! And the owner told me his whole life story.|Aynen! Bir de sahibi bana bütün hayat hikâyesini anlattı.","B|That's the best kind of travel story.|En güzel yolculuk hikâyesi böyle olur."],c:["I was ...ing when...|...yordum ki ...","It started pouring.|Sağanak başladı.","Nope.|Yok. / Hayır.","I ran into...|...ya daldım / rastladım","Let me guess,|Dur tahmin edeyim,","the best ... of my life|hayatımın en iyi ...","his whole life story|bütün hayat hikâyesi","That's the best kind of...|En güzel ... böyle olur."],p:"Bir yolculuk anını 'I was ...ing when...' ile başlatıp 1 dakika anlat. Beklenmedik bir şey olsun."},
{t:"Kararsızlık",g:"'I'm torn between A and B' = A ile B arasında kaldım. 'On the one hand... on the other hand...' artı-eksi tartmak için.",d:["A|Where are you going for vacation?|Tatile nereye gidiyorsun?","B|I'm torn between Greece and Georgia.|Yunanistan ile Gürcistan arasında kaldım.","A|Tough choice. What's the problem?|Zor seçim. Sorun ne?","B|On the one hand, Greece has beaches. On the other hand, Georgia is cheaper.|Bir yandan Yunanistan'da plaj var. Öte yandan Gürcistan daha ucuz.","A|Why not flip a coin?|Neden yazı tura atmıyorsun?","B|Ha! Maybe I will. I can't make up my mind.|Ha! Belki atarım. Bir türlü karar veremiyorum."],c:["I'm torn between...|... arasında kaldım.","Tough choice.|Zor seçim.","On the one hand,|Bir yandan,","On the other hand,|Öte yandan,","flip a coin|yazı tura atmak","I can't make up my mind.|Karar veremiyorum.","I'm leaning towards...|...ya meylediyorum.","Either way,|Her iki durumda da,"],p:"Kararsız kaldığın iki şeyi (iş, tatil, telefon) 'On the one hand... on the other hand...' ile tart ve sonunda karar ver."},
{t:"Yemek daveti",g:"Misafirlikte 'Make yourself at home' (kendi evin gibi rahat ol) ve 'Help yourself' (buyur, kendin al) en sık duyulan kalıplardır.",d:["A|Come on in! Make yourself at home.|Gel içeri! Kendi evin gibi rahat ol.","B|Thanks for having me. I brought some dessert.|Davetin için teşekkürler. Biraz tatlı getirdim.","A|Oh, you shouldn't have! That's so sweet.|Ah, zahmet etmeseydin! Çok naziksin.","B|Something smells amazing. What are we having?|Bir şey harika kokuyor. Ne yiyoruz?","A|Lasagna. Help yourself to some salad while it's in the oven.|Lazanya. Fırındayken buyur salata al.","B|Don't mind if I do.|Hayır demem."],c:["Make yourself at home.|Kendi evin gibi rahat ol.","Thanks for having me.|Davetin için teşekkürler.","You shouldn't have!|Zahmet etmeseydin!","Something smells amazing.|Bir şey harika kokuyor.","What are we having?|Ne yiyoruz?","Help yourself.|Buyur, kendin al.","Don't mind if I do.|Hayır demem.","I'm stuffed.|Patladım, çok doydum."],p:"Yabancı bir arkadaşını evine yemeğe davet et: karşıla, yemeği tanıt, ikram et, vedalaş. Sonra misafir sen ol."},
{t:"SEVİYE 2 FİNAL: Tartışma",g:"Fikir savunma iskeleti: görüş → sebep → örnek → sonuç. 'I believe... because... For example... That's why...'",d:["A|Okay, hot take: working from home is better than the office.|Tamam, iddialı görüş: evden çalışmak ofisten daha iyi.","B|I'm not sure I agree. Why do you think so?|Katıldığımdan emin değilim. Neden öyle düşünüyorsun?","A|Because I save two hours a day. No traffic, no stress.|Çünkü günde iki saat kazanıyorum. Trafik yok, stres yok.","B|Fair enough, but don't you miss your coworkers?|Anlaşılır ama iş arkadaşlarını özlemiyor musun?","A|Sometimes. That's why I think hybrid is the best of both worlds.|Bazen. Bu yüzden bence hibrit iki dünyanın en iyisi.","B|Okay, I can live with that answer.|Tamam, bu cevaba razıyım."],c:["Hot take:|İddialı görüş:","I'm not sure I agree.|Katıldığımdan emin değilim.","Why do you think so?|Neden öyle düşünüyorsun?","I believe ... because ...|Bence ... çünkü ...","For example,|Örneğin,","That's why...|Bu yüzden...","the best of both worlds|iki dünyanın en iyisi","I can live with that.|Buna razıyım."],p:"SEVİYE 2 FİNALİ: 'Yapay zekâ işleri elimizden alacak mı?' konusunda 2 dakika fikrini savun. Kaydet ve 1. gün kaydınla karşılaştır!"}
);

DAYS.push(
{t:"Hızlı konuşmayı çözmek",g:"Hızlı konuşmada kelimeler erir: What are you → 'whatcha', Did you → 'didja', Don't you → 'doncha', Give me → 'gimme'. Yazarken değil ama dinlerken bunları tanı.",d:["A|Whatcha doing later?|Sonra ne yapıyorsun?","B|Nothing much. Didja have something in mind?|Pek bir şey. Aklında bir şey mi var?","A|Gimme a sec. I'm checking the movie times.|Bir saniye. Film saatlerine bakıyorum.","B|Doncha wanna eat first, though?|Ama önce yemek yemek istemez misin?","A|Good call. Let's grab some food and then see a movie.|İyi fikir. Bir şeyler yiyip sonra film izleyelim.","B|Sounds like a plan.|Plan gibi duruyor, tamam."],c:["Whatcha doing?|Ne yapıyorsun? (What are you)","Didja...?|...dın mı? (Did you)","Gimme a sec.|Bir saniye ver.","Doncha wanna...?|...mek istemez misin?","Good call.|İyi fikir. / İsabetli karar.","Sounds like a plan.|Tamamdır, plan bu.","Lemme know.|Haber ver. (Let me know)","Gotcha.|Anladım. (Got you)"],p:"Bugünkü kalıpları hızlı söyleyerek bir arkadaşınla akşam planı yap. Sonra aynı cümleleri yavaş ve tam söyle, farkı hisset."},
{t:"Takılma ve espri",g:"İngiliz/Amerikan arkadaşlığında hafif takılma (teasing) sevgi göstergesidir. Ton çok önemli: gülümseyerek söyle.",d:["A|Are you seriously wearing sunglasses inside?|Cidden içeride güneş gözlüğü mü takıyorsun?","B|What? It's a look.|Ne var? Bu bir tarz.","A|Okay, Mr. Hollywood.|Tamam, Bay Hollywood.","B|Don't be jealous. Not everyone can pull this off.|Kıskanma. Herkes bunu taşıyamaz.","A|Ha! You're too much.|Ha! Sen bir harikasın. (abartıyorsun)","B|I know. That's why you love me.|Biliyorum. O yüzden beni seviyorsun."],c:["Are you seriously...?|Cidden ... mı?","It's a look.|Bu bir tarz.","Don't be jealous.|Kıskanma.","pull it off|bir şeyi başarıyla taşımak/yapmak","You're too much!|Sen bir harikasın! (şakayla)","That's why you love me.|O yüzden beni seviyorsun.","I'm just teasing.|Sadece takılıyorum.","You wish!|Hayal et! / Ne gezer!"],p:"Yakın bir arkadaşınla şakalaşıyormuş gibi 1 dakika konuş. Takıl, takılmaya cevap ver, sonunda 'I'm just teasing' de."},
{t:"Phrasal verbs 3 (iş)",g:"İş dünyasında phrasal verb'ler resmi kelimelerden daha doğal duyulur: 'postpone' yerine 'put off', 'solve' yerine 'sort out'.",d:["A|Did anyone come up with a solution for the bug?|Hata için bir çözüm bulan oldu mu?","B|Not yet. I ran into the same issue yesterday.|Henüz değil. Dün aynı soruna ben de rastladım.","A|We can't put it off any longer. The client is waiting.|Daha fazla erteleyemeyiz. Müşteri bekliyor.","B|I know. Let me sort it out this afternoon.|Biliyorum. Bu öğleden sonra halledeyim.","A|Thanks. Back me up in the meeting if they ask?|Sağ ol. Toplantıda sorarlarsa bana destek olur musun?","B|Of course. Carry on with the testing for now.|Tabii. Şimdilik teste devam et."],c:["come up with|(fikir, çözüm) bulmak","run into|rastlamak, karşılaşmak","put off|ertelemek","sort out|halletmek, çözmek","back someone up|birine destek olmak","carry on|devam etmek","set up a meeting|toplantı ayarlamak","point out|belirtmek, dikkat çekmek"],p:"Son iş haftanı bu 8 phrasal verb'ü kullanarak anlat. Her birini en az bir kez kullan."},
{t:"Phrasal verbs 4 (ilişkiler)",g:"İlişki phrasal verb'leri günlük sohbetin temelidir: 'get along with', 'fall out', 'make up', 'put up with'.",d:["A|Are you and Can still not talking?|Can'la hâlâ konuşmuyor musunuz?","B|No, we made up last week. Finally.|Hayır, geçen hafta barıştık. Nihayet.","A|Good. What did you fall out over anyway?|İyi. Zaten neden bozuşmuştunuz?","B|Something stupid about money. I'm over it now.|Para yüzünden saçma bir şey. Artık geçti.","A|Glad to hear it. You two always got along so well.|Buna sevindim. İkiniz hep çok iyi anlaşırdınız.","B|Yeah. I look up to him, honestly.|Evet. Açıkçası ona hayranlık duyuyorum."],c:["make up|barışmak","fall out (over)|(bir şey yüzünden) bozuşmak","get over / be over it|atlatmak / geçti","get along (with)|iyi anlaşmak","look up to|örnek almak, hayranlık duymak","put up with|katlanmak","hang out with|ile takılmak","Glad to hear it.|Buna sevindim."],p:"Hayatındaki bir arkadaşlık ya da aile ilişkisini bu phrasal verb'lerle anlat (gerçek isim vermeden)."},
{t:"Deyimler 2",g:"Deyimler tek tek kelimeyle anlaşılmaz, bütün olarak öğrenilir. Az ama doğru yerde kullan, yoksa yapay durur.",d:["A|Did you buy the new car?|Yeni arabayı aldın mı?","B|No way. It costs an arm and a leg.|Asla. Dudak uçuklatan bir fiyatı var.","A|Yeah, prices are through the roof these days.|Evet, bu aralar fiyatlar tavan yaptı.","B|I'll just stick with my old one. It's been a while since it broke down.|Eskisiyle devam edeceğim. Bozulmayalı epey oldu.","A|Ha, don't jinx it! Knock on wood.|Ha, nazar değdirme! Tahtaya vur.","B|Good point. Knock on wood.|Haklısın. Tahtaya vur."],c:["cost an arm and a leg|çok pahalı olmak","through the roof|tavan yapmış","stick with|...dan şaşmamak, devam etmek","Don't jinx it!|Nazar değdirme!","Knock on wood.|Tahtaya vur.","once in a blue moon|kırk yılda bir","the last straw|bardağı taşıran son damla","on cloud nine|havalara uçmak, çok mutlu"],p:"Bugünkü deyimlerin her birini kendi hayatından gerçek bir örnekle kullan. Örnek: 'I go to the cinema once in a blue moon.'"},
{t:"İş jargonu",g:"Kurumsal İngilizcede sık duyulan kalıplar: 'touch base' (kısa görüşmek), 'ballpark' (kabaca tahmin), 'on the same page' (aynı fikirde).",d:["A|Let's touch base before the client call.|Müşteri görüşmesinden önce kısaca konuşalım.","B|Sure. Do you have a ballpark figure for the budget?|Tabii. Bütçe için kabaca bir rakam var mı?","A|Roughly fifty thousand. But keep it between us for now.|Aşağı yukarı elli bin. Ama şimdilik aramızda kalsın.","B|Got it. Just want to make sure we're on the same page.|Anladım. Sadece aynı noktada olduğumuzdan emin olmak istiyorum.","A|Totally. Let's circle back after the call.|Kesinlikle. Görüşmeden sonra tekrar konuşuruz.","B|Sounds good. Talk soon.|Olur. Görüşürüz."],c:["touch base|kısaca görüşmek","a ballpark figure|kabaca bir rakam","roughly|aşağı yukarı","Keep it between us.|Aramızda kalsın.","on the same page|aynı noktada, hemfikir","circle back|konuya sonra dönmek","bandwidth|(iş) vakit, kapasite","Talk soon.|Görüşürüz."],p:"Bir proje yöneticisiyle kısa bir iş görüşmesi yap: bütçe, takvim, sonraki adım. Bugünkü jargonu kullan."},
{t:"Yumuşatma (hedging)",g:"Doğal konuşanlar fikirlerini yumuşatır: 'I might be wrong, but...', 'It seems like...', 'sort of'. Bu kibar ve olgun durur.",d:["A|What do you think of the new design?|Yeni tasarım hakkında ne düşünüyorsun?","B|I might be wrong, but it seems a bit busy.|Yanılıyor olabilirim ama biraz kalabalık gibi.","A|Busy how?|Nasıl kalabalık?","B|There's sort of too much going on. Maybe fewer colors?|Bir nevi çok fazla şey var. Belki daha az renk?","A|Hmm, that's a fair point. I'll pass it on.|Hmm, haklı bir nokta. İleteceğim.","B|Just my two cents, though.|Sadece benim naçizane fikrim tabii."],c:["I might be wrong, but...|Yanılıyor olabilirim ama...","It seems a bit...|Biraz ... gibi.","sort of|bir nevi","Maybe...?|Belki ...?","I'd say...|Ben ... derdim.","It's not ideal.|İdeal değil. (= kötü)","I'll pass it on.|İleteceğim.","Just my two cents.|Naçizane fikrim."],p:"Bir arkadaşının projesine yumuşatarak eleştiri yap: önce olumlu bir şey, sonra 'I might be wrong, but...'"},
{t:"Vurgulama",g:"Asıl meseleyi öne çıkarmak için: 'The thing is...', 'What I mean is...', 'The point is...'. Konuşmanı toparlar.",d:["A|Why didn't you take the job?|İşi neden kabul etmedin?","B|The thing is, the salary was great, but the hours were crazy.|Mesele şu ki maaş harikaydı ama mesai saatleri çılgıncaydı.","A|How crazy?|Ne kadar çılgınca?","B|Like, sixty hours a week. What I mean is, I'd never see my family.|Haftada altmış saat gibi. Yani demek istediğim, ailemi hiç göremezdim.","A|Yeah, that's not worth it.|Evet, buna değmez.","B|Exactly. At the end of the day, money isn't everything.|Aynen. Sonuçta para her şey değil."],c:["The thing is,|Mesele şu ki,","What I mean is,|Demek istediğim,","The point is,|Asıl mesele,","At the end of the day,|Sonuçta, günün sonunda,","Money isn't everything.|Para her şey değil.","That's not worth it.|Buna değmez.","To be fair,|Hakkını vermek gerekirse,","Let me put it this way:|Şöyle söyleyeyim:"],p:"Verdiğin önemli bir kararı anlat ve nedenini 'The thing is... What I mean is... At the end of the day...' ile vurgula."},
{t:"Söz almak",g:"Kibarca araya girmek: 'Can I jump in here?', 'Sorry to cut you off'. Sözü geri vermek: 'Go ahead, you were saying?'",d:["A|So I think we should change the whole plan and—|Bence bütün planı değiştirmeli ve—","B|Sorry, can I jump in here for a second?|Pardon, bir saniyeliğine araya girebilir miyim?","A|Sure, go ahead.|Tabii, buyur.","B|Before we change everything, can we check the costs?|Her şeyi değiştirmeden önce maliyetlere bakabilir miyiz?","A|Good point. Sorry, I got carried away.|Haklısın. Kusura bakma, kendimi kaptırdım.","B|No worries. Go on, you were saying?|Dert etme. Devam et, ne diyordun?"],c:["Can I jump in here?|Araya girebilir miyim?","Sorry to cut you off.|Sözünü kestiğim için kusura bakma.","Go ahead.|Buyur.","for a second|bir saniyeliğine","I got carried away.|Kendimi kaptırdım.","You were saying?|Ne diyordun?","Let me finish.|Bitirmeme izin ver.","Hold that thought.|O düşünceyi tut, sonra döneceğiz."],p:"Bir toplantıyı canlandır: konuşan birinin sözünü kibarca kes, fikrini söyle, sonra sözü geri ver."},

{t:"Konu değiştirmek",g:"Sohbeti akıcı yapan köprüler: 'Speaking of which' (sırası gelmişken), 'That reminds me' (aklıma geldi), 'Anyway'.",d:["A|I finally finished that book you recommended.|Önerdiğin o kitabı sonunda bitirdim.","B|And? What did you think?|Eee? Nasıldı?","A|Loved it. Speaking of books, did you join that book club?|Bayıldım. Kitap demişken, o kitap kulübüne katıldın mı?","B|Not yet. Oh, that reminds me, Ayşe says hi.|Henüz değil. Ah, aklıma geldi, Ayşe selam söyledi.","A|Aw, say hi back! Anyway, are we still on for Saturday?|Ay, benden de selam söyle! Neyse, cumartesi hâlâ geçerli mi?","B|Definitely. Can't wait.|Kesinlikle. Sabırsızlanıyorum."],c:["And? What did you think?|Eee? Nasıldı?","Speaking of...|... demişken,","That reminds me,|Aklıma geldi,","... says hi.|... selam söyledi.","Say hi back!|Benden de selam söyle!","Anyway,|Neyse,","Can't wait.|Sabırsızlanıyorum.","Before I forget,|Unutmadan,"],p:"Bir arkadaşınla 1 dakikalık sohbette en az 3 kez konu değiştir. 'Speaking of... That reminds me... Anyway...' kullan."},
{t:"Heyecanlı anlatım",g:"Dinleyiciyi yakalamak için: 'So get this...' (Şuna bak...), 'You won't believe this'. Hikâyede şimdiki zaman kullanmak heyecan katar: 'So I walk in, and guess who's there?'",d:["A|You won't believe what happened today.|Bugün ne oldu inanmayacaksın.","B|What? Tell me!|Ne? Anlat!","A|So get this. I walk into the meeting, and guess who's there?|Şuna bak. Toplantıya giriyorum, bil bakalım kim orada?","B|Who?|Kim?","A|My old boss! The one who fired me!|Eski patronum! Beni kovan!","B|Shut up! What did you do?|Hadi canım! Ne yaptın?"],c:["You won't believe...|... inanmayacaksın.","Tell me!|Anlat!","So get this.|Şuna bak. / Dinle bak.","I walk in, and...|İçeri giriyorum ve...","Guess who's there?|Bil bakalım kim orada?","Shut up!|Hadi canım! (şaşkınlık)","And then what?|Sonra ne oldu?","I couldn't believe my eyes.|Gözlerime inanamadım."],p:"Başına gelen şaşırtıcı bir olayı 'So get this...' ile başlatıp şimdiki zamanla, heyecanla anlat."},
{t:"Empati",g:"Destek olurken çözüm sunmadan önce duyguyu kabul et: 'That must be hard', 'I can only imagine'. 'I'm here for you' çok güçlüdür.",d:["A|I didn't get the promotion.|Terfiyi alamadım.","B|Oh no. I'm really sorry. You worked so hard for it.|Eyvah. Çok üzüldüm. Bunun için çok çalışmıştın.","A|Yeah. I feel like it was all for nothing.|Evet. Hepsi boşunaymış gibi hissediyorum.","B|That must be so frustrating. I can only imagine.|Çok sinir bozucu olmalı. Ancak tahmin edebilirim.","A|Thanks for listening. It helps.|Dinlediğin için sağ ol. İyi geliyor.","B|Anytime. I'm here for you, okay?|Her zaman. Ben buradayım, tamam mı?"],c:["I'm really sorry.|Çok üzüldüm.","You worked so hard for it.|Bunun için çok çalıştın.","It was all for nothing.|Hepsi boşunaydı.","That must be hard.|Zor olmalı.","I can only imagine.|Ancak tahmin edebilirim.","Thanks for listening.|Dinlediğin için sağ ol.","I'm here for you.|Ben buradayım.","Hang in there.|Dayan."],p:"Zor bir dönemden geçen bir arkadaşına İngilizce destek ol: önce duygusunu kabul et, sonra yanında olduğunu söyle."},
{t:"Yapıcı eleştiri",g:"Geri bildirimin kibar formülü: olumlu + 'Have you considered...?' + olumlu. Emir yerine soru kullan.",d:["A|Can you give me some feedback on my report?|Raporuma biraz geri bildirim verebilir misin?","B|Sure. Overall, it's really solid.|Tabii. Genel olarak gerçekten sağlam.","A|But...?|Ama...?","B|Ha. Have you considered adding a summary at the top?|Ha. En üste bir özet eklemeyi düşündün mü?","A|Good idea. Anything else?|İyi fikir. Başka?","B|Maybe shorten the intro a bit. Other than that, great work.|Belki girişi biraz kısalt. Onun dışında harika iş."],c:["Can you give me some feedback?|Geri bildirim verebilir misin?","Overall,|Genel olarak,","really solid|gerçekten sağlam","Have you considered ...ing?|...meyi düşündün mü?","Anything else?|Başka?","Maybe...|Belki...","Other than that,|Onun dışında,","It could use...|Biraz ... iyi olur."],p:"Bir iş arkadaşının raporuna geri bildirim ver: önce olumlu, sonra 'Have you considered...?', sonra olumlu kapanış."},
{t:"Müşteri toplantısı",g:"Müşteriyle konuşurken netleştirme kalıpları hayat kurtarır: 'Just to clarify...', 'So what you're saying is...'.",d:["A|Thanks for joining. Let's go over your requirements.|Katıldığınız için teşekkürler. Gereksinimlerinizin üzerinden geçelim.","B|Sure. We need a report that shows all open payments by vendor.|Tabii. Tüm açık ödemeleri satıcıya göre gösteren bir rapor lazım.","A|Just to clarify, do you need it daily or weekly?|Netleştirmek için, günlük mü haftalık mı lazım?","B|Daily, ideally. And it should be emailed automatically.|İdeali günlük. Ve otomatik e-postayla gitmeli.","A|So what you're saying is, a daily automated email report.|Yani diyorsunuz ki günlük otomatik bir e-posta raporu.","B|Exactly. Is that doable?|Aynen. Yapılabilir mi?"],c:["Let's go over your requirements.|Gereksinimlerinizin üzerinden geçelim.","Just to clarify,|Netleştirmek için,","So what you're saying is...|Yani diyorsunuz ki...","ideally|ideal olarak","It should be...|... olmalı.","Is that doable?|Yapılabilir mi?","That's definitely doable.|Kesinlikle yapılabilir.","I'll send you a proposal.|Size bir teklif göndereceğim."],p:"Bir müşteriye kendi ABAP raporunu sat: ihtiyacını sor, netleştir, raporun ne yaptığını anlat, teklif göndereceğini söyle."},
{t:"Proje gecikmesi",g:"Kötü haberi profesyonelce vermek: durum + sebep + çözüm. 'We're behind schedule because... To fix this, we...'",d:["A|How's the project looking?|Proje nasıl gidiyor?","B|I'll be honest, we're a bit behind schedule.|Dürüst olayım, takvimin biraz gerisindeyiz.","A|How far behind?|Ne kadar geride?","B|About two weeks. The data migration took longer than expected.|İki hafta kadar. Veri taşıma beklenenden uzun sürdü.","A|Okay. What's the plan to catch up?|Tamam. Açığı kapatmak için plan ne?","B|We're adding two people to the team, so we should be back on track by Friday.|Ekibe iki kişi ekliyoruz, cumaya kadar rayına oturmuş olmalıyız."],c:["How's ... looking?|... nasıl gidiyor?","I'll be honest,|Dürüst olayım,","behind schedule|takvimin gerisinde","How far behind?|Ne kadar geride?","It took longer than expected.|Beklenenden uzun sürdü.","catch up|açığı kapatmak, yetişmek","back on track|tekrar rayında","ahead of schedule|takvimin önünde"],p:"Patronuna bir gecikmeyi bildir: ne kadar gecikme, neden, nasıl telafi edeceksin. Sakin ve profesyonel ol."},
{t:"Türkiye'yi anlatmak",g:"Kültür anlatırken 'In Turkey, we usually...' ve 'It's a big deal' (çok önemlidir) kalıpları çok işe yarar.",d:["A|What's Turkish breakfast like? I keep hearing about it.|Türk kahvaltısı nasıl? Hep duyuyorum.","B|Oh, it's a big deal. It's not just a meal, it's an event.|Ah, çok önemlidir. Sadece yemek değil, bir etkinlik.","A|What do you usually have?|Genelde ne olur?","B|Cheese, olives, eggs, tomatoes, fresh bread, and lots of tea.|Peynir, zeytin, yumurta, domates, taze ekmek ve bolca çay.","A|That sounds incredible.|Kulağa inanılmaz geliyor.","B|You have to try it. On weekends, it can last for hours.|Mutlaka denemelisin. Hafta sonları saatlerce sürebilir."],c:["What's ... like?|... nasıl bir şey?","I keep hearing about it.|Hep duyuyorum.","It's a big deal.|Çok önemlidir.","not just a ..., it's a ...|sadece bir ... değil, bir ...","In Turkey, we usually...|Türkiye'de genelde ...","You have to try it.|Mutlaka denemelisin.","It can last for hours.|Saatlerce sürebilir.","It's hard to explain.|Anlatması zor."],p:"Bir yabancıya Türk kültüründen 3 şey anlat: kahvaltı, bayram, misafirperverlik. 'In Turkey, we usually...' kullan."},
{t:"Teknoloji ve yapay zekâ",g:"Gelecek hakkında tahmin: 'I bet...' (bahse girerim), 'In the long run' (uzun vadede), 'It's only a matter of time.'",d:["A|Do you use AI at work?|İşte yapay zekâ kullanıyor musun?","B|All the time. It saves me hours every week.|Sürekli. Her hafta bana saatler kazandırıyor.","A|Aren't you worried it'll replace your job?|İşini elinden alacağından endişe etmiyor musun?","B|Not really. I think it'll change jobs, not replace them.|Pek değil. Bence işleri değiştirecek, yok etmeyecek.","A|I bet a lot of people would disagree.|Bahse girerim çoğu kişi katılmaz.","B|Maybe. But in the long run, people who use it will win.|Belki. Ama uzun vadede onu kullananlar kazanacak."],c:["all the time|sürekli","It saves me hours.|Bana saatler kazandırıyor.","Aren't you worried...?|... endişe etmiyor musun?","replace|yerini almak","I bet...|Bahse girerim...","in the long run|uzun vadede","It's only a matter of time.|Sadece zaman meselesi.","It's a game changer.|Oyunun kurallarını değiştiriyor."],p:"Yapay zekâyı işinde ve hayatında nasıl kullandığını anlat, gelecekle ilgili bir tahminde bulun."},
{t:"Para ve bütçe",g:"Para konuşmasında 'save up for' (… için para biriktirmek) ve 'afford' (… gücü yetmek) en temel iki kalıptır.",d:["A|Are you going on the trip with us?|Bizimle geziye geliyor musun?","B|I wish. I can't afford it right now.|Keşke. Şu an maddi olarak gücüm yetmiyor.","A|Oh, that's too bad.|Ah, çok kötü.","B|I'm saving up for a new car, so I'm on a tight budget.|Yeni araba için para biriktiriyorum, bütçem kısıtlı.","A|Makes sense. Smart move.|Mantıklı. Akıllıca.","B|Yeah. But next year, I'm definitely coming.|Evet. Ama seneye kesin geliyorum."],c:["I wish.|Keşke.","I can't afford it.|Gücüm yetmiyor.","That's too bad.|Çok kötü.","save up for|... için para biriktirmek","on a tight budget|kısıtlı bütçeyle","Makes sense.|Mantıklı.","Smart move.|Akıllıca hamle.","It's a good deal.|İyi fiyat. / İyi anlaşma."],p:"Bir şey için para biriktirdiğini hayal et: ne için, ne kadar sürede, nelerden kısıyorsun?"},
{t:"Ev işleri",g:"'Whose turn is it to...?' (… sırası kimde?) ve 'I'll take care of it' ev hayatının en sık cümleleridir.",d:["A|Whose turn is it to do the dishes?|Bulaşık sırası kimde?","B|Pretty sure it's yours. I did them yesterday.|Eminim sende. Dün ben yıkadım.","A|Ugh, fine. Can you take out the trash, then?|Off, peki. Sen de çöpü çıkarır mısın o zaman?","B|Already did. And I did the laundry, too.|Çıkardım bile. Çamaşırları da yıkadım.","A|Wow, look at you! What's the occasion?|Vay, şuna bak! Hayırdır?","B|Nothing. I just want a lazy Sunday tomorrow.|Bir şey yok. Sadece yarın tembel bir pazar istiyorum."],c:["Whose turn is it to...?|... sırası kimde?","do the dishes|bulaşık yıkamak","take out the trash|çöpü çıkarmak","do the laundry|çamaşır yıkamak","Already did.|Yaptım bile.","Look at you!|Şuna bak! (övgü)","What's the occasion?|Hayırdır? Ne münasebet?","a lazy Sunday|tembel bir pazar"],p:"Evdeki iş bölümünü anlat: kim ne yapıyor, en sevmediğin iş hangisi, ne zaman yapıyorsun?"},
{t:"Eski dostla buluşmak",g:"Uzun zaman sonra görüşünce: 'Long time no see!', 'What have you been up to?' (Neler yapıyorsun bu aralar?), 'We should catch up.'",d:["A|No way! Long time no see!|Yok artık! Görüşmeyeli uzun zaman oldu!","B|I know! It's been, what, five years?|Biliyorum! Ne oldu, beş yıl mı?","A|At least. What have you been up to?|En az. Neler yapıyorsun bu aralar?","B|Oh, a lot. I got married, moved twice, changed jobs...|Ah, çok şey. Evlendim, iki kez taşındım, iş değiştirdim...","A|Wow, we definitely need to catch up properly.|Vay, kesinlikle adam akıllı oturup konuşmamız lazım.","B|Totally. Let's grab dinner this week.|Kesinlikle. Bu hafta yemeğe çıkalım."],c:["Long time no see!|Görüşmeyeli uzun zaman oldu!","It's been, what, five years?|Ne oldu, beş yıl mı?","At least.|En az.","What have you been up to?|Neler yapıyorsun bu aralar?","catch up|hasret gidermek, sohbet etmek","You haven't changed a bit!|Hiç değişmemişsin!","Time flies.|Zaman uçup gidiyor.","Let's keep in touch.|İletişimi koparmayalım."],p:"Yıllardır görmediğin bir arkadaşa son 5 yılını anlat. 'I got..., I moved..., I started...' kullan."},
{t:"Kutlama ve tebrik",g:"Tebrik: 'Congrats!' (gündelik), 'Congratulations!' (resmi). Hak ettiğini vurgula: 'Couldn't have happened to a nicer person.'",d:["A|Guess what? We're having a baby!|Bil bakalım ne oldu? Bebeğimiz olacak!","B|Oh my God! Congrats! That's amazing news!|Aman Allah'ım! Tebrikler! Harika bir haber!","A|Thank you! We're over the moon.|Teşekkürler! Havalara uçuyoruz.","B|When's the due date?|Doğum ne zaman?","A|In May. We just found out it's a girl.|Mayısta. Kız olduğunu yeni öğrendik.","B|I'm so happy for you guys. Let's celebrate!|Sizin adınıza çok mutluyum. Hadi kutlayalım!"],c:["Guess what?|Bil bakalım ne oldu?","Congrats!|Tebrikler!","That's amazing news!|Harika bir haber!","over the moon|havalara uçmak, çok mutlu","the due date|doğum tarihi, teslim tarihi","We just found out...|... yeni öğrendik.","I'm so happy for you.|Senin adına çok mutluyum.","Let's celebrate!|Hadi kutlayalım!"],p:"Üç farklı haberi tebrik et: terfi, düğün, sınavı geçmek. Her birine farklı bir cümleyle tepki ver."},
{t:"Taziye ve zor anlar",g:"Kayıp karşısında kısa ve içten ol: 'I'm so sorry for your loss.' Uzun cümle kurmak zorunda değilsin; 'If you need anything, I'm here' yeter.",d:["A|I heard about your grandfather. I'm so sorry for your loss.|Deden için duydum. Başın sağ olsun.","B|Thank you. It was really sudden.|Teşekkür ederim. Çok ani oldu.","A|That must be so hard. How are you holding up?|Çok zor olmalı. Nasıl dayanıyorsun?","B|I'm okay, I guess. Taking it one day at a time.|İyiyim sanırım. Günü gününe yaşıyorum.","A|If you need anything at all, I'm here.|Ne lazım olursa, ben buradayım.","B|That means a lot. Thank you.|Bu çok değerli. Teşekkür ederim."],c:["I'm so sorry for your loss.|Başın sağ olsun.","It was really sudden.|Çok ani oldu.","How are you holding up?|Nasıl dayanıyorsun?","one day at a time|günü gününe","If you need anything at all,|Ne lazım olursa,","I'm here.|Ben buradayım.","My thoughts are with you.|Aklım sende.","Take all the time you need.|İstediğin kadar zaman al."],p:"Bir yabancı iş arkadaşına zor bir gününde destek mesajı söyle. Kısa, sıcak ve içten ol."},
{t:"Şikâyet ve iade",g:"Mağazada iade: 'I'd like to return this', 'It doesn't work', 'Can I get a refund or an exchange?'",d:["A|Hi, I'd like to return these headphones.|Merhaba, bu kulaklığı iade etmek istiyorum.","B|Sure. What seems to be the problem?|Tabii. Sorun nedir?","A|The left side stopped working after two days.|Sol tarafı iki gün sonra çalışmayı bıraktı.","B|Sorry about that. Do you have the receipt?|Kusura bakmayın. Fişiniz var mı?","A|Yes, here it is. Can I get a refund?|Evet, işte. Para iadesi alabilir miyim?","B|Of course. Or I can exchange them if you prefer.|Tabii. Ya da isterseniz değiştirebilirim."],c:["I'd like to return this.|Bunu iade etmek istiyorum.","It stopped working.|Çalışmayı bıraktı.","Do you have the receipt?|Fişiniz var mı?","Here it is.|İşte.","Can I get a refund?|Para iadesi alabilir miyim?","exchange|değiştirmek","if you prefer|isterseniz","It's still under warranty.|Hâlâ garanti kapsamında."],p:"Bozuk bir ürünü iade et: sorunu anlat, fişi ver, para iadesi iste. Satıcı direnirse kibarca ısrar et."},
{t:"Acil durum",g:"Acil durumda kısa ve net cümleler: 'I need help', 'I lost my...', 'Can you call...?'. Panikte gramer önemli değil, anlaşılmak önemli.",d:["A|Excuse me, I think I lost my wallet.|Affedersiniz, sanırım cüzdanımı kaybettim.","B|Oh no. Where did you last have it?|Eyvah. En son nerede vardı?","A|On the train, about an hour ago.|Trende, bir saat kadar önce.","B|You should go to the lost and found at the station.|İstasyondaki kayıp eşya bürosuna gitmelisiniz.","A|Thanks. And I need to cancel my cards, right?|Teşekkürler. Kartlarımı da iptal ettirmem lazım, değil mi?","B|Yes, do that first, just to be safe.|Evet, garanti olsun diye önce onu yapın."],c:["I think I lost my...|Sanırım ...mı kaybettim.","Where did you last have it?|En son nerede vardı?","the lost and found|kayıp eşya bürosu","cancel my cards|kartlarımı iptal ettirmek","just to be safe|garanti olsun diye","I need help.|Yardıma ihtiyacım var.","It's an emergency.|Acil bir durum.","Can you call an ambulance?|Ambulans çağırabilir misiniz?"],p:"Yurt dışında pasaportunu kaybettiğini hayal et: yardım iste, ne olduğunu anlat, ne yapman gerektiğini sor."},
{t:"Gelecek ve hayaller",g:"Büyük hedefler için: 'In five years, I see myself...', 'My dream is to...', 'I'm determined to...'",d:["A|Where do you see yourself in five years?|Beş yıl sonra kendini nerede görüyorsun?","B|Honestly? Running my own business.|Açıkçası mı? Kendi işimi yönetirken.","A|Nice. What kind of business?|Güzel. Ne tür bir iş?","B|Selling software to finance teams. And making games on the side.|Finans ekiplerine yazılım satmak. Bir de yan iş olarak oyun yapmak.","A|That's a solid plan. What's stopping you?|Sağlam bir plan. Seni ne durduruyor?","B|Nothing, really. I'm determined to make it happen.|Aslında hiçbir şey. Bunu gerçekleştirmeye kararlıyım."],c:["Where do you see yourself in five years?|Beş yıl sonra kendini nerede görüyorsun?","run my own business|kendi işimi yönetmek","on the side|yan iş olarak","That's a solid plan.|Sağlam bir plan.","What's stopping you?|Seni ne durduruyor?","I'm determined to...|...meye kararlıyım.","make it happen|gerçekleştirmek","My dream is to...|Hayalim ...mek."],p:"Beş yıl sonraki hayatını anlat: iş, ev, aile, İngilizcen. 'In five years, I see myself...' ile başla."},
{t:"Hızlı tepkiler",g:"Ana dili İngilizce olanlar sohbeti 1-2 kelimelik tepkilerle canlı tutar. Bunları refleks hâline getir.",d:["A|The meeting got moved to Monday.|Toplantı pazartesiye alındı.","B|Fair enough.|Peki, olur.","A|And they want the full report by then.|Ve o zamana kadar tam raporu istiyorlar.","B|No kidding? That's tight.|Dalga mı geçiyorsun? Bu çok sıkışık.","A|I know. But we can do it if we split it.|Biliyorum. Ama bölüşürsek yaparız.","B|Point taken. Let's do it.|Haklısın, anlaşıldı. Yapalım."],c:["Fair enough.|Peki, olur. / Anlaşılır.","No kidding?|Şaka mı? / Cidden mi?","That's tight.|Bu çok sıkışık.","Point taken.|Haklısın, anlaşıldı.","Makes sense.|Mantıklı.","Good to know.|İyi bilmek.","Same here.|Bende de aynı.","Tell me about it!|Sorma!"],p:"Bir arkadaşın sana 10 haber versin (sen uydur), her birine 1-2 kelimelik doğal tepki ver. Hızlı ol!"},
{t:"Hayat kalıpları",g:"Bazı kalıplar hayat felsefesi gibidir ve sohbeti kapatır: 'It is what it is', 'Better late than never', 'You live and learn'.",d:["A|My flight got canceled. Again.|Uçuşum iptal oldu. Yine.","B|Oh no. Can you get another one?|Eyvah. Başka bir tane bulabilir misin?","A|Tomorrow morning. It is what it is.|Yarın sabah. Ne yapalım, olan oldu.","B|At least you'll get there. Better late than never.|En azından varacaksın. Geç olsun güç olmasın.","A|True. Next time I'm booking a direct flight.|Doğru. Bir dahaki sefere direkt uçuş alacağım.","B|You live and learn.|Yaşayarak öğreniyoruz."],c:["It is what it is.|Ne yapalım, olan oldu.","Better late than never.|Geç olsun güç olmasın.","You live and learn.|Yaşayarak öğreniyoruz.","At least...|En azından...","Every cloud has a silver lining.|Her işte bir hayır vardır.","Easier said than done.|Söylemesi kolay.","It's not the end of the world.|Dünyanın sonu değil.","Better safe than sorry.|Sonradan üzülmektense tedbirli olmak iyidir."],p:"Başına gelen 4 aksiliği anlat ve her birini bugünkü hayat kalıplarından biriyle bağla."},
{t:"Uzun anlatım",g:"Uzun anlatımda yapı: başlangıç (When I started...), zorluk (The problem was...), çözüm (So we...), sonuç (In the end...).",d:["A|What's the project you're most proud of?|En gurur duyduğun proje hangisi?","B|Probably a payment report I built for a big client.|Muhtemelen büyük bir müşteri için yaptığım ödeme raporu.","A|What made it special?|Onu özel yapan neydi?","B|When I started, they were checking everything by hand. The problem was, it took two days every week.|Başladığımda her şeyi elle kontrol ediyorlardı. Sorun şuydu, her hafta iki gün sürüyordu.","A|And now?|Ya şimdi?","B|In the end, it takes ten minutes. They actually threw me a party.|Sonunda on dakika sürüyor. Bana parti bile verdiler."],c:["the project I'm most proud of|en gurur duyduğum proje","What made it special?|Onu özel yapan neydi?","When I started,|Başladığımda,","The problem was,|Sorun şuydu,","by hand|elle","So we decided to...|Biz de ...meye karar verdik.","In the end,|Sonunda,","It paid off.|Karşılığını verdi."],p:"En gurur duyduğun projeyi 2 dakika anlat: başlangıç, zorluk, çözüm, sonuç. Durmadan konuş."},
{t:"Ultra kibar İngilizce",g:"Dolaylı soru daha kibardır: 'Where is the station?' yerine 'Do you know where the station is?' Dikkat: dolaylı soruda sıra düz cümle gibi olur (where the station IS).",d:["A|Excuse me, do you happen to know where the post office is?|Affedersiniz, postanenin nerede olduğunu biliyor musunuz acaba?","B|I think it's just around the corner, next to the bank.|Sanırım hemen köşede, bankanın yanında.","A|Thank you. And would you mind telling me what time it closes?|Teşekkürler. Saat kaçta kapandığını söyler misiniz rica etsem?","B|I'm not a hundred percent sure, but I think around five.|Yüzde yüz emin değilim ama sanırım beş gibi.","A|That's really helpful. Sorry to bother you.|Çok yardımcı oldunuz. Rahatsız ettiğim için kusura bakmayın.","B|Not at all. Have a lovely day!|Hiç olur mu. İyi günler!"],c:["Do you happen to know...?|... biliyor musunuz acaba?","just around the corner|hemen köşede","Would you mind telling me...?|... söyler misiniz rica etsem?","I'm not a hundred percent sure.|Yüzde yüz emin değilim.","That's really helpful.|Çok yardımcı oldunuz.","Sorry to bother you.|Rahatsız ettiğim için kusura bakmayın.","I was wondering if...|Acaba ... diye merak ediyordum.","Have a lovely day!|İyi günler!"],p:"Bir yabancıya 5 soruyu dolaylı ve ultra kibar sor: 'Do you happen to know...?', 'I was wondering if...'"},
{t:"BÜYÜK FİNAL",g:"Tebrikler! Artık öğrenmeye kalıplarla devam et: her gün 30 dk dinle, 10 dk konuş, kartlarını tekrar et. Dil bir yolculuktur, varış noktası değil.",d:["A|So, how long have you been learning English?|Peki, ne zamandır İngilizce öğreniyorsun?","B|About three months of serious practice.|Ciddi pratikle üç ay kadar.","A|No way. You sound so natural!|Yok artık. Çok doğal konuşuyorsun!","B|Thanks! I practiced every single day, even when I didn't feel like it.|Sağ ol! Canım istemediğinde bile her gün pratik yaptım.","A|What was the secret?|Sırrı neydi?","B|Listening a lot, copying natives, and not being afraid of mistakes.|Bol dinlemek, anadili konuşanları taklit etmek ve hatadan korkmamak."],c:["How long have you been learning...?|Ne zamandır ... öğreniyorsun?","serious practice|ciddi pratik","You sound so natural!|Çok doğal konuşuyorsun!","even when I didn't feel like it|canım istemediğinde bile","What was the secret?|Sırrı neydi?","not being afraid of mistakes|hatadan korkmamak","I've come a long way.|Çok yol kat ettim.","I'm proud of myself.|Kendimle gurur duyuyorum."],p:"BÜYÜK FİNAL: 5 dakika kesintisiz İngilizce konuş: kendin, işin, hayallerin, bu 90 günde neler öğrendiğin. Kaydet, 1. gün kaydınla karşılaştır. Ohaaa! 🏆"}
);

const G30=[
"'What's up?' bir soru gibi görünse de selamdır. Cevabı genelde 'Not much' ya da 'Nothing much'tır; hayatını anlatmana gerek yok.",
"'What do you do?' = Ne iş yaparsın? 'What are you doing?' = Şu an ne yapıyorsun? İkisini karıştırma.",
"Tepki kelimeleri dinlediğini gösterir. İngilizcede sessiz dinlemek ilgisizlik gibi algılanabilir; sık sık 'Really?', 'Wow', 'No way!' de.",
"Geniş zaman (I usually wake up) alışkanlık anlatır. 'He/She' ile fiile -s ekle: 'She works', 'He wakes up'.",
"Rica cümlelerinde 'Could you...?' 'Can you...?'dan daha kibardır. 'Do you mind if...?' sorusuna 'Not at all' = 'Hiç sorun değil' demektir (evet anlamında).",
"Siparişte 'I want' yerine 'Can I get...?' ya da 'I'll have...' de. 'I want' çocuksu ve kaba durur.",
"'gonna' = going to (…acağım). Planlar için kullanılır: 'I'm gonna call him.' Yazıda resmi yerde 'going to' yaz, konuşmada 'gonna' de.",
"Fikir belirtirken 'I think' en basitidir ama 'To be honest' ve 'I mean' konuşmana doğallık katar.",
"'I couldn't agree more' olumsuz görünür ama tam tersine 'Sonuna kadar katılıyorum' demektir.",
"Geçmiş zaman: düzenli fiillere -ed eklenir (walked, missed). Düzensizler ezberlenir: go → went, take → took, have → had.",
"Duygularda '-ed' kişinin hissini, '-ing' sebebi anlatır: 'I'm bored' (sıkıldım) ≠ 'I'm boring' (ben sıkıcıyım!).",
"Şimdiki zaman (We're setting up...) şu sıralar devam eden işler için kullanılır: 'I'm working on a big project.'",
"Gelecek için 3 yol: 'I'm gonna' (plan), 'I'll' (o an karar/söz), 'I'm meeting him tomorrow' (kesinleşmiş randevu).",
"Mesajlaşmada 'text' fiil olarak kullanılır: 'Text me' = Bana mesaj at. 'Call me' = Beni ara.",
"Hikâyede 'like' dolgu kelimesidir (yani, işte) ve 'you know' dinleyiciyi dahil eder. Ölçülü kullanırsan çok doğal durur.",
"Şikâyet ederken 'I think there's a problem' ile yumuşak başla. İngilizcede direkt suçlamak çok kaba algılanır.",
"'If I were you, I'd...' kalıbında 'was' değil 'were' kullanılır. Bu kalıp tavsiye vermenin en doğal yoludur.",
"Yol tarifinde emir kipi kullanılır: 'Go straight. Turn left. Take the second right.' Kibarlık için başa 'Just' ekle: 'Just go straight.'",
"'Can I try it on?' kıyafet denemek içindir. 'on' giymeyi anlatır: put on (giymek), try on (denemek), take off (çıkarmak).",
"'I'm into...' = '…ya meraklıyım'. 'I like' den daha doğal ve gündelik: 'I'm really into gaming.'",
"Phrasal verb = fiil + küçük kelime, anlamı değişir: give (vermek) → give up (pes etmek). Tek tek değil, bütün olarak öğren.",
"Bazı phrasal verb'ler ayrılabilir: 'pick you up', 'pick up the kids'. Zamir (you, it, him) hep ortaya girer: 'pick it up' (pick up it değil).",
"Deyimler kelime kelime çevrilmez. 'a piece of cake' = bir dilim kek değil, 'çok kolay' demektir.",
"Small talk'ta güvenli konular: hava, yer, ortak tanıdık, hafta sonu. Kaçın: maaş, din, siyaset, kilo.",
"İroni tonla anlaşılır: 'Oh, great' düz tonla söylenince 'Ah, harika (berbat)' demektir. Tonu abartmaktan korkma.",
"İkna ederken 'Think about it' ve 'at least' çok etkilidir. Önce karşı tarafa hak ver ('That's a fair point'), sonra kendi fikrini söyle.",
"Toplantıda 'Let's...' kalıbı herkesi dahil eder: 'Let's get started', 'Let's move on', 'Let's wrap it up'.",
"'I appreciate it' 'Thank you'dan daha derin bir teşekkürdür. 'Anytime' ise 'Ne demek, her zaman' anlamına gelir.",
"Slang'i sadece yakın arkadaşlarla kullan. İş yerinde 'Dude, that was lit' demek tuhaf kaçar.",
"Kendini anlatırken 'I've been ...ing' (bir süredir …yorum) kalıbı devam eden süreçleri anlatır: 'I've been learning English.'"
];
DAYS.forEach((d,i)=>{if(G30[i])d.g=G30[i]});

const STORIES=[
{t:"1. Büyük haber",lv:"Kolay",s:["This is Can. He's thirty-two, and he lives in Istanbul.|Bu Can. Otuz iki yaşında ve İstanbul'da yaşıyor.","He works at a bank, but he doesn't really like his job.|Bir bankada çalışıyor ama işini pek sevmiyor.","Every morning, he gets up at seven and takes the ferry to work.|Her sabah yedide kalkıp işe vapurla gidiyor.","He loves the ferry. It's the best part of his day.|Vapuru çok seviyor. Gününün en güzel kısmı.","One Monday, he gets an email from a company in London.|Bir pazartesi, Londra'daki bir şirketten e-posta alıyor.","He reads it three times. He can't believe it.|Üç kez okuyor. İnanamıyor.","They want him to work in London for one year.|Bir yıl Londra'da çalışmasını istiyorlar.","Can is excited, but he's also scared.|Can heyecanlı ama aynı zamanda korkuyor.","His English isn't great. He can read, but he can't really speak.|İngilizcesi pek iyi değil. Okuyabiliyor ama pek konuşamıyor.","That night, he calls his sister, Elif.|O akşam kız kardeşi Elif'i arıyor.","Elif says, 'Are you kidding? Just go! You'll learn.'|Elif diyor ki: 'Şaka mı yapıyorsun? Git işte! Öğrenirsin.'","Can smiles. He writes back: 'Yes. I'm in.'|Can gülümsüyor. Cevap yazıyor: 'Evet. Varım.'"]},
{t:"2. Londra'ya varış",lv:"Kolay",s:["Two months later, Can lands at Heathrow Airport.|İki ay sonra Can, Heathrow Havalimanı'na iniyor.","It's raining, of course.|Yağmur yağıyor, tabii ki.","He waits for his bag for forty minutes.|Bavulunu kırk dakika bekliyor.","Then he goes to the train and asks a man, 'Excuse me, is this the train to the city?'|Sonra trene gidip bir adama soruyor: 'Affedersiniz, şehre giden tren bu mu?'","The man speaks very fast. Can only understands 'yes' and 'platform two'.|Adam çok hızlı konuşuyor. Can sadece 'evet' ve 'ikinci peron'u anlıyor.","But that's enough. He finds the right train.|Ama bu yeterli. Doğru treni buluyor.","His new apartment is small, but it's clean and cozy.|Yeni dairesi küçük ama temiz ve sıcacık.","His landlady, Mrs. Green, is about seventy. She's very kind.|Ev sahibi Bayan Green yetmiş yaşlarında. Çok nazik.","She makes him a cup of tea and says, 'Welcome to London, love.'|Ona bir fincan çay yapıp diyor ki: 'Londra'ya hoş geldin, canım.'","Can doesn't know why she calls him 'love', but he likes it.|Can ona neden 'love' dediğini bilmiyor ama hoşuna gidiyor.","That night, he's tired, but he's happy.|O gece yorgun ama mutlu.","Day one: done.|Birinci gün: tamam."]},
{t:"3. İlk iş günü",lv:"Kolay",s:["On Monday morning, Can is nervous.|Pazartesi sabahı Can gergin.","He puts on his best shirt and checks his hair three times.|En güzel gömleğini giyip saçını üç kez kontrol ediyor.","At the office, a tall woman shakes his hand. 'Hi, I'm Sarah. You must be Can!'|Ofiste uzun boylu bir kadın elini sıkıyor. 'Merhaba, ben Sarah. Sen Can olmalısın!'","'Yes, nice to meet you,' Can says. His voice is a little shaky.|'Evet, tanıştığımıza memnun oldum,' diyor Can. Sesi biraz titrek.","Sarah shows him around and introduces him to the team.|Sarah ona ofisi gezdirip ekiple tanıştırıyor.","Everyone is friendly, but they talk so fast.|Herkes cana yakın ama çok hızlı konuşuyorlar.","In the meeting, Can understands maybe half of what they say.|Toplantıda söylenenlerin belki yarısını anlıyor.","When someone asks him a question, he freezes.|Biri ona soru sorunca donup kalıyor.","Sarah notices and says, 'No rush. Take your time.'|Sarah fark edip diyor ki: 'Acele yok. Rahat ol.'","Can takes a deep breath and answers slowly. It works.|Can derin bir nefes alıp yavaşça cevap veriyor. İşe yarıyor.","After work, he writes in his notebook: 'Say less, but say it clearly.'|İşten sonra defterine yazıyor: 'Az söyle ama net söyle.'"]},
{t:"4. Kafe kazası",lv:"Kolay",s:["Every morning, Can buys coffee at a small café near the office.|Can her sabah ofisin yakınındaki küçük bir kafeden kahve alıyor.","On his first day, he says, 'I want a coffee.'|İlk gün, 'Bir kahve istiyorum' diyor.","The barista looks at him and asks, 'What kind?'|Barista ona bakıp soruyor: 'Ne tür?'","Can panics. 'Uh... normal coffee?'|Can panikliyor. 'Ee... normal kahve?'","The barista laughs kindly and gives him a black coffee.|Barista nazikçe gülüp ona sade bir kahve veriyor.","The next day, Can listens to the people in front of him.|Ertesi gün Can önündeki insanları dinliyor.","A woman says, 'Can I get a flat white, please?'|Bir kadın diyor ki: 'Bir flat white alabilir miyim lütfen?'","Can repeats it in his head five times.|Can bunu kafasında beş kez tekrar ediyor.","When it's his turn, he smiles and says, 'Can I get a flat white, please?'|Sıra ona gelince gülümseyip söylüyor: 'Bir flat white alabilir miyim lütfen?'","The barista says, 'Sure thing! For here or to go?'|Barista diyor ki: 'Tabii! Burada mı, paket mi?'","'To go,' Can says proudly. Small win.|'Paket,' diyor Can gururla. Küçük bir zafer."]},
{t:"5. Yeni arkadaş",lv:"Orta",s:["One Friday, Can's coworker Jake invites him to the pub.|Bir cuma, Can'ın iş arkadaşı Jake onu pub'a davet ediyor.","'A few of us are grabbing a drink after work. You in?'|'Birkaçımız işten sonra bir şeyler içeceğiz. Var mısın?'","Can isn't sure, but he remembers Elif's words: 'Just go!'|Can emin değil ama Elif'in sözlerini hatırlıyor: 'Git işte!'","The pub is loud and crowded, and everyone is laughing.|Pub gürültülü ve kalabalık, herkes gülüyor.","Jake asks him about Turkey, and Can talks about Turkish breakfast.|Jake ona Türkiye'yi soruyor, Can da Türk kahvaltısını anlatıyor.","'Wait, it lasts for hours?' Jake asks. 'No way!'|'Dur, saatlerce mi sürüyor?' diye soruyor Jake. 'Yok artık!'","Can laughs. For the first time, he forgets that he's speaking English.|Can gülüyor. İlk kez İngilizce konuştuğunu unutuyor.","He makes mistakes, but nobody cares.|Hatalar yapıyor ama kimse umursamıyor.","At the end of the night, Jake says, 'Mate, your English is way better than you think.'|Gecenin sonunda Jake diyor ki: 'Dostum, İngilizcen sandığından çok daha iyi.'","On the bus home, Can can't stop smiling.|Eve giden otobüste Can gülümsemesini durduramıyor."]},
{t:"6. Kayıp",lv:"Orta",s:["On Saturday, Can decides to explore the city on his own.|Cumartesi Can şehri tek başına keşfetmeye karar veriyor.","He walks along the river and takes lots of photos.|Nehir boyunca yürüyüp bolca fotoğraf çekiyor.","After a few hours, his phone dies.|Birkaç saat sonra telefonunun şarjı bitiyor.","He has no map, and he has no idea where he is.|Haritası yok ve nerede olduğu hakkında hiçbir fikri yok.","He stops an old man and asks, 'Excuse me, how do I get to the nearest station?'|Yaşlı bir adamı durdurup soruyor: 'Affedersiniz, en yakın istasyona nasıl giderim?'","The man thinks for a moment. 'Go straight, take the second left, and you can't miss it.'|Adam bir an düşünüyor. 'Düz gidin, ikinci soldan dönün, kaçıramazsınız.'","Can understands every word. He can't believe it.|Can her kelimeyi anlıyor. İnanamıyor.","He thanks the man and follows the directions.|Adama teşekkür edip tarifi takip ediyor.","Ten minutes later, he sees the station.|On dakika sonra istasyonu görüyor.","He thinks, 'Two months ago, I couldn't do this.'|Düşünüyor: 'İki ay önce bunu yapamazdım.'"]},
{t:"7. Toplantıda kriz",lv:"Orta",s:["On Wednesday, there's a big meeting with an important client.|Çarşamba günü önemli bir müşteriyle büyük bir toplantı var.","Sarah is supposed to present, but she's stuck in traffic.|Sunumu Sarah yapacaktı ama trafikte sıkışıp kalmış.","Her message says: 'Can, can you start without me? You know the numbers.'|Mesajında yazıyor: 'Can, bensiz başlayabilir misin? Rakamları biliyorsun.'","Can's heart is pounding. Present in English? To a client?|Can'ın kalbi küt küt atıyor. İngilizce sunum mu? Bir müşteriye mi?","He takes a deep breath and stands up.|Derin bir nefes alıp ayağa kalkıyor.","'Okay, let me walk you through the numbers,' he says.|'Tamam, size rakamları adım adım anlatayım,' diyor.","He speaks slowly and keeps it simple.|Yavaş konuşuyor ve basit tutuyor.","When the client asks a hard question, he says, 'Good question. Let me check and get back to you.'|Müşteri zor bir soru sorunca diyor ki: 'Güzel soru. Kontrol edip size döneyim.'","Twenty minutes later, Sarah runs in. The client is smiling.|Yirmi dakika sonra Sarah koşarak giriyor. Müşteri gülümsüyor.","After the meeting, Sarah says, 'You nailed it. Seriously.'|Toplantıdan sonra Sarah diyor ki: 'Tam on ikiden vurdun. Cidden.'"]},
{t:"8. Memleket özlemi",lv:"Orta",s:["By November, the days are short and grey.|Kasım geldiğinde günler kısa ve gri.","Can misses home. He misses the sun, the sea, and his mother's cooking.|Can evini özlüyor. Güneşi, denizi ve annesinin yemeklerini özlüyor.","One evening, Mrs. Green knocks on his door.|Bir akşam Bayan Green kapısını çalıyor.","'You look a bit down, love. Are you alright?'|'Biraz keyifsiz görünüyorsun, canım. İyi misin?'","Can tells her the truth. He's homesick.|Can ona gerçeği söylüyor. Memleketini özlüyor.","Mrs. Green nods. 'I know the feeling. I moved here from Ireland when I was twenty.'|Bayan Green başını sallıyor. 'O hissi bilirim. Yirmi yaşımdayken İrlanda'dan buraya taşındım.'","'How did you get over it?' Can asks.|'Nasıl atlattınız?' diye soruyor Can.","'I didn't, really. I just made this place home, too.'|'Aslında atlatmadım. Sadece burayı da evim yaptım.'","The next weekend, Can cooks menemen for Mrs. Green and Jake.|Ertesi hafta sonu Can, Bayan Green ve Jake için menemen yapıyor.","Jake takes one bite and says, 'Mate, this is incredible. Teach me!'|Jake bir lokma alıp diyor ki: 'Dostum, bu inanılmaz. Bana öğret!'"]},
{t:"9. Telefon görüşmesi",lv:"Orta",s:["One morning, Can has to call a supplier about a missing payment.|Bir sabah Can, kayıp bir ödeme için bir tedarikçiyi araması gerekiyor.","Phone calls are the hardest. There are no faces, no gestures.|Telefon görüşmeleri en zoru. Yüz yok, el kol hareketi yok.","He writes a few sentences on a piece of paper, just in case.|Ne olur ne olmaz diye bir kâğıda birkaç cümle yazıyor.","'Hi, this is Can from Delta. I'm calling about an invoice.'|'Merhaba, ben Delta'dan Can. Bir fatura için arıyorum.'","The woman on the phone has a strong Scottish accent.|Telefondaki kadının güçlü bir İskoç aksanı var.","Can doesn't understand her at all. He feels his face getting hot.|Can onu hiç anlamıyor. Yüzünün ısındığını hissediyor.","Then he remembers a useful sentence. 'Sorry, could you say that a bit more slowly?'|Sonra işe yarar bir cümle hatırlıyor. 'Pardon, biraz daha yavaş söyleyebilir misiniz?'","She laughs. 'Of course, sorry! I talk too fast.'|Kadın gülüyor. 'Tabii, pardon! Çok hızlı konuşuyorum.'","This time, he understands. The payment will go out on Friday.|Bu sefer anlıyor. Ödeme cuma günü çıkacak.","He hangs up and thinks, 'Asking is not weakness. Asking is a skill.'|Telefonu kapatıp düşünüyor: 'Sormak zayıflık değil. Sormak bir beceri.'"]},
{t:"10. Rüyada İngilizce",lv:"Zor",s:["Something strange happens in December.|Aralık ayında tuhaf bir şey oluyor.","Can wakes up one morning and realizes he was dreaming in English.|Can bir sabah uyanıp İngilizce rüya gördüğünü fark ediyor.","In the dream, he was arguing with a taxi driver, and he was winning.|Rüyada bir taksiciyle tartışıyordu ve kazanıyordu.","He laughs out loud in his empty room.|Boş odasında yüksek sesle gülüyor.","He's also noticed other changes.|Başka değişiklikler de fark etmiş.","He doesn't translate in his head anymore, at least not all the time.|Artık kafasında çeviri yapmıyor, en azından her zaman değil.","He says 'Sorry' when someone bumps into him, like a real Londoner.|Biri ona çarpınca, gerçek bir Londralı gibi 'Sorry' diyor.","He understands jokes now, and sometimes he even makes them.|Artık şakaları anlıyor, hatta bazen kendisi yapıyor.","He calls Elif and tells her about the dream.|Elif'i arayıp rüyayı anlatıyor.","She screams, 'I told you! Didn't I tell you?'|Elif çığlık atıyor: 'Sana söylemiştim! Söylememiş miydim?'"]},
{t:"11. Teklif",lv:"Zor",s:["In March, Sarah calls Can into her office and closes the door.|Martta Sarah, Can'ı odasına çağırıp kapıyı kapatıyor.","Can's stomach drops. 'Did I do something wrong?'|Can'ın midesi kasılıyor. 'Yanlış bir şey mi yaptım?'","'Not at all,' Sarah says, smiling. 'Quite the opposite.'|'Hiç de değil,' diyor Sarah gülümseyerek. 'Tam tersi.'","'The client from the big meeting loved working with you. They want you to lead their new project.'|'Büyük toplantıdaki müşteri seninle çalışmayı çok sevdi. Yeni projelerini senin yönetmeni istiyorlar.'","'Lead it? Me?' Can can't believe what he's hearing.|'Yönetmek mi? Ben mi?' Can duyduklarına inanamıyor.","'You,' Sarah says. 'But it means staying another two years.'|'Sen,' diyor Sarah. 'Ama bu iki yıl daha kalmak demek.'","Can is torn. On the one hand, it's a dream job. On the other hand, his family is in Istanbul.|Can arada kalıyor. Bir yandan hayalindeki iş. Öte yandan ailesi İstanbul'da.","'Can I think it over?' he asks.|'Biraz düşünebilir miyim?' diye soruyor.","'Of course. Take your time,' Sarah says. 'But for what it's worth, I hope you say yes.'|'Tabii. Acele etme,' diyor Sarah. 'Ama bilmeni isterim, umarım evet dersin.'"]},
{t:"12. Eve dönüş",lv:"Zor",s:["In the end, Can makes a deal: he'll lead the project, but half of the time from Istanbul.|Sonunda Can bir anlaşma yapıyor: projeyi yönetecek ama zamanın yarısını İstanbul'dan.","Sarah agrees. 'Best of both worlds,' she says.|Sarah kabul ediyor. 'İki dünyanın en iyisi,' diyor.","Before his first trip home, Jake and Mrs. Green throw him a little party.|İlk eve dönüşünden önce Jake ve Bayan Green ona küçük bir parti veriyor.","Jake makes menemen. It's terrible, but Can eats every bite.|Jake menemen yapıyor. Berbat ama Can her lokmasını yiyor.","At the airport in Istanbul, Elif is waiting for him.|İstanbul'daki havalimanında Elif onu bekliyor.","On the way home, Can gets a call from a London client and answers in English.|Eve giderken Can'ı Londra'dan bir müşteri arıyor ve İngilizce cevap veriyor.","He laughs, makes a joke, and promises to send a report by Friday.|Gülüyor, şaka yapıyor ve cumaya kadar rapor göndereceğine söz veriyor.","When he hangs up, Elif is staring at him with her mouth open.|Telefonu kapattığında Elif ağzı açık ona bakıyor.","'Ohaaa! Where did you learn to speak English like that?'|'Ohaaa! Böyle İngilizce konuşmayı nereden öğrendin?'","Can just smiles. 'One day at a time.'|Can sadece gülümsüyor. 'Günü gününe.'"]}

const N=DAYS.length;
const LEVELS=[{n:"Seviye 1 · Hayatta kal",a:1,b:30,d:"Temel kalıplar, tanışma, günlük hayat"},{n:"Seviye 2 · Sohbeti sürdür",a:31,b:60,d:"Deneyim, fikir, iş görüşmesi, sunum"},{n:"Seviye 3 · Doğal ol",a:61,b:90,d:"Hızlı konuşma, deyimler, ikna, derin sohbet"}];
const levelOf=d=>LEVELS.find(l=>d>=l.a&&d<=l.b)||LEVELS[0];
const STEPS=["Dinle","Anla","Gölgele","Kalıplar","Ses","Konuş"];
const STEP_ICON=["👂","📖","🗣️","🧩","👄","💬"];

/* ======================= DURUM ======================= */
const KEY="dogal-ingilizce-v1";
const DEF={cur:1,done:{},cards:{},streak:{last:"",n:0},rate:0.9,chk:{},updated:0,hideText:false,stories:{},intro:false,dict:{n:0,ok:0}};
let S;
try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){S=Object.assign({},DEF)}
let remoteRef=null,saveTimer=null,writing=false,pendingW=false;
function save(){S.updated=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(remoteRef){clearTimeout(saveTimer);saveTimer=setTimeout(pushRemote,1500)}}
async function pushRemote(){if(!remoteRef)return;if(writing){pendingW=true;return}writing=true;try{await remoteRef.set(JSON.parse(JSON.stringify(S)));setSync(true)}catch(e){}writing=false;if(pendingW){pendingW=false;pushRemote()}}
function setSync(ok){const el=document.getElementById("sync");el.style.display="inline-flex";el.textContent=ok?"☁️✓":"☁️"}
(async()=>{try{if(!window.claude||!claude.use)return;const db=await claude.use("db");const user=await claude.use("user");if(!db||!user)return;const id=await user.id();if(!id)return;const ref=db.doc("data/users/"+id+"/progress");const snap=await ref.get();remoteRef=ref;setSync(true);if(snap.exists){const r=snap.data()||{};if((r.updated||0)>(S.updated||0)){S=Object.assign({},DEF,JSON.parse(JSON.stringify(r)));try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}else if((S.updated||0)>(r.updated||0))pushRemote()}else if(S.updated)pushRemote()}catch(e){}})();

/* ======================= YARDIMCI ======================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const DAYMS=864e5;
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),1800)}
const sp=s=>s.split("|");

/* ======================= SES (TTS) ======================= */
const tts=window.speechSynthesis||null;let voices=[],playTok=0;
function loadVoices(){if(!tts)return;voices=tts.getVoices().filter(v=>/^en[-_]/i.test(v.lang))}
if(tts){loadVoices();tts.onvoiceschanged=loadVoices}
const PREF=["Samantha","Google US English","Microsoft Aria","Microsoft Jenny","Alex","Ava","Allison"];
const PREF_B=["Daniel","Google UK English Male","Microsoft Guy","Aaron","Fred","Tom","Arthur","Rishi","Google UK English Female"];
function pick(list,exclude){for(const n of list){const v=voices.find(v=>v.name.indexOf(n)===0&&v!==exclude);if(v)return v}const us=voices.filter(v=>/en[-_]US/i.test(v.lang)&&v!==exclude);return us[0]||voices.find(v=>v!==exclude)||null}
function voiceFor(who){const a=pick(PREF);if(who!=="B")return a;return pick(PREF_B,a)||a}
/* Doğal ses paketleri (yapay zekâ ile önceden seslendirilmiş mp3) */
const AUD={},packP={};const player=new Audio();player.preload="auto";
function loadPack(n){if(!packP[n])packP[n]=fetch("a/"+n+".json").then(r=>r.ok?r.json():{}).then(j=>{for(const k in j)AUD[k]="data:audio/mpeg;base64,"+j[k];return true}).catch(()=>{delete packP[n];return false});return packP[n]}
function audioKey(text,who){const t=String(text).replace(/…/g,"").trim();for(const k of[(who||"A")+"|"+t,"A|"+t,"B|"+t])if(AUD[k])return k;return null}
function aRate(r){r=r||S.rate;return r<=0.66?0.7:r<=0.75?0.78:r<=0.95?0.9:1}
function playAudio(src,rate){return new Promise(res=>{let done=false;const fin=ok=>{if(!done){done=true;player.onended=null;player.onerror=null;res(ok)}};player.onended=()=>fin(true);player.onerror=()=>fin(false);try{player.src=src;player.preservesPitch=true;player.playbackRate=rate;const p=player.play();if(p&&p.catch)p.catch(()=>fin(false))}catch(e){fin(false)}})}
async function speak(text,who,rate){const k=audioKey(text,who);if(k){const tok=playTok;const ok=await playAudio(AUD[k],aRate(rate));if(ok||tok!==playTok)return}return speakTTS(text,who,rate)}
function speakTTS(text,who,rate){return new Promise(res=>{if(!tts){toast("Bu tarayıcıda ses yok");res();return}const u=new SpeechSynthesisUtterance(text);u.lang="en-US";const v=voiceFor(who);if(v){u.voice=v;u.lang=v.lang}const same=who==="B"&&v&&v===voiceFor("A");u.pitch=same?1.3:1;u.rate=rate||S.rate;let done=false;const fin=()=>{if(!done){done=true;res()}};u.onend=fin;u.onerror=fin;setTimeout(fin,15000+text.length*150);tts.speak(u)})}
function stopTTS(){playTok++;if(tts)tts.cancel();try{player.pause()}catch(e){}}
async function say(text,who,rate){stopTTS();await speak(text,who,rate)}
async function playSeq(lines,rate){stopTTS();const tok=playTok;for(const l of lines){if(tok!==playTok)return;await speak(l[1],l[0],rate);await new Promise(r=>setTimeout(r,350))}}

/* ======================= KARŞILAŞTIRMA ======================= */
const NUM={"0":"zero","1":"one","2":"two","3":"three","4":"four","5":"five","6":"six","7":"seven","8":"eight","9":"nine","10":"ten","11":"eleven","12":"twelve"};
const EXP={"gonna":"going to","wanna":"want to","gotta":"got to","kinda":"kind of","lemme":"let me","ok":"okay","alright":"all right"};
function norm(s){let t=s.toLowerCase().replace(/[’`]/g,"'").replace(/\.\.\./g," ").replace(/[^a-z0-9' ]/g," ");return t.split(/\s+/).filter(Boolean).map(w=>NUM[w]||EXP[w]||w).join(" ").split(" ").filter(Boolean)}
function compare(target,said){const T=target.split(/\s+/).filter(Boolean),tn=T.map(w=>norm(w).join(" ")),sn=norm(said);const tw=[],idx=[];tn.forEach((w,i)=>w.split(" ").forEach(p=>{if(p){tw.push(p);idx.push(i)}}));const n=tw.length,m=sn.length;const L=Array.from({length:n+1},()=>new Array(m+1).fill(0));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=tw[i]===sn[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);const hit=new Array(n).fill(false);let i=0,j=0;while(i<n&&j<m){if(tw[i]===sn[j]){hit[i]=true;i++;j++}else if(L[i+1][j]>=L[i][j+1])i++;else j++}const wordOk=T.map((_,k)=>{const parts=idx.map((x,q)=>x===k?q:-1).filter(q=>q>=0);return parts.length===0||parts.every(q=>hit[q])});const score=n?Math.round(100*hit.filter(Boolean).length/n):0;return{score,html:T.map((w,k)=>`<span class="${wordOk[k]?"w-ok":"w-no"}">${esc(w)}</span>`).join(" ")}}

/* ======================= KARTLAR (SRS) ======================= */
const IV=[1,2,4,8,16,32,64];
function addCards(day){const D=DAYS[day-1];let added=0;D.c.forEach((c,i)=>{const id="d"+day+"_"+i;if(!S.cards[id]){S.cards[id]={b:0,due:Date.now()+12*36e5};added++}});if(added)save();return added}
function cardData(id){const m=id.match(/^d(\d+)_(\d+)$/);const c=DAYS[+m[1]-1].c[+m[2]];return{en:sp(c)[0],tr:sp(c)[1],day:+m[1]}}
function dueList(){const now=Date.now();return Object.keys(S.cards).filter(k=>S.cards[k].due<=now).sort((a,b)=>S.cards[a].due-S.cards[b].due)}
function rate(id,r){const c=S.cards[id];const now=Date.now();if(r===0){c.b=0;c.due=now+10*6e4}else if(r===1){c.due=now+Math.max(1,IV[c.b]/2)*DAYMS}else if(r===2){c.b=Math.min(IV.length-1,c.b+1);c.due=now+IV[c.b]*DAYMS}else{c.b=Math.min(IV.length-1,c.b+2);c.due=now+IV[c.b]*DAYMS}if(r>=2)tick("tekrar",true,true);save()}

/* ======================= GÜNLÜK LİSTE ======================= */
const CHK=[["ders","Günün dersi (15-20 dk)"],["tekrar","Kart tekrarı (5-10 dk)"],["girdi","20-30 dk İngilizce dinle/izle (Rehber'deki kaynaklar)"],["ic","İç ses: gün içinde yaptığını kafanda İngilizce anlat"],["sohbet","Sohbet sekmesinde Sam'le 5 dk yaz"]];
function tick(k,v,silent){const t=today();S.chk[t]=S.chk[t]||{};S.chk[t][k]=v===undefined?!S.chk[t][k]:v;const keys=Object.keys(S.chk).sort();if(keys.length>40)keys.slice(0,keys.length-40).forEach(x=>delete S.chk[x]);save();if(!silent)render()}

let tab="home",L=null,R=null,ST=null,RM="cards",DQ=null,chat={msgs:[],topic:0,busy:false,auto:true},quiz=null,timer=null,openSound=-1;
function render(){stopTimerIfLeft();loadPack("s");loadPack("d"+Math.min(S.cur,N));if(L)loadPack("d"+L.day);if(tab==="review")dueList().slice(0,20).forEach(k=>loadPack("d"+k.match(/^d(\d+)/)[1]));$("#streak").textContent="🔥 "+streakNow();document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===tab));const v={home:L?vLesson:vHome,review:vReview,stories:ST?vStory:vStories,chat:vChat,sounds:vSounds,guide:vGuide}[tab];if(tab==="stories"&&ST)loadPack("st"+(ST.i+1));$("#app").innerHTML=v();if(tab==="chat"){const m=$("#msgs");if(m)window.scrollTo(0,document.body.scrollHeight)}}
function streakNow(){const s=S.streak;if(!s.last)return 0;const diff=Math.round((new Date(today())-new Date(s.last))/DAYMS);return diff<=1?s.n:0}
function stopTimerIfLeft(){if(timer&&!(L&&L.step===5)){clearInterval(timer.h);timer=null}}

function vHome(){const d=Math.min(S.cur,N);const D=DAYS[d-1];const lv=levelOf(d);const doneN=Object.keys(S.done).length;const cardsN=Object.keys(S.cards).length;const due=dueList().length;const c=S.chk[today()]||{};let h="";
if(!S.intro)h+=`<div class="card"><h2>👋 Hoş geldin!</h2><p class="mut small" style="margin:4px 0 8px">Bu program dili bir bebeğin edindiği sırayla öğretir: <b>önce bol dinle, sonra anla, taklit et, en son konuş.</b></p><div class="small">1️⃣ Her gün <b>bir ders</b> yap (15-20 dk) — 3 seviye, 90 gün.<br>2️⃣ <b>Tekrar</b> sekmesi kalıpları tam unutacağın an önüne getirir.<br>3️⃣ <b>Hikâye</b> sekmesinde Can'ın Londra maceralarını dinle — asıl edinim burada olur.<br>4️⃣ <b>Sohbet</b>'te Sam'le yazış ya da rol oyunu yap.<br>5️⃣ Gün içinde kafanda İngilizce konuş. Hata serbest!</div><button class="primary full" style="margin-top:10px" data-act="intro">Anladım, başlayalım</button></div>`;

if(L.step===0){h+=`<div class="card"><h2>Önce sadece dinle</h2><p class="mut">Bebekler konuşmadan önce aylarca dinler. Metni görmeden diyaloğu <b>en az 2 kez</b> dinle ve ne olduğunu tahmin etmeye çalış. Her kelimeyi anlaman gerekmiyor — genel anlamı yakala.</p><button class="primary full" data-act="playall">▶ Diyaloğu dinle</button><div class="row" style="margin-top:8px"><button class="ghost" data-act="playall" data-r="0.7">🐢 Yavaş dinle</button><button class="ghost" data-act="stop">⏹ Durdur</button></div><div class="tip"><b>İpucu:</b> Kim kimle konuşuyor? Neşeli mi, üzgün mü? Ana konu ne? Kafanda Türkçe tahmin et.</div></div>`}

if(L.step===2){const i=L.sh,l=lines[i];h+=`<div class="card"><h2>Gölgele (shadowing)</h2><p class="mut small">Dinle, sonra <b>aynı ritim, aynı tonla</b> aynı anda tekrar et. Her satırı 3-5 kez söyle. Sonra klavyedeki 🎤 mikrofon tuşuyla söyleyip kontrol et.</p><div class="mut" style="font-weight:800">Satır ${i+1}/${lines.length}</div><div class="big" ${S.hideText?'style="filter:blur(7px)" data-act="unblur"':""}>${esc(l[1])}</div><div class="tr">${esc(l[2])}</div><div class="row" style="margin:12px 0"><button class="primary" data-act="line" data-i="${i}">▶ Dinle</button><button class="ghost" data-act="line" data-i="${i}" data-r="0.65">🐢 Yavaş</button><button class="ghost" data-act="loop" data-i="${i}">🔁 3×</button></div><input type="text" id="said" placeholder="🎤 Klavye mikrofonuyla söyle ya da yaz" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="row" style="margin-top:8px"><button data-act="check" data-i="${i}">✓ Kontrol et</button></div><div id="res"></div><div class="row" style="margin-top:12px"><button class="ghost" data-act="sh" data-v="-1" ${i===0?"disabled":""}>◀ Önceki</button><button class="ghost" data-act="sh" data-v="1">${i===lines.length-1?"Bitti ▶":"Sonraki ▶"}</button></div><label class="mut small" style="display:flex;gap:6px;align-items:center;margin-top:10px"><input type="checkbox" data-act="hidetxt" ${S.hideText?"checked":""}> Zor mod: metni gizle (sadece kulakla)</label></div><div class="tip"><b>iPhone'da:</b> metin kutusuna dokun, klavyenin altındaki 🎤 tuşuna bas ve cümleyi söyle. Telefon seni anladıysa telaffuzun yolunda demektir!</div>`}
if(L.step===3){h+=`<div class="card"><h2>Hazır kalıplar</h2><p class="mut">Anadili İngilizce olanlar kelimeleri tek tek değil, <b>hazır parçalar</b> hâlinde kullanır. Bu 8 kalıp tekrar kartlarına eklendi; yarından itibaren aralıklı tekrarla karşına çıkacak.</p>${D.c.map(c=>{const x=sp(c);return`<div class="line"><div style="flex:1"><div class="en">${esc(x[0])}</div><div class="tr">${esc(x[1])}</div></div><a class="btn ghost" style="flex:none;padding:8px 10px;font-size:12px" href="https://youglish.com/pronounce/${encodeURIComponent(x[0].replace(/\.\.\.\w*|…/g,"").replace(/\s+([?!.,])/g,"$1").trim().trim())}/english/us" target="_blank" rel="noopener">👥 Gerçek</a><button class="play" data-act="say" data-t="${esc(x[0].replace(/\.\.\.\w*|…/g,"").replace(/\s+([?!.,])/g,"$1").trim())}">▶</button></div>`}).join("")}<div class="mut small" style="margin-top:6px">👥 <b>Gerçek</b>: kalıbı YouTube'daki gerçek insanların ağzından, gerçek videolarda dinle (YouGlish, ücretsiz).</div>${D.g?`<div class="gtip">💡 <b>Kalıbın mantığı:</b> ${esc(D.g)}</div>`:""}<div class="tip"><b>Taktik:</b> Her kalıbı kendi hayatından bir cümleye koyup yüksek sesle söyle. Kişisel cümle 10 kat daha kalıcıdır.</div></div>`}
if(L.step===4){const si=(L.day-1)%SOUNDS.length;h+=`<div class="card"><h2>Günün sesi</h2><p class="mut small">Türkçe konuşanların en sık zorlandığı sesler. Duyamadığın sesi söyleyemezsin — önce kulağını eğit.</p></div>`+soundCard(si,true)}
if(L.step===5){h+=`<div class="card"><h2>Şimdi sen konuş</h2><p style="font-size:17px;font-weight:700">${esc(D.p)}</p><div class="timer" id="timer">${timer?fmt(timer.left):"2:00"}</div><div class="row"><button class="${timer?"ghost":"primary"}" data-act="timer">${timer?"⏹ Durdur":"⏱ 2 dakika başlat"}</button></div><div class="tip"><b>Kural:</b> Durmadan konuş. Kelimeyi bilmiyorsan etrafından dolaş ("the thing you use for...")— asla Türkçeye geçme. Hatalar serbest!</div><button class="okb full" style="margin-top:6px" data-act="finish">✅ Günü tamamla</button></div>`}
if(L.step<5)h+=`<div class="row"><button class="ghost" data-act="step" data-v="-1" ${L.step===0?"disabled":""}>◀ Geri</button><button class="primary" data-act="step" data-v="1">Devam ▶</button></div>`;
else h+=`<div class="row"><button class="ghost" data-act="step" data-v="-1">◀ Geri</button></div>`;

const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");

function soundCard(i,open){const s=SOUNDS[i];const hasPairs=s.w.some(x=>x.includes("|"));const isOpen=open||openSound===i;let h=`<div class="card sound"><div ${open?"":`data-act="snd" data-i="${i}"`} class="row" style="justify-content:space-between"><h3 style="flex:1;margin:0">${esc(s.n)}</h3>${open?"":`<span style="flex:none">${isOpen?"▲":"▼"}</span>`}</div>`;
if(isOpen){h+=`<p class="mut">${esc(s.tr)}</p><div class="items">${s.w.map(x=>x.includes("|")?sp(x).map(p=>`<button data-act="say" data-t="${esc(p)}">🔊 ${esc(p)}</button>`).join(`<span style="align-self:center;color:var(--mut)">vs</span>`)+`<span style="flex-basis:100%;height:0"></span>`:`<button data-act="say" data-t="${esc(x)}">🔊 ${esc(x)}</button>`).join("")}</div>`;
if(hasPairs){h+=`<div style="margin-top:12px">${quiz&&quiz.s===i?quizHtml():`<button class="primary full" data-act="quiz" data-i="${i}">🎧 Kulak testi: hangisini duydun?</button>`}</div>`}}
return h+`</div>`}
function quizHtml(){const q=quiz;const pr=q.pair;return`<div class="tip" style="text-align:center"><div style="font-weight:800;margin-bottom:8px">Soru ${q.n} · Doğru: ${q.ok}/${q.n-(q.ans?0:1)}</div><button class="ghost" data-act="qplay">🔊 Tekrar dinle</button><div class="row" style="margin-top:10px">${pr.map((p,k)=>`<button class="${q.ans?(k===q.k?"okb":(q.pickK===k?"badb":"ghost")):"ghost"}" data-act="qans" data-k="${k}" style="font-size:18px">${esc(p)}</button>`).join("")}</div>${q.ans?`<div style="margin-top:10px;font-weight:800">${q.pickK===q.k?"✅ Doğru!":"❌ Duyduğun: "+esc(pr[q.k])}</div><button class="primary full" style="margin-top:8px" data-act="qnext">Sonraki ▶</button>`:""}</div>`}
function newQuiz(si,keep){const pairs=SOUNDS[si].w.filter(x=>x.includes("|")).map(sp);const pair=pairs[Math.floor(Math.random()*pairs.length)];const k=Math.random()<.5?0:1;quiz={s:si,pair,k,ans:false,n:keep?keep.n+1:1,ok:keep?keep.ok:0};say(pair[k])}

function vReview(){const total=Object.keys(S.cards).length;let h=`<div class="seg" style="margin-bottom:10px"><button class="${RM==="cards"?"on":""}" data-act="rm" data-v="cards">🧠 Kartlar</button><button class="${RM==="dict"?"on":""}" data-act="rm" data-v="dict">🎧 Dikte</button></div>`;

const due=dueList();
if(!total)return h+`<div class="card"><h2>🧠 Aralıklı tekrar</h2><p class="mut">Henüz kartın yok. İlk dersin "Kalıplar" adımına geldiğinde 8 kalıp buraya eklenir.</p><button class="primary full" data-act="tab" data-v="home">Derse git</button></div>`;

const c=cardData(R.id);const enT=c.en.replace(/\.\.\.\w*|…/g,"").replace(/\s+([?!.,])/g,"$1").trim();h+=`<div class="mut" style="font-weight:800">${due.length} kart bekliyor · ${R.listen?"👂 Dinleme kartı":"🗣️ Konuşma kartı"}</div><div class="card flash">`;
if(R.listen){h+=`<div class="mut small">Dinle — ne anlama geliyor?</div><button class="primary" style="margin:12px 0;font-size:22px;padding:16px 26px" data-act="say" data-t="${esc(enT)}">🔊</button>`;if(R.show)h+=`<div class="big" style="color:var(--acc)">${esc(c.en)}</div><div class="big" style="font-size:19px">${esc(c.tr)}</div>`}
else{h+=`<div class="mut small">Türkçesi:</div><div class="big">${esc(c.tr)}</div>`;if(R.show)h+=`<div style="border-top:1px solid var(--line);margin:12px 0;padding-top:12px"><div class="big" style="color:var(--acc)">${esc(c.en)}</div><button class="ghost" data-act="say" data-t="${esc(enT)}">🔊 Dinle</button></div>`}

else h+=`<div class="mut small">Ne kadar kolay hatırladın?</div><div class="row" style="margin-top:8px"><button class="badb" data-act="rateC" data-r="0">Bilemedim</button><button class="ghost" data-act="rateC" data-r="1">Zor</button><button class="okb" data-act="rateC" data-r="2">İyi</button><button data-act="rateC" data-r="3">Kolay</button></div>`;
return h+`</div><div class="mut small" style="text-align:center">Gün ${c.day} · ${esc(DAYS[c.day-1].t)}</div>`+boxStats()}
function dictPool(){const ds=[...new Set([Math.min(S.cur,N),...Object.keys(S.done).map(Number)])].filter(d=>d>=1&&d<=N);const pool=[];ds.forEach(d=>DAYS[d-1].d.forEach((l,j)=>pool.push([d,j])));return pool}

return h+`<div class="mut small" style="margin-top:8px">Bugüne kadar: ${st.n} cümle · ortalama ${st.n?Math.round(st.ok/st.n):0}%</div></div>`}
function boxStats(){const b=[0,0,0,0];Object.values(S.cards).forEach(c=>{b[c.b>=5?3:c.b>=3?2:c.b>=1?1:0]++});return`<div class="card"><h3>Hafıza seviyeleri</h3><div class="stats" style="grid-template-columns:repeat(4,1fr)">${[["🌱","Yeni"],["🌿","Öğreniyor"],["🌳","Oturuyor"],["💎","Kalıcı"]].map((x,i)=>`<div class="stat"><b>${b[i]}</b><span>${x[0]} ${x[1]}</span></div>`).join("")}</div><p class="mut small" style="margin-bottom:0">Unutma eğrisine göre: kartı tam unutmak üzereyken tekrar edince hafıza en güçlü şekilde pekişir. Aralıklar 1→2→4→8→16→32 gün uzar.</p></div>`}

function vStories(){const n=Object.keys(S.stories||{}).length;return`<div class="card"><h2>📚 Can'ın Londra Günlüğü</h2><p class="mut small">12 bölümlük sesli hikâye: İstanbullu Can, İngilizcesi zayıfken Londra'da işe başlıyor. Krashen'in "anlaşılır girdi" ilkesi: seviyenin biraz üstündeki ama anlayabildiğin hikâyeleri <b>bol bol dinlemek</b>, dili edinmenin en güçlü yoludur.</p><div class="tip"><b>Nasıl çalışılır:</b> 1) Metne bakmadan bir kez dinle. 2) Metinle dinle, anlamadığın cümlenin Türkçesine bak. 3) Gözün kapalı bir kez daha dinle. 4) Hikâyeyi kendi kelimelerinle 1 dakika anlat.</div><div class="mut small" style="font-weight:800">${n}/${STORIES.length} bölüm bitti</div>${STORIES.map((st,i)=>`<div class="storyrow" data-act="story" data-i="${i}"><div class="who ${S.stories[i+1]?"":"B"}" style="${S.stories[i+1]?"background:var(--ok);color:#fff":""}">${S.stories[i+1]?"✓":i+1}</div><div style="flex:1"><b>${esc(st.t)}</b><div class="mut small">${esc(st.lv)} · ${st.s.length} cümle</div></div><span>›</span></div>`).join("")}</div>`}
function vStory(){const st=STORIES[ST.i];return`<div class="row" style="justify-content:space-between"><button class="ghost" style="flex:none" data-act="stclose">← Hikâyeler</button><div style="flex:none;font-weight:900">${esc(st.lv)}</div></div><div class="card"><h2>${esc(st.t)}</h2><div class="row" style="margin:10px 0"><button class="primary" data-act="stall">▶ Dinle</button><button class="ghost" data-act="stall" data-r="0.7">🐢 Yavaş</button><button class="ghost" data-act="stop" style="flex:none">⏹</button></div><label class="mut small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-act="sttr" ${ST.tr?"checked":""}> Türkçeleri göster (kapalıyken bulanığa dokun)</label>${st.s.map((x,i)=>{const p=sp(x);return`<div class="st ${ST.cur===i?"on":""}" data-act="stline" data-i="${i}"><div class="en" style="font-size:16px;font-weight:700">${esc(p[0])}</div><div class="tr ${ST.tr?"":"hid"}" data-act="reveal">${esc(p[1])}</div></div>`}).join("")}<div class="tip"><b>Şimdi sen:</b> Bu bölümü kendi kelimelerinle 1 dakika anlat. "So, Can..." diye başla.</div><button class="okb full" data-act="stdone">✅ Bölümü bitirdim</button></div>`}

function vChat(){const topics=chatTopics().map(t=>t.n);let h=`<div class="card"><h2>💬 Sam ile sohbet</h2><p class="mut small">Sam, sabırlı bir Amerikalı arkadaş. Sen yaz, o cevap versin; hatanı bir anne gibi <b>doğru hâliyle tekrar eder</b>. iPhone'da klavyedeki 🎤 ile konuşarak yazabilirsin.</p><select data-act="topic">${topics.map((t,i)=>`<option value="${i}" ${chat.topic===i?"selected":""}>${esc(t)}</option>`).join("")}</select><label class="mut small" style="display:flex;gap:6px;align-items:center;margin-top:8px"><input type="checkbox" data-act="auto" ${chat.auto?"checked":""}> Sam'in cevaplarını sesli oku</label></div>`;

<div class="card"><h2>🧭 Bu uygulama neden işe yarar?</h2><p class="mut">Bir bebeğin dil edinimini taklit eden, dilbilim araştırmalarına dayalı yöntemler:</p>
<details open><summary>👂 Sessiz dönem ve anlaşılır girdi</summary><p class="mut small">Stephen Krashen'in Girdi Hipotezi: dili, seviyenin biraz üstündeki ama anlayabildiğin içerikle "ediniriz". Bebekler de konuşmadan önce aylarca dinler. Bu yüzden her ders önce metinsiz dinlemeyle başlar.</p></details>
<details><summary>🧩 Kalıp yaklaşımı (Lexical Approach)</summary><p class="mut small">Michael Lewis'e göre akıcı konuşmacılar kelimeleri tek tek dizmez, hazır parçaları ("How's it going?", "I'm down") birleştirir. Bebekler de "gimme that" gibi bütünler hâlinde öğrenir. Gramer kuralı yerine kalıp öğreniyorsun.</p></details>
<details><summary>🗣️ Gölgeleme (Shadowing)</summary><p class="mut small">Poliglot Alexander Argüelles'in yaygınlaştırdığı teknik: duyduğunu aynı anda, aynı ritim ve tonla tekrar etmek. Bebeklerin taklit evresi gibi; doğal tonlama ve akıcılık buradan gelir.</p></details>
<details><summary>🧠 Aralıklı tekrar</summary><p class="mut small">Ebbinghaus'un unutma eğrisi ve Leitner kutu sistemi: bilgiyi tam unutmak üzereyken tekrar etmek en kalıcı öğrenmeyi sağlar. Tekrar sekmesi bunu senin yerine planlar.</p></details>
<details><summary>👄 Algı eğitimi (minimal çiftler)</summary><p class="mut small">Yüksek değişkenlikli fonetik eğitim (HVPT) çalışmaları, yabancı sesleri ayırt etmeyi öğrenmenin söylemeyi de iyileştirdiğini gösterir. Kulak testleri bunun için.</p></details>
<details><summary>💬 Çıktı ve doğal düzeltme (recast)</summary><p class="mut small">Merrill Swain'in Çıktı Hipotezi: konuşmaya çalışınca eksiklerini fark edersin. Anneler çocuğun hatasını azarlamaz, doğru hâliyle tekrar eder ("Me goed!" → "Oh, you went?"). Sohbet sekmesindeki Sam de böyle düzeltir.</p></details>
<details><summary>📊 Sıklık ilkesi</summary><p class="mut small">Paul Nation'ın araştırmalarına göre en sık birkaç bin kelime ailesi günlük konuşmanın büyük kısmını kapsar. Bu yüzden nadir kelimeler değil, her gün duyulan kalıplar seçildi.</p></details></div>
<div class="card"><h3>⏰ Günlük rutin (~1 saat)</h3><div class="mut small">
<p>1. <b>Uygulama dersi</b> — 15-20 dk<br>2. <b>Kart tekrarı + dikte</b> — 5-10 dk<br>3. <b>Anlaşılır girdi</b> — 20-30 dk: bir Hikâye bölümü, sonra yolda 6 Minute English ya da İngilizce altyazılı YouTube<br>4. <b>İç ses</b> — gün boyu: "Now I'm making coffee. I'm so tired today..." diye kafanda anlat<br>5. <b>Gerçek sohbet</b> — haftada 2-3 kez: Sam ya da HelloTalk/Tandem'de gerçek biri</p>
<p><b>Daldırma (immersion):</b> Telefonunun dilini İngilizce yap. Dizileri Türkçe değil İngilizce altyazıyla izle. Sevdiğin içerikleri (oyun, SAP, futbol) İngilizce tüket.</p></div></div>
<div class="card"><h3>✨ "Ohaa" dedirten 8 doğallık sırrı</h3><div class="mut small"><p>1. <b>Hep kısalt:</b> I'm, don't, it's, I'll — asla "I am not".<br>2. <b>gonna / wanna / gotta</b> de.<br>3. <b>Dolgu kelimeleri:</b> well, like, you know, I mean, kind of — "ııı" yerine.<br>4. <b>Tepki ver:</b> No way! Seriously? That's awesome! — dinlediğini gösterir.<br>5. <b>Kısa cevaplar:</b> "Yeah, totally." / "Not really." — tam cümle şart değil.<br>6. <b>Bağla:</b> pick it up → "pikidap".<br>7. <b>Vurgula ve tonla:</b> önemli kelimeye bas, sorunun sonunda sesi yükselt.<br>8. <b>Soru ekleri:</b> "..., right?" "..., huh?" sohbeti canlı tutar.</p></div></div>

let sampleFn=null,sampleTried=false;
async function getSample(){if(sampleFn)return sampleFn;if(!window.claude||!claude.use){chat.unavailable=true;return null}const s=await claude.use("sample");if(!s){chat.unavailable=true;return null}sampleFn=s;return s}
const ROLES=[["İş görüşmesi","ROLE-PLAY: You are Sam, a friendly hiring manager at an international company interviewing the learner (an experienced SAP FI consultant) for a job. Ask one interview question at a time."],["Otelde check-in","ROLE-PLAY: You are Sam, a hotel receptionist in New York. The learner is checking in. Be helpful; maybe there is a small problem with the room."],["Restoranda sipariş","ROLE-PLAY: You are Sam, a chatty waiter in a London restaurant. Take the learner's order and make small talk."],["Müşteri toplantısı","ROLE-PLAY: You are Sam, a finance manager at a client company. The learner is a consultant presenting a new SAP report. Ask practical questions about requirements, timeline and price."],["Havalimanında kayıp bavul","ROLE-PLAY: You are Sam, an airline staff member at the lost luggage desk. The learner's bag didn't arrive. Ask for details."],["Doktorda","ROLE-PLAY: You are Sam, a kind doctor. The learner is a patient who doesn't feel well. Ask about symptoms one question at a time."],["Yeni komşu","ROLE-PLAY: You are Sam, the learner's new neighbor who just moved in next door. Introduce yourself and make friendly small talk."],["Mağazada iade","ROLE-PLAY: You are Sam, a store employee. The learner wants to return a product. Be a little difficult at first, then helpful."],["Ev sahibiyle kira","ROLE-PLAY: You are Sam, a landlord in London showing an apartment to the learner. Answer questions about rent, rules and the area."],["Arkadaşla dedikodu","ROLE-PLAY: You are Sam, the learner's close friend. You have juicy (harmless, funny) news about a mutual friend. Use casual slang."]];
function chatTopics(){const t=[{n:"💬 Serbest sohbet",p:"Topic: anything casual (daily life, work, hobbies, weekend)."}];ROLES.forEach(r=>t.push({n:"🎭 Rol: "+r[0],p:r[1]}));DAYS.slice(0,Math.max(1,Math.min(N,S.cur))).forEach((d,i)=>t.push({n:"📘 Gün "+(i+1)+": "+d.t,p:"Topic: "+d.t+" — naturally use phrases like: "+d.c.map(x=>sp(x)[0]).join("; ")}));return t}
function topicName(){const t=chatTopics();return(t[chat.topic]||t[0]).p}
function transcript(){return chat.msgs.filter(m=>m.r!=="sys").map(m=>(m.r==="ai"?"Sam: ":"Learner: ")+m.t).join("\n")}
function parseJSON(t){try{return JSON.parse(t)}catch(e){}const m=t&&t.match(/\{[\s\S]*\}/);if(m){try{return JSON.parse(m[0])}catch(e){}}return null}
async function ask(prompt){const s=await getSample();if(!s)return null;try{let v=null;if(s.json){try{v=await s.json(prompt,{modelTier:"quick",cache:false})}catch(e){if(e&&(e.code==="not_granted"||e.code==="rate_limited"))throw e}}if(!v||typeof v!=="object"){const r=await s(prompt,{modelTier:"quick",cache:false});v=parseJSON(r&&r.text)}return v}catch(e){if(e&&e.code==="not_granted"){chat.unavailable=true}else if(e&&e.code==="rate_limited"){chat.msgs.push({r:"sys",html:"Biraz yavaşla — çok hızlı mesaj gitti. Bir dakika sonra tekrar dene."})}else{chat.msgs.push({r:"sys",html:"Bağlantı sorunu oldu, tekrar dene."})}return null}}
const SAM=`You are Sam, a warm, funny American in your 30s, chatting casually by text with a Turkish adult who is learning English (around A2-B1 level). They want to sound natural, like a native speaker.
Rules for your reply: casual spoken American English, 1-3 SHORT sentences, everyday words, contractions, natural chunks (gonna, kind of, no way, etc.). Show interest, react naturally, and end with ONE simple question to keep the chat going. Never lecture, never explain grammar in the reply.`;
async function chatTurn(first){chat.busy=true;render();const p=SAM+`\n${topicName()}\n`+(first?`Start the conversation (or the role-play scene) with a friendly opener.\nReturn ONLY JSON: {"reply":"..."}`:`Also look at the learner's LAST message. If it has a grammar mistake, a wrong word, or sounds unnatural/textbook-like, write the most natural way a native speaker would say the same thing in "correction". If it's already natural, set "correction" to "". "note_tr" = one short Turkish sentence explaining the fix, or "".\nConversation so far:\n${transcript()}\nReturn ONLY JSON: {"reply":"...","correction":"...","note_tr":"..."}`);const v=await ask(p);chat.busy=false;if(v&&v.reply){if(!first){const last=[...chat.msgs].reverse().find(m=>m.r==="me");if(last&&v.correction&&norm(v.correction).join(" ")!==norm(last.t).join(" ")){last.fix=v.correction;last.note=v.note_tr||""}}chat.msgs.push({r:"ai",t:String(v.reply)});if(chat.msgs.filter(m=>m.r==="me").length>=3)tick("sohbet",true,true);render();if(chat.auto)say(String(v.reply))}else render()}
async function howSay(text){chat.busy=true;render();const v=await ask(`A Turkish learner wants to say this in natural, casual spoken English (how a native speaker would really say it, not a literal translation): "${text}"\nReturn ONLY JSON: {"natural":"...","alternatives":["...","..."],"note_tr":"one short Turkish tip, or empty"}`);chat.busy=false;if(v&&v.natural){const alts=[v.natural,...(Array.isArray(v.alternatives)?v.alternatives:[])].slice(0,3);chat.msgs.push({r:"sys",html:`<div class="mut small">🇹🇷 "${esc(text)}"</div>`+alts.map((a,i)=>`<div style="margin-top:6px"><b>${i===0?"⭐ ":""}${esc(a)}</b> <button class="ghost" style="padding:2px 7px;font-size:12px" data-act="say" data-t="${esc(a)}">🔊</button> <button class="ghost" style="padding:2px 7px;font-size:12px" data-act="use" data-t="${esc(a)}">Kullan</button></div>`).join("")+(v.note_tr?`<div class="mut small" style="margin-top:6px">${esc(v.note_tr)}</div>`:"")});say(v.natural)}render()}

document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el||el.tagName==="SELECT"||(el.tagName==="INPUT"&&el.type==="checkbox"))return;const a=el.dataset.act,ds=el.dataset;
const lines=L?DAYS[L.day-1].d.map(sp):[];
switch(a){
case"tab":stopTTS();if(tab===ds.v&&ds.v==="stories")ST=null;tab=ds.v;quiz=null;render();window.scrollTo(0,0);break;
case"open":L={day:+ds.d,step:0,sh:0};quiz=null;render();window.scrollTo(0,0);break;
case"close":stopTTS();L=null;render();break;
case"step":stopTTS();L.step=Math.max(0,Math.min(5,L.step+ +ds.v));if(L.step===3)addCards(L.day);quiz=null;render();window.scrollTo(0,0);break;
case"playall":playSeq(lines,ds.r?+ds.r:undefined);break;
case"stop":stopTTS();break;
case"line":say(lines[+ds.i][1],lines[+ds.i][0],ds.r?+ds.r:undefined);break;
case"loop":(async()=>{stopTTS();const tok=playTok;for(let k=0;k<3;k++){if(tok!==playTok)return;await speak(lines[+ds.i][1],lines[+ds.i][0]);await new Promise(r=>setTimeout(r,1800))}})();break;
case"reveal":el.classList.remove("hid");break;
case"unblur":el.style.filter="none";break;
case"sh":{const n=L.sh+ +ds.v;if(n>=lines.length){L.step=3;addCards(L.day);render();window.scrollTo(0,0)}else{L.sh=Math.max(0,n);render()}break}
case"check":{const said=$("#said").value.trim();if(!said){toast("Önce söyle ya da yaz");return}const r=compare(lines[+ds.i][1],said);$("#res").innerHTML=`<div class="tip"><div class="score" style="color:${r.score>=85?"var(--ok)":r.score>=60?"#d9900f":"var(--bad)"}">${r.score}% ${r.score>=85?"🔥":r.score>=60?"👍":"💪"}</div><div style="font-size:17px">${r.html}</div><div class="mut small" style="margin-top:4px">${r.score>=85?"Harika! Telefon seni anladı.":"Kırmızı kelimeleri tekrar dinle, yavaş söyle ve yeniden dene."}</div></div>`;break}
case"say":say(ds.t);break;
case"snd":openSound=openSound===+ds.i?-1:+ds.i;quiz=null;render();break;
case"quiz":newQuiz(+ds.i);render();break;
case"qplay":say(quiz.pair[quiz.k]);break;
case"qans":if(quiz.ans)return;quiz.ans=true;quiz.pickK=+ds.k;if(quiz.pickK===quiz.k)quiz.ok++;render();break;
case"qnext":newQuiz(quiz.s,quiz);render();break;
case"timer":if(timer){clearInterval(timer.h);timer=null;render()}else{timer={left:120};timer.h=setInterval(()=>{timer.left--;const t=$("#timer");if(t)t.textContent=fmt(Math.max(0,timer.left));if(timer.left<=0){clearInterval(timer.h);timer=null;toast("⏰ Süre bitti! Harika iş.");render()}},1000);render()}break;
case"finish":{const d=L.day;addCards(d);if(!S.done[d])S.done[d]=Date.now();let n=1;while(S.done[n])n++;S.cur=Math.min(N,n);const t=today(),s=S.streak;if(s.last!==t){const diff=s.last?Math.round((new Date(t)-new Date(s.last))/DAYMS):99;s.n=diff===1?s.n+1:1;s.last=t}tick("ders",true,true);save();if(timer){clearInterval(timer.h);timer=null}L=null;render();window.scrollTo(0,0);toast(Object.keys(S.done).length>=N?"🏆 90 gün tamam! Ohaaa!":(d%30===0?"🏅 "+levelOf(d).n.split(" · ")[0]+" tamamlandı!":"🎉 Gün "+d+" tamamlandı!"));break}
case"chk":tick(ds.k);break;
case"intro":S.intro=true;save();render();break;
case"rm":RM=ds.v;stopTTS();render();if(RM==="dict"&&DQ&&!DQ.res)dictPlay();break;
case"dplay":dictPlay(ds.r?+ds.r:undefined);break;
case"dcheck":case"dshow":{const v=a==="dshow"?"":$("#dsaid").value.trim();if(a==="dcheck"&&!v){toast("Önce duyduğunu yaz");return}const r=compare(dictLine()[1],v);DQ.res=r;DQ.said=v;S.dict=S.dict||{n:0,ok:0};S.dict.n++;S.dict.ok+=r.score;save();render();break}
case"dnext":newDict();render();break;
case"story":ST={i:+ds.i,cur:-1,tr:false};render();window.scrollTo(0,0);break;
case"stclose":stopTTS();ST=null;render();break;
case"stline":{const i=+ds.i;ST.cur=i;document.querySelectorAll(".st").forEach((e,k)=>e.classList.toggle("on",k===i));say(sp(STORIES[ST.i].s[i])[0],"A");break}
case"stall":storyPlay(ds.r?+ds.r:undefined);break;
case"sttr":ST.tr=!ST.tr;render();break;
case"stdone":S.stories[ST.i+1]=Date.now();tick("girdi",true,true);save();stopTTS();ST=null;render();toast("📚 Hikâye bitti!");break;
case"rate":S.rate=+ds.r;save();render();say("This is how fast I'll speak.");break;
case"flip":R.show=true;render();if(!R.listen)say(cardData(R.id).en.replace(/\.\.\.\w*|…/g,"").replace(/\s+([?!.,])/g,"$1").trim());break;
case"rateC":rate(R.id,+ds.r);R=null;render();break;
case"chatstart":chatTurn(true);break;
case"send":{const t=$("#cin").value.trim();if(!t||chat.busy)return;chat.msgs.push({r:"me",t});chatTurn(false);break}
case"howsay":{const t=$("#cin").value.trim();if(!t){toast("Kutuya Türkçe cümleni yaz");return}howSay(t);break}
case"use":render();$("#cin").value=ds.t;$("#cin").focus();break;
case"chatreset":stopTTS();chat.msgs=[];render();break;

document.addEventListener("change",e=>{const el=e.target;if(el.dataset.act==="topic"){chat.topic=+el.value;chat.msgs=[];render()}if(el.dataset.act==="auto"){chat.auto=el.checked}if(el.dataset.act==="sttr"){ST.tr=el.checked;render()}if(el.dataset.act==="hidetxt"){S.hideText=el.checked;save();render()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){if(e.target.id==="dsaid"){e.preventDefault();const b=document.querySelector('[data-act="dcheck"]');if(b)b.click()}else if(e.target.id==="cin"){e.preventDefault();document.querySelector('[data-act="send"]').click()}else if(e.target.id==="said"){e.preventDefault();document.querySelector('[data-act="check"]').click()}}});

<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#171d48">
<meta name="description" content="8 SANİYE! 10 farklı mini oyun. Düşünmeye gerek yok; dokun, sürükle, kaydır ve eğlen. Ücretsiz mobil ve masaüstü web oyunu.">
<title>8 SANİYE! — Eğlenceli Mini Oyunlar</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;width:100%;overflow:hidden;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 8%,#4958a0,#131632 70%);font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:#fff}
#app{position:relative;width:min(100vw,440px,55.263dvh);aspect-ratio:420/760;max-height:100dvh;overflow:hidden;background:#171d48;box-shadow:0 35px 95px #090b24ba,0 0 0 3px #ffffff18;isolation:isolate}
canvas{width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;inset:0;z-index:3;pointer-events:none;display:none}
#top{position:absolute;left:11px;right:11px;top:calc(12px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;gap:5px}
.hudpill{background:#171a3aeb;border:2px solid #ffffff43;box-shadow:0 4px 0 #080b24ac;border-radius:14px;padding:6px 7px;min-width:70px;font-weight:1000;color:#fff;text-align:center;font-size:17px;font-variant-numeric:tabular-nums}
.hudpill small{display:block;letter-spacing:1px;color:#b4c8e8;font-size:9px;font-weight:1000}
#hearts{font-size:20px;color:#ff7398;letter-spacing:-3px;white-space:nowrap}
.ctrl{pointer-events:auto;cursor:pointer;width:34px;height:39px;color:#fff;border:2px solid #fff5;background:#222c5d;border-radius:11px;font-size:18px;box-shadow:0 4px 0 #0e173c}
#barOuter{position:absolute;left:16px;right:16px;top:calc(70px + env(safe-area-inset-top));background:#111b3fae;border:2px solid #fff7;border-radius:99px;height:18px;overflow:hidden}
#bar{height:100%;width:100%;background:linear-gradient(90deg,#62efa4,#fff49d);border-radius:99px}
#roundBanner{position:absolute;left:20px;right:20px;top:calc(105px + env(safe-area-inset-top));text-align:center;text-shadow:0 3px 0 #1c2459}
#name{font-size:clamp(27px,7.5vw,36px);font-weight:1000;letter-spacing:-1.3px;line-height:1.03}
#hint{font-size:13px;font-weight:900;color:#fffbe3;margin-top:8px;line-height:1.3}
#progress{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#1c2750e5;border:2px solid #ffffff4e;border-radius:99px;padding:8px 22px;font-size:15px;font-weight:1000;text-align:center;white-space:nowrap;box-shadow:0 4px 0 #101b3c}
#toast{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%) scale(.84);z-index:8;white-space:nowrap;opacity:0;pointer-events:none;font-size:31px;font-weight:1000;color:#fff8e7;text-shadow:0 4px #293b76;filter:drop-shadow(0 4px 12px #0e154b);transition:.13s}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#overlay{position:absolute;inset:0;z-index:9;display:flex;justify-content:center;align-items:center;padding:14px;background:#161c42b5;backdrop-filter:blur(5px)}
#overlay.off{display:none}
.panel{width:100%;max-width:365px;max-height:97%;overflow-y:auto;padding:25px 22px 20px;background:#fff7de;border:4px solid #fff;border-radius:31px;box-shadow:0 9px 0 #d78e7d,0 24px 90px #0b0f31a8;color:#303958;text-align:center}
.strap{display:inline-block;padding:6px 12px;background:#ff6f71;border-radius:99px;font-weight:1000;font-size:10px;letter-spacing:1.7px;color:white;transform:rotate(-3deg)}
h1{font-size:clamp(45px,13.5vw,64px);line-height:.89;letter-spacing:-4px;color:#f05f73;margin:17px 0 9px;text-shadow:3px 5px #f7cca9}
h1 span{display:block;color:#475fc2;text-shadow:3px 5px #cbd7ff}
h2{font-size:clamp(29px,8vw,37px);letter-spacing:-1.3px;color:#4556aa;margin:12px 0}
.lead{color:#686e81;font-size:14px;line-height:1.6;margin:13px 0}
.emojiLine{display:flex;justify-content:center;gap:13px;font-size:47px;padding:9px 0;filter:drop-shadow(0 8px 3px #a56e5140)}
.em{animation:bob 1.7s ease-in-out infinite}.em:nth-child(2){animation-delay:-.4s}.em:nth-child(3){animation-delay:-.8s}
@keyframes bob{50%{transform:translateY(-11px) rotate(-7deg)}}
.btn{display:block;width:100%;border:none;border-radius:16px;background:#ff6a70;color:#fff;font:1000 18px ui-rounded,system-ui,sans-serif;padding:16px 14px;margin-top:13px;box-shadow:0 6px 0 #bb3d53;cursor:pointer}
.btn.alt{background:#556dc8;box-shadow:0 6px 0 #304a92;font-size:14px}
.btn:active{transform:translateY(3px);box-shadow:none}
.stats{display:flex;gap:8px;margin:17px 0 6px}
.stats div{flex:1;border:2px solid #f3cea2;border-radius:14px;padding:9px 4px;background:#fffdf1}
.stats b{display:block;font-size:23px;color:#e56b65}
.stats small{display:block;font-weight:950;font-size:9px;color:#8b7a80;letter-spacing:1px}
.caption{margin:14px 0 0;font-size:11px;font-weight:800;color:#aaa0a0}
@media(max-height:610px){.panel{padding:14px 18px}.emojiLine{padding:3px 0;font-size:37px}h1{font-size:46px;margin:9px 0}.lead{margin:6px 0}.btn{margin-top:8px;padding:12px}.stats{margin:9px 0}}
@media(prefers-reduced-motion:reduce){.em{animation:none}#toast{transition:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="game" aria-label="8 Saniye oyun alanı"></canvas>
  <div id="hud">
    <div id="top"><div class="hudpill"><small>TUR</small><span id="round">1</span></div>
    <div class="hudpill"><small>PUAN</small><span id="score">0</span></div>
    <div id="hearts">♥♥♥</div>
    <button class="ctrl" id="pause" aria-label="Duraklat">Ⅱ</button>
    <button class="ctrl" id="mute" aria-label="Sesi aç veya kapat">♫</button></div>
    <div id="barOuter"><div id="bar"></div></div>
    <div id="roundBanner"><div id="name">BALON PATLAT!</div><div id="hint">Balonlara dokun!</div></div>
    <div id="progress">0 / 4</div>
  </div>
  <div id="toast"></div>
  <div id="overlay"></div>
</div>
<script>
(()=>{
"use strict";
const W=420,H=760,canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id),hud=$("hud"),overlay=$("overlay"),toast=$("toast");
const r=(a,b)=>a+Math.random()*(b-a),clip=(n,a,b)=>Math.max(a,Math.min(n,b)),distance=(x,y,a,b)=>Math.hypot(x-a,y-b);
const TYPES=[
 {key:"balloon",name:"BALON PATLAT!",hint:"Renkli balonlara DOKUN!",color:["#6b93f6","#b57dea"],goal:5,icon:"🎈"},
 {key:"fly",name:"SİNEK AVI!",hint:"Kaçan sineklere DOKUN!",color:["#54bbba","#8bd99b"],goal:4,icon:"🪰"},
 {key:"catch",name:"YILDIZ YAĞMURU!",hint:"Sepeti SÜRÜKLE, yıldızları yakala!",color:["#5f93d3","#96cdf2"],goal:4,icon:"⭐"},
 {key:"wash",name:"CAMLARI SİL!",hint:"Kirleri parmağınla SİL!",color:["#78b2e1","#b0dcd6"],goal:7,icon:"🧽"},
 {key:"feed",name:"KEDİ ACİKTİ!",hint:"Balığı kediye SÜRÜKLE!",color:["#f7a56f","#ffd29c"],goal:3,icon:"🐱"},
 {key:"mole",name:"KÖSTEBEK ÇIKTI!",hint:"Çıkan köstebeklere DOKUN!",color:["#7ab57a","#c8d47e"],goal:4,icon:"🐹"},
 {key:"rocket",name:"ROKETİ UÇUR!",hint:"ATEŞLE'ye HIZLI HIZLI DOKUN!",color:["#586ac4","#a56ccc"],goal:10,icon:"🚀"},
 {key:"fruit",name:"MEYVE ŞENLİĞİ!",hint:"Meyveleri KAYDIRARAK kes!",color:["#f09a65","#f9cf7d"],goal:4,icon:"🍉"},
 {key:"bubble",name:"KÖPÜK PARTİSİ!",hint:"Köpükleri DOKUNUP patlat!",color:["#72afdb","#a3e9de"],goal:6,icon:"🫧"},
 {key:"parking",name:"PARK ET!",hint:"Arabayı garaja SÜRÜKLE!",color:["#68bfc8","#b8e6a7"],goal:3,icon:"🚗"}
];
const KEY="8saniye-mini-oyun-v1";
let save={best:0,games:0,wins:0,sound:true};
try{save=Object.assign(save,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(_){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(_){}}
let state="menu",type=null,game=null,round=0,score=0,lives=3,streak=0,remaining=8,transition=0,order=[],dragging=false,ptr=null,last=performance.now(),t=0;
let particles=[],audio=null,shake=0,toastTimer=0,pressed=false;
function resize(){
 canvas.width=W*2;canvas.height=H*2;ctx.setTransform(2,0,0,2,0,0);
}
resize();
function rounded(x,y,w,h,rad){rad=Math.min(rad,w/2,h/2);ctx.beginPath();ctx.moveTo(x+rad,y);ctx.arcTo(x+w,y,x+w,y+h,rad);ctx.arcTo(x+w,y+h,x,y+h,rad);ctx.arcTo(x,y+h,x,y,rad);ctx.arcTo(x,y,x+w,y,rad);ctx.closePath();}
function box(x,y,w,h,rad,color){ctx.fillStyle=color;rounded(x,y,w,h,rad);ctx.fill();}
function circ(x,y,rad,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,rad,0,Math.PI*2);ctx.fill();}
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();}
function text(s,x,y,size=20,color="#fff",align="center",weight=900){
 ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline="middle";ctx.font=weight+" "+size+"px ui-rounded,system-ui,sans-serif";ctx.fillText(s,x,y);
}
function gradient(x,y,rad,a,b){const gr=ctx.createRadialGradient(x-rad*.35,y-rad*.45,0,x,y,rad);gr.addColorStop(0,a);gr.addColorStop(1,b);return gr;}
function spark(x,y,color="#fff3b2",n=12){
 for(let i=0;i<n;i++){const a=r(0,Math.PI*2),v=r(80,260),life=r(.24,.7);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life,max:life,color,size:r(2,6)});}
 if(particles.length>230)particles.splice(0,particles.length-230);
}
function sfx(kind){
 if(!save.sound)return;
 try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audio)audio=new AC();if(audio.state==="suspended")audio.resume();
 const now=audio.currentTime,o=audio.createOscillator(),v=audio.createGain(),f={pop:610,hit:750,win:950,fail:190,click:410}[kind]||600;
 o.type=kind==="fail"?"sawtooth":"sine";o.frequency.setValueAtTime(f,now);o.frequency.exponentialRampToValueAtTime(kind==="fail"?88:f*1.55,now+.14);
 v.gain.setValueAtTime(.0001,now);v.gain.exponentialRampToValueAtTime(.048,now+.014);v.gain.exponentialRampToValueAtTime(.0001,now+.18);
 o.connect(v);v.connect(audio.destination);o.start(now);o.stop(now+.19);}catch(_){}
}
function announce(msg){toast.textContent=msg;toast.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove("show"),750);}
function randomSpot(i,seed=0){return {x:67+(i%3)*135+r(-15,15),y:327+Math.floor(i/3)*132+r(-24,24),phase:r(0,Math.PI*2)}}
function randomType(){
 if(order.length===0){order=TYPES.map((_,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor(r(0,i+1));[order[i],order[j]]=[order[j],order[i]];}}
 return TYPES[order.shift()];
}
function setup(){
 type=randomType();round++;remaining=8;dragging=false;ptr=null;pressed=false;state="play";t=0;
 game={got:0,goal:type.goal,items:[],drag:null,basketX:210,elapsed:0,nextSpawn:.16,rocket:0,mouseX:210,mouseY:570};
 const q=game;
 if(type.key==="balloon")for(let i=0;i<7;i++)q.items.push({...randomSpot(i),hue:i%5,done:false,r:27});
 if(type.key==="fly")for(let i=0;i<6;i++)q.items.push({...randomSpot(i),done:false,r:26,speed:r(.8,1.7)});
 if(type.key==="wash")for(let i=0;i<7;i++)q.items.push({...randomSpot(i),x:132+(i%3)*79,y:365+Math.floor(i/3)*91,done:false,r:27});
 if(type.key==="mole")for(let i=0;i<6;i++)q.items.push({x:93+(i%3)*117,y:385+Math.floor(i/3)*167,done:false,show:i%2===0});
 if(type.key==="fruit")for(let i=0;i<6;i++)q.items.push({...randomSpot(i),x:100+(i%3)*109,y:360+Math.floor(i/3)*174,r:32,done:false,kind:i%3});
 if(type.key==="bubble")for(let i=0;i<9;i++)q.items.push({...randomSpot(i),x:68+(i%3)*138,y:315+Math.floor(i/3)*122,done:false,r:r(24,30),speed:r(.6,1.25)});
 if(type.key==="feed")q.items=[{x:105,y:522,done:false}];
 if(type.key==="parking")q.items=[{x:93,y:532,done:false}];
 hud.style.display="block";overlay.classList.add("off");$("name").textContent=type.name;$("hint").textContent=type.hint;
 updateHud();announce(type.icon+" "+type.name);sfx("click");
}
function updateHud(){
 $("round").textContent=round;$("score").textContent=score;$("hearts").textContent="♥".repeat(lives)+"♡".repeat(3-lives);
 $("progress").textContent=game?game.got+" / "+game.goal:"0 / 0";
 $("bar").style.width=(clip(remaining/8,0,1)*100)+"%";
 $("bar").style.background=remaining<2.3?"linear-gradient(90deg,#fd7679,#ffbb6d)":"linear-gradient(90deg,#61f2ac,#ffe68a)";
 $("mute").textContent=save.sound?"♫":"♪̸";
}
function menu(which){
 state=which;overlay.classList.remove("off");hud.style.display=which==="pause"?"block":"none";
 let html="";
 if(which==="menu"){
  html='<div class="strap">BİR TUR DAHA!</div><h1>8<span>SANİYE!</span></h1><div class="emojiLine"><span class="em">🎈</span><span class="em">🐱</span><span class="em">🚀</span></div>'+
  '<p class="lead"><b>Her 8 saniyede başka çılgınlık!</b> Balon patlat, sinek yakala, roket uçur. Hafıza oyunu yok, karmaşık kural yok. Dokun, sürükle, eğlen!</p>'+
  '<div class="stats"><div><b>10</b><small>MİNİ OYUN</small></div><div><b>'+save.best+'</b><small>REKOR</small></div><div><b>'+save.wins+'</b><small>KAZANILAN TUR</small></div></div>'+
  '<button class="btn" data-action="start">▶ HEMEN OYNA</button><p class="caption">Telefon + bilgisayar · Kayıt otomatik</p>';
 }else if(which==="over"){
  html='<div class="strap">OYUN BİTTİ</div><h2>VAY CANINA!</h2><div class="emojiLine"><span>🏆</span><span>🎉</span><span>⭐</span></div>'+
  '<p class="lead">Bu sefer <b>'+score+' puan</b> topladın ve <b>'+(round-1)+' tur</b> bitirdin. Sıradaki rekoru kırabilir misin?</p>'+
  '<div class="stats"><div><b>'+score+'</b><small>PUANIN</small></div><div><b>'+save.best+'</b><small>REKOR</small></div><div><b>'+save.wins+'</b><small>TAMAMLANAN</small></div></div>'+
  '<button class="btn" data-action="start">↻ BİR DAHA OYNA</button><button class="btn alt" data-action="menu">ANA MENÜ</button>';
 }else if(which==="pause"){
  html='<div class="strap">8 SANİYE KISA MOLA</div><h2>ÇAY MOLASI! ☕</h2><p class="lead">Durduğun yerden devam edebilirsin. Süre kaybolmadı.</p>'+
  '<button class="btn" data-action="resume">▶ DEVAM ET</button><button class="btn alt" data-action="menu">ANA MENÜ</button>';
 }
 overlay.innerHTML='<div class="panel">'+html+'</div>';
}
function begin(){round=0;score=0;lives=3;streak=0;order=[];save.games++;persist();setup();}
function finish(ok){
 if(state!=="play")return;
 if(ok){state="win";score+=100+Math.round(remaining*20)+streak*10;streak++;save.wins++;announce("HARİKA! +"+(100+Math.round(remaining*20)+(streak-1)*10));sfx("win");}
 else {state="lost";lives--;streak=0;shake=13;announce("OLMADI! 💔");sfx("fail");}
 save.best=Math.max(save.best,score);persist();transition=.95;updateHud();
}
function gain(x,y,color="#ffdd74"){
 if(state!=="play")return;game.got++;spark(x,y,color,19);sfx("pop");
 if(game.got>=game.goal)finish(true);else updateHud();
}
function pointerPoint(e){const rc=canvas.getBoundingClientRect();return {x:clip((e.clientX-rc.left)/rc.width*W,0,W),y:clip((e.clientY-rc.top)/rc.height*H,0,H)}}
function segmentDist(px,py,x1,y1,x2,y2){
 const dx=x2-x1,dy=y2-y1,t=clip(((px-x1)*dx+(py-y1)*dy)/(dx*dx+dy*dy||1),0,1);
 return distance(px,py,x1+t*dx,y1+t*dy);
}
function tap(x,y){
 const q=game;
 if(type.key==="rocket"){
  if(y>380){q.rocket++;gain(x,y,"#ffcc77");}
  return;
 }
 if(type.key==="mole"){
  for(const a of q.items){if(a.show&&!a.done&&distance(x,y,a.x,a.y-30)<45){a.done=true;a.show=false;gain(x,y,"#fff0a2");return;}}
 }
 if(["balloon","fly","bubble"].includes(type.key)){
  for(const a of q.items){
   if(a.done)continue;
   let ax=a.x,ay=a.y;
   if(type.key==="balloon"){ay+=Math.sin(q.elapsed*2+a.phase)*11;}
   if(type.key==="fly"){ax+=Math.sin(q.elapsed*1.7*a.speed+a.phase)*23;ay+=Math.cos(q.elapsed*2*a.speed+a.phase)*16;}
   if(type.key==="bubble"){ax+=Math.sin(q.elapsed*a.speed+a.phase)*15;ay+=Math.sin(q.elapsed*1.3+a.phase)*12;}
   if(distance(x,y,ax,ay)<a.r+13){a.done=true;gain(ax,ay,type.key==="bubble"?"#c0f8ff":"#ffeb88");return;}
  }
 }
}
function scrub(x,y,oldX=x,oldY=y){
 if(type.key==="wash"||type.key==="fruit"){
  const q=game;
  for(const a of q.items){
   if(a.done)continue;
   const rad=type.key==="wash"?a.r+18:a.r+9;
   if(segmentDist(a.x,a.y,oldX,oldY,x,y)<rad){
    a.done=true;gain(a.x,a.y,type.key==="wash"?"#b8f5ff":"#ffe08e");
    if(state!=="play")break;
   }
  }
 }
}
function startPointer(e){
 if(state!=="play")return;e.preventDefault();
 if(ptr!==null)return;ptr=e.pointerId;
 try{canvas.setPointerCapture(e.pointerId)}catch(_){}
 const p=pointerPoint(e);dragging=true;game.mouseX=p.x;game.mouseY=p.y;
 if(["rocket","mole","fly","balloon","bubble"].includes(type.key))tap(p.x,p.y);
 else if(type.key==="catch")game.basketX=clip(p.x,52,368);
 else if(type.key==="wash"||type.key==="fruit")scrub(p.x,p.y);
 else if(type.key==="feed"||type.key==="parking"){
  const thing=game.items[0],radius=type.key==="feed"?52:60;
  if(distance(p.x,p.y,thing.x,thing.y)<radius)game.drag={x:p.x,y:p.y,offsetX:thing.x-p.x,offsetY:thing.y-p.y};
 }
}
function movePointer(e){
 if(!dragging||e.pointerId!==ptr||state!=="play")return;e.preventDefault();
 const p=pointerPoint(e),q=game;
 if(type.key==="catch")q.basketX=clip(p.x,52,368);
 if(type.key==="wash"||type.key==="fruit")scrub(p.x,p.y,q.mouseX,q.mouseY);
 if(q.drag){const a=q.items[0];a.x=clip(p.x+q.drag.offsetX,36,383);a.y=clip(p.y+q.drag.offsetY,278,645);}
 q.mouseX=p.x;q.mouseY=p.y;
}
function endPointer(e){
 if(e&&ptr!==null&&e.pointerId!==ptr)return;
 if(state==="play"&&game.drag){
  const a=game.items[0];
  if(type.key==="feed"&&distance(a.x,a.y,323,507)<79){gain(323,507,"#ffdfac");if(state==="play")game.items=[{x:105,y:522}];}
  else if(type.key==="parking"&&Math.abs(a.x-325)<61&&Math.abs(a.y-530)<82){gain(325,530,"#9cfacb");if(state==="play")game.items=[{x:93,y:532}];}
  else {a.x=type.key==="feed"?105:93;a.y=type.key==="feed"?522:532;}
  game.drag=null;
 }
 dragging=false;ptr=null;
}
canvas.addEventListener("pointerdown",startPointer,{passive:false});
canvas.addEventListener("pointermove",movePointer,{passive:false});
canvas.addEventListener("pointerup",endPointer);
canvas.addEventListener("pointercancel",endPointer);
function update(dt){
 if(state==="play"){
  t+=dt;game.elapsed+=dt;remaining=Math.max(0,remaining-dt);
  if(type.key==="catch"){
   game.nextSpawn-=dt;
   if(game.nextSpawn<=0){game.nextSpawn=.43;game.items.push({x:r(55,365),y:248,vy:r(165,205)+round*2,done:false});}
   for(const a of game.items){

   }
   game.items=game.items.filter(a=>!a.done);

 }else if(state==="win"||state==="lost"){
  transition-=dt;

 }

}

function loop(now){

 if(state!=="pause"&&state!=="menu"&&state!=="over")update(dt);
 else {for(let i=particles.length-1;i>=0;i--){particles[i].life-=dt;if(particles[i].life<=0)particles.splice(i,1);}}
 draw();requestAnimationFrame(loop);
}

}

 const action=b.dataset.action;
 if(action==="start")begin();
 else if(action==="resume"){state="play";overlay.classList.add("off");hud.style.display="block";last=performance.now();}
 else if(action==="menu"){round=0;game=null;type=null;menu("menu");}
});

addEventListener("keydown",e=>{if((e.code==="Escape"||e.code==="KeyP")&&state==="play"){e.preventDefault();pauseGame();}else if(e.code==="Enter"&&state==="menu"){begin();}else if(e.code==="Space"&&state==="play"&&type.key==="rocket"){e.preventDefault();tap(210,580);}});
menu("menu");requestAnimationFrame(loop);
})();

<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070f29">
<meta name="description" content="JET KAOS: 12 bölümlü, 4 dev boss'lu, güçlendirmeli ve sonsuz modlu retro 2D atari uzay savaşı.">
<title>JET KAOS — Retro 2D Atari</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 4%,#283363,#070b1c 75%);font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:white}
#shell{position:relative;width:min(100vw,470px,55.2632dvh);aspect-ratio:420/760;max-height:100dvh;overflow:hidden;background:#071329;box-shadow:0 0 0 3px #80baff18,0 28px 95px #000c}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;inset:0;z-index:2;display:none;pointer-events:none}
#top{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;display:flex;align-items:flex-start;gap:6px}
.pill{min-width:0;background:#0c1736dd;border:1px solid #77baff57;border-radius:11px;padding:6px 9px;box-shadow:inset 0 1px #ffffff23,0 3px 11px #0007;font-weight:1000;font-size:17px;font-variant-numeric:tabular-nums}
.pill small{display:block;font-size:9px;letter-spacing:1px;color:#98bfeb;margin-bottom:2px}
.pill.health{flex:1}
#hp{color:#ff778e;letter-spacing:1px;font-size:19px;white-space:nowrap}
.ctrl{pointer-events:auto;cursor:pointer;display:grid;place-items:center;width:38px;height:40px;flex:0 0 38px;color:white;background:#132753e0;border:1px solid #89b4e872;border-radius:10px;font-size:20px}
#zone{position:absolute;top:calc(68px + env(safe-area-inset-top));left:12px;right:12px;display:flex;align-items:center;justify-content:space-between;gap:6px;color:#ddefff;text-shadow:0 2px #000;font-weight:1000;font-size:11px;letter-spacing:1px}
#stage{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bossHud{position:absolute;top:calc(89px + env(safe-area-inset-top));left:24px;right:24px;display:none}
#bossName{display:flex;justify-content:space-between;font-weight:950;font-size:11px;margin-bottom:4px;color:#ffd7e1;letter-spacing:1px}
#bossOuter{height:10px;background:#441b48;border:1px solid #ff9cba9e;border-radius:10px;overflow:hidden}
#bossInner{height:100%;background:linear-gradient(90deg,#e94b81,#ffc08e);width:100%}
#bottom{position:absolute;bottom:calc(13px + env(safe-area-inset-bottom));left:13px;right:13px;display:flex;justify-content:space-between;gap:8px;align-items:center}
#buffs{font-weight:950;font-size:11px;letter-spacing:.4px;text-shadow:0 2px #02071d;white-space:nowrap}
#coins{padding:7px 11px;background:#0e1f42dc;border:1px solid #dbb769a3;border-radius:9px;font-weight:1000;font-size:13px;color:#ffe59b}
#toast{position:absolute;top:32%;left:50%;transform:translate(-50%,-50%) scale(.9);z-index:5;opacity:0;pointer-events:none;white-space:nowrap;color:#fff;font-weight:1000;font-size:25px;text-align:center;text-shadow:0 3px 0 #162c60,0 0 24px #57e6ff94;transition:opacity .14s,transform .14s}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#overlay{position:absolute;inset:0;z-index:10;background:linear-gradient(145deg,#071024db,#080d2bdc);display:flex;justify-content:center;align-items:center;padding:18px;backdrop-filter:blur(6px)}
#overlay.hide{display:none}
.panel{width:100%;max-width:378px;max-height:98%;overflow-y:auto;text-align:center;border-radius:26px;border:1px solid #79c6ff91;background:linear-gradient(155deg,#102956,#12163b 70%);box-shadow:0 0 0 5px #9fdbff13,0 18px 65px #000b,inset 0 1px #dcf3ff3b;padding:22px 20px 20px}
.kicker{font-size:10px;letter-spacing:3px;font-weight:1000;color:#8ef6ff;margin:0 0 11px}
.logo{font-family:Impact,Haettenschweiler,"Arial Black",system-ui,sans-serif;font-size:clamp(52px,14vw,72px);letter-spacing:1px;line-height:.9;font-weight:1000;color:#fef8dc;text-shadow:0 5px #2b83b7,0 9px #173e78,0 0 33px #53dfff6b;transform:skew(-5deg);margin:10px 0}
.logo span{color:#ff8b72;text-shadow:0 5px #a74668,0 9px #4e346d}
.subtitle{font-size:14px;line-height:1.55;color:#c3d3f3;margin:15px 0}
.shipArt{margin:9px auto 16px;font-size:68px;filter:drop-shadow(0 8px 9px #0008);animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px)}}
.btn{width:100%;border:0;display:block;margin:10px 0 0;border-radius:13px;background:linear-gradient(90deg,#55d9f5,#719dff);padding:14px 12px;box-shadow:0 5px #1b557f;color:#061c3a;font-size:17px;font-weight:1000;cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 2px #1b557f}
.btn.alt{background:#1e335c;color:#e0efff;border:1px solid #6493cb8c;box-shadow:0 4px #0b1633;font-size:13px}
.btn.gold{background:linear-gradient(90deg,#fff0a6,#ffb96b);box-shadow:0 5px #ab743f;color:#4d2a36;font-size:14px}
.btn:disabled{opacity:.44;filter:grayscale(1);cursor:not-allowed}
.stats{display:flex;gap:7px;margin:14px 0 10px}
.stats>div{flex:1;min-width:0;padding:10px 5px;background:#071a3c;border:1px solid #79c6ff52;border-radius:13px}
.stats b{display:block;font-size:23px;color:#fff8cf;font-variant-numeric:tabular-nums}
.stats small{display:block;font-size:9px;letter-spacing:1px;color:#9bc8e8;margin-top:2px;font-weight:950}
.note{font-size:11px;color:#9db1d5;line-height:1.45;margin:10px 0 0}
.stagegrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:13px 0}
.stagebtn{background:#162c58;border:1px solid #4b77aa;border-radius:11px;color:white;font-size:18px;font-weight:1000;padding:12px 3px;min-height:60px;cursor:pointer}
.stagebtn small{display:block;color:#95acdd;font-size:9px;margin-top:3px}
.stagebtn:disabled{opacity:.3}
.stagebtn.boss{border-color:#e77b95;color:#ffbccc}
.store{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:13px 0}
.storebutton{border:1px solid #5c97c8;border-radius:14px;background:#13294c;color:#fff;padding:10px 6px;min-height:92px;cursor:pointer;font-size:13px;font-weight:950}
.storebutton b{display:block;font-size:24px;margin:2px}
.storebutton small{display:block;margin:4px;color:#c5cde8}
.storebutton:disabled{opacity:.38}
.legend{font-size:11px;color:#bedafa;line-height:1.9;background:#071a3c;border:1px solid #3b6189;border-radius:12px;padding:10px 6px}
@media(max-height:635px){.panel{padding:13px 16px}.logo{font-size:48px}.shipArt{font-size:43px;margin:3px auto}.stats{margin:8px 0}.btn{padding:11px;margin:7px 0}.subtitle{margin:7px 0;font-size:12px}.storebutton{min-height:70px}.note{margin:6px 0}.stagebtn{min-height:47px}}
@media(prefers-reduced-motion:reduce){.shipArt{animation:none}#toast{transition:none}}
</style></head>
<body>
<div id="shell"><canvas id="game" aria-label="Jet Kaos 2D uzay savaşı"></canvas>
<div id="hud"><div id="top">
 <div class="pill"><small>BÖLÜM</small><span id="wave">1 / 12</span></div>
 <div class="pill"><small>SKOR</small><span id="score">0</span></div>
 <div class="pill health"><small>ZIRH</small><span id="hp">♥♥♥♥</span></div>
 <button class="ctrl" id="pause" aria-label="Duraklat">Ⅱ</button>
 <button class="ctrl" id="sound" aria-label="Sesi aç veya kapat">♫</button>
</div>
<div id="zone"><span id="stage">SEKTÖR 1</span><span id="status">DALGA 1</span></div>
<div id="bossHud"><div id="bossName"><span id="bossText">BOSS</span><span id="bossPercent">100%</span></div><div id="bossOuter"><div id="bossInner"></div></div></div>
<div id="bottom"><span id="buffs">⚡ LAZER SEVİYE 1</span><span id="coins">🟡 <span id="wallet">0</span> JETON</span></div>
</div>
<div id="toast"></div><div id="overlay"></div></div>
<script>
(()=>{
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),$=id=>document.getElementById(id),W=420,H=760;
canvas.width=840;canvas.height=1520;ctx.setTransform(2,0,0,2,0,0);
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),d2=(x,y,a,b)=>Math.hypot(x-a,y-b);
const ZONES=[{name:"NEON YÖRÜNGE",a:"#050e29",b:"#163c6a",c:"#62deff",planet:"#2ba1c6",boss:"ÇELİK ARI"},
 {name:"KIZIL NEBULA",a:"#1f0d2d",b:"#6a244f",c:"#ff7c99",planet:"#d46a8c",boss:"NEBULA YILANI"},
 {name:"YILDIZ ŞEHRİ",a:"#08192a",b:"#24435e",c:"#f7d478",planet:"#f0ab56",boss:"DEMİR KOLOSS"},
 {name:"KARANLIK BOŞLUK",a:"#090a29",b:"#332456",c:"#bca4ff",planet:"#7050b3",boss:"OMEGA MUHAFIZ"}];
const SAVE="jet-kaos-v1";
let save={best:0,unlocked:1,wallet:0,plays:0,sound:true,cleared:false};
try{save=Object.assign(save,JSON.parse(localStorage.getItem(SAVE)||"{}"))}catch(_){}
function persist(){try{localStorage.setItem(SAVE,JSON.stringify(save))}catch(_){}}
const stars=Array.from({length:90},(_,i)=>({x:rand(0,W),y:rand(0,H),s:rand(.5,2.5),v:rand(18,105),a:rand(.15,.9),tw:i*.83}));
let state="menu",stage=1,score=0,wallet=save.wallet,time=0,spawnLeft=0,spawnDelay=0,stageClock=0,kills=0,combo=0,stageKind="normal";
let ship={x:210,y:624,tx:210,ty:624,hp:4,maxHp:4,weapon:1,shield:0,inv:0,power:0,magnet:false,shots:0,cooldown:0,tilt:0};
let bullets=[],enemyBullets=[],enemies=[],pickups=[],parts=[],texts=[],boss=null,prev=performance.now(),screenShake=0,flash=0,touch=null,key={},endless=false,audio=null;
let toastTimer=0,stageEarned=0,lastResult="",pauseFrom="play";
function rect(x,y,w,h,r,fill){ctx.fillStyle=fill;round(x,y,w,h,r);ctx.fill()}
function round(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y,r);ctx.arcTo(x,y+h,x,y,r);ctx.closePath()}
function circle(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function oval(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function text(s,x,y,size,color="#fff",align="center",weight=900){ctx.font=weight+" "+size+"px system-ui";ctx.textAlign=align;ctx.textBaseline="middle";ctx.fillStyle=color;ctx.fillText(s,x,y)}
function grad(x,y,r,c1,c2){let gr=ctx.createRadialGradient(x-r*.24,y-r*.31,0,x,y,r);gr.addColorStop(0,c1);gr.addColorStop(1,c2);return gr}
function sfx(id){if(!save.sound)return;try{
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audio)audio=new AC();if(audio.state==="suspended")audio.resume();
 const base={shoot:610,hit:170,coin:940,bomb:110,up:580,win:800,lose:110,select:460,boss:200}[id]||500;
 const now=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();
 o.type=id==="bomb"||id==="lose"?"sawtooth":id==="shoot"?"triangle":"sine";
 o.frequency.setValueAtTime(base,now);o.frequency.exponentialRampToValueAtTime(id==="hit"?74:id==="bomb"?35:base*(id==="shoot"?.78:1.5),now+.12);
 g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(id==="shoot"?.013:.055,now+.011);g.gain.exponentialRampToValueAtTime(.0001,now+.15);
 o.connect(g);g.connect(audio.destination);o.start(now);o.stop(now+.16);
 }catch(_){}}
function message(s,color="#fff"){const el=$("toast");el.textContent=s;el.style.color=color;el.classList.add("on");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("on"),900);}
function burst(x,y,color,n=16,scale=1){for(let i=0;i<n;i++){let a=rand(0,Math.PI*2),v=rand(35,235)*scale,l=rand(.24,.9);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:l,max:l,color,size:rand(2,6),shape:Math.random()<.5?0:1});}if(parts.length>330)parts.splice(0,parts.length-330);}
function floater(s,x,y,color="#fff"){texts.push({s,x,y,life:1.05,color});}
function zone(){return ZONES[Math.floor((stage-1)/3)%4]}
function hud(){
 $("wave").textContent=endless?stage+" ∞":stage+" / 12";$("score").textContent=score.toLocaleString("tr-TR");
 $("hp").textContent="♥".repeat(Math.max(0,ship.hp))+"♡".repeat(Math.max(0,ship.maxHp-ship.hp));
 $("hp").style.color=ship.hp<=1?"#ff536d":"#ff8b99";
 $("stage").textContent=zone().name;$("status").textContent=boss?"BOSS SAVAŞI":"DÜŞMANLAR "+kills+"/"+stageQuota();
 $("buffs").textContent="⚡ LAZER "+ship.weapon+(ship.shield>0?"  🛡 "+ship.shield:"")+(ship.power>0?"  🔥 "+Math.ceil(ship.power)+"sn":"");
 $("wallet").textContent=wallet;$("sound").textContent=save.sound?"♫":"♪̸";
 const bh=$("bossHud");bh.style.display=boss?"block":"none";
 if(boss){$("bossText").textContent=boss.name;$("bossPercent").textContent=Math.round(Math.max(0,boss.hp/boss.maxHp)*100)+"%";$("bossInner").style.width=Math.max(0,boss.hp/boss.maxHp*100)+"%";}
}
function stageQuota(){return 10+Math.min(25,stage*2)}
function spawnCount(){return 12+Math.min(24,stage*2)}
function startStage(n,isEndless=false,preserve=false){
 stage=n;endless=isEndless;stageKind="normal";stageClock=0;time=0;
 spawnLeft=spawnCount();spawnDelay=.9;kills=0;boss=null;enemies=[];bullets=[];enemyBullets=[];pickups=[];parts=[];texts=[];flash=0;screenShake=0;stageEarned=0;touch=null;
 if(!preserve){ship={x:210,y:625,tx:210,ty:625,hp:4,maxHp:4,weapon:1,shield:0,inv:2.2,power:0,magnet:false,shots:0,cooldown:0,tilt:0};score=0;}
 else{ship.hp=Math.min(ship.maxHp,ship.hp+1);ship.inv=2;ship.x=ship.tx=210;ship.y=ship.ty=625;}
 state="play";$("hud").style.display="block";$("overlay").classList.add("hide");prev=performance.now();hud();message("BÖLÜM "+stage+" · "+zone().name,zone().c);sfx("select");
}
function newRun(n=1,inf=false){save.plays++;persist();startStage(n,inf,false)}
function initBoss(){
 stageKind="boss";let zi=Math.floor((stage-1)/3)%4;
 boss={x:210,y:156,t:0,phase:0,hp:70+Math.min(110,stage*12),maxHp:70+Math.min(110,stage*12),name:zone().boss,zone:zi,shoot:.8,burst:0};
 enemyBullets=[];message("⚠ DEV DÜŞMAN: "+boss.name,"#ffc0c9");sfx("boss");
}
function spawnEnemy(){
 const stageDifficulty=Math.min(7,Math.floor(stage/2));
 const v=Math.random(),x=rand(40,380);
 let kind=v<.32?"scout":v<.55?"zig":v<.76?"shooter":v<.94?"tank":"split";
 if(stage<2&&kind==="split")kind="scout";
 if(stage<3&&kind==="tank")kind="zig";
 const hp=kind==="tank"?4+Math.floor(stage/5):kind==="split"?3:kind==="shooter"?2:kind==="zig"?2:1;
 let radius=kind==="tank"?24:kind==="split"?22:kind==="shooter"?21:kind==="zig"?17:15;
 enemies.push({kind,x,y:-35,hp,maxHp:hp,r:radius,v:rand(110,170)+stageDifficulty*11,phase:rand(0,6.28),t:0,cool:rand(.7,1.6),startX:x,active:true});
}
function fireEnemy(x,y,vx,vy,r=5,color="#ff7b92"){if(enemyBullets.length>=150)return;enemyBullets.push({x,y,vx,vy,r,color,life:6});}
function aimed(x,y,speed=180){const dx=ship.x-x,dy=ship.y-y,len=Math.hypot(dx,dy)||1;fireEnemy(x,y,dx/len*speed,dy/len*speed,5,"#ff7da8");}
function hurt(){
 if(ship.inv>0||state!=="play")return;
 if(ship.shield>0){ship.shield--;ship.inv=1.3;burst(ship.x,ship.y,"#83ffdf",18,.7);message("KALKAN KURTARDI!","#9dffe2");sfx("hit");}
 else{ship.hp--;ship.inv=1.35;combo=0;flash=.36;screenShake=13;burst(ship.x,ship.y,"#ffc3ba",26,1);sfx("hit");if(navigator.vibrate)navigator.vibrate(45);if(ship.hp<=0){gameOver();return;}}
 hud();
}
function bulletHit(x,y,r){return ship.inv<=0&&d2(x,y,ship.x,ship.y)<r+17}
function killEnemy(e){
 const i=enemies.indexOf(e);if(i<0)return;
 enemies.splice(i,1);kills++;combo++;const add=(25+Math.min(combo,10)*5)*Math.max(1,Math.floor(stage/3)+1);score+=add;
 burst(e.x,e.y,e.kind==="tank"?"#ffb369":"#69dcff",e.kind==="tank"?29:15,e.kind==="tank"?1.4:.85);floater("+"+add,e.x,e.y-28,"#ffea95");sfx("bomb");
 const chance=Math.random();
 if(chance<.23)drop(e.x,e.y,"coin");
 else if(chance<.285)drop(e.x,e.y,Math.random()<.56?"shield":"heal");
 else if(chance<.34)drop(e.x,e.y,"power");
 if(e.kind==="split"&&Math.random()<.55){
  for(let n of [-1,1])enemies.push({kind:"scout",x:e.x+n*14,y:e.y,hp:1,maxHp:1,r:12,v:210,phase:Math.random()*6,t:0,cool:6,startX:e.x+n*14,active:true});
 }
 if(combo===10||combo===25)message("🔥 "+combo+" KOMBO!", "#ffe87f");
 hud();
}
function drop(x,y,type){pickups.push({x,y,type,t:0,vy:85+rand(0,40)});}
function pickup(p){
 const i=pickups.indexOf(p);if(i<0)return;pickups.splice(i,1);
 if(p.type==="coin"){wallet+=5;stageEarned+=5;message("+5 JETON","#ffe49a");}
 else if(p.type==="heal"){ship.hp=Math.min(ship.maxHp,ship.hp+1);message("❤ CAN YENİLENDİ","#93ffbb");}
 else if(p.type==="shield"){ship.shield=Math.min(3,ship.shield+1);message("🛡 KALKAN","#8cf0ff");}
 else if(p.type==="power"){ship.power=12;message("🔥 ÇİFT ATIŞ!","#ff9ce0");}
 score+=35;burst(p.x,p.y,p.type==="coin"?"#ffda68":"#8ffff1",22,.65);sfx("coin");persist();hud();
}
function shoot(){
 const tier=ship.weapon+(ship.power>0?1:0),ys=ship.y-20;
 bullets.push({x:ship.x,y:ys,vx:0,vy:-660,damage:1,r:5,c:"#89faff"});
 if(tier>=2){for(let a of [-1,1])bullets.push({x:ship.x+a*13,y:ys+7,vx:a*(tier>=4?110:55),vy:-650,damage:1,r:4,c:tier>=4?"#fff3a6":"#92e9ff"});}
 if(tier>=3){for(let a of [-1,1])bullets.push({x:ship.x+a*22,y:ys+11,vx:a*200,vy:-610,damage:1,r:4,c:"#ffbfe0"});}
 if(bullets.length>100)bullets.splice(0,bullets.length-100);
 if(ship.shots++%4===0)sfx("shoot");
}
function bossShoot(dt){
 if(!boss)return;const b=boss;b.t+=dt;b.x=210+Math.sin(b.t*.82)*121;b.y=153+Math.sin(b.t*1.65)*15;
 b.shoot-=dt;
 if(b.shoot<=0){
  b.phase++;
  if(b.phase%3===0){
   for(let i=0;i<9;i++){let angle=(i/9)*Math.PI*2+b.t*.2;fireEnemy(b.x,b.y+34,Math.cos(angle)*125,Math.sin(angle)*125+30,5,"#e4a0ff");}
  }else if(b.phase%3===1){
   for(let i=-2;i<=2;i++)fireEnemy(b.x+i*16,b.y+35,i*56,195+Math.abs(i)*10,5,"#ff8aa5");
  }else{
   aimed(b.x,b.y+38,185+Math.min(35,stage*4));
   fireEnemy(b.x-43,b.y+30,-90,188);fireEnemy(b.x+43,b.y+30,90,188);
  }
  b.shoot=Math.max(.62,1.25-stage*.037);
 }
}
function bossDefeated(){
 const b=boss;if(!b)return;
 burst(b.x,b.y,"#ffbf87",75,2);burst(b.x,b.y,"#8bfaff",55,1.6);
 screenShake=18;flash=.58;sfx("win");score+=1500+stage*200;
 boss=null;enemyBullets=[];enemies=[];stageClear();
}
function gameOver(){
 state="over";score=Math.max(0,Math.floor(score));save.best=Math.max(save.best,score);save.wallet=wallet;persist();
 render("over");
}
function stageClear(){
 if(state!=="play")return;
 state="clear";save.unlocked=Math.max(save.unlocked,Math.min(12,stage+1));
 if(stage===12&&!endless)save.cleared=true;
 const reward=25+stage*4;wallet+=reward;stageEarned+=reward;
 save.wallet=wallet;save.best=Math.max(save.best,score);persist();
 render("clear");
}

function update(dt){
 if(state!=="play")return;
 time+=dt;stageClock+=dt;
 // Mouse and keyboard steering
 let dx=(key.ArrowRight||key.KeyD?1:0)-(key.ArrowLeft||key.KeyA?1:0),dy=(key.ArrowDown||key.KeyS?1:0)-(key.ArrowUp||key.KeyW?1:0);
 if(dx||dy){const l=Math.hypot(dx,dy);ship.tx=clamp(ship.tx+dx/l*370*dt,25,395);ship.ty=clamp(ship.ty+dy/l*370*dt,144,702);}

  spawnDelay-=dt;

 }

  if(e.kind==="zig")e.x=e.startX+Math.sin(e.t*4+e.phase)*48;
  else if(e.kind==="shooter")e.x=e.startX+Math.sin(e.t*2+e.phase)*24;

  if(d2(e.x,e.y,ship.x,ship.y)<e.r+16){hurt();enemies.splice(i,1);burst(e.x,e.y,"#ff986e",15);continue;}
  if(e.y>810){enemies.splice(i,1);combo=0;}
 }

  }
  if(!hit){
   for(let j=enemies.length-1;j>=0;j--){

 }
 for(let i=enemyBullets.length-1;i>=0;i--){

 }

 for(let i=texts.length-1;i>=0;i--){const p=texts[i];p.y-=dt*40;p.life-=dt;if(p.life<=0)texts.splice(i,1);}

 ctx.shadowColor=cfg[0];ctx.shadowBlur=15;
 if(p.type==="coin"){
  circle(0,0,17,cfg[1]);circle(0,-2,15,cfg[0]);ctx.shadowBlur=0;ctx.strokeStyle="#fff4bd";ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-2,11,0,Math.PI*2);ctx.stroke();
 }else{
  polygon([[0,-20],[17,-7],[17,9],[0,20],[-17,9],[-17,-7]],cfg[1],cfg[0],2.5);ctx.shadowBlur=0;
  circle(0,0,13,cfg[0]);
 }
 text(cfg[2],0,-1,19,p.type==="coin"?"#8f5928":"#234269");
 rect(-29,24,58,15,5,"#0b2145cc");text(cfg[3],0,31,9,"#fff4d3");
 ctx.restore();
}
function laserArt(b,isEnemy=false){
 ctx.save();ctx.strokeStyle=b.c||b.color;ctx.lineWidth=b.r*1.2;ctx.lineCap="round";ctx.shadowColor=b.c||b.color;ctx.shadowBlur=14;
 ctx.beginPath();ctx.moveTo(b.x,b.y+(isEnemy?-13:15));ctx.lineTo(b.x,b.y+(isEnemy?9:-10));ctx.stroke();ctx.shadowBlur=0;
 ctx.strokeStyle="#ffffff";ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(b.x,b.y+(isEnemy?-7:7));ctx.lineTo(b.x,b.y+(isEnemy?5:-6));ctx.stroke();ctx.restore();
}
function draw(){
 ctx.save();if(screenShake>.2)ctx.translate(rand(-screenShake,screenShake),rand(-screenShake,screenShake));
 background();
 // debris and collectible labels
 for(const p of pickups)pickupArt(p);
 for(const e of enemies)enemyArt(e);
 if(boss)bossArt();
 for(const b of bullets)laserArt(b);
 for(const b of enemyBullets)laserArt(b,true);
 if(state!=="menu"&&state!=="choose")drawShip();
 for(const p of parts){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.atan2(p.vy,p.vx));rect(-p.size/2,-p.size/2,p.size*1.8,p.size,1,p.color);ctx.restore();}
 ctx.globalAlpha=1;
 for(const p of texts){ctx.globalAlpha=clamp(p.life,0,1);text(p.s,p.x,p.y,13,p.color);}
 ctx.globalAlpha=1;
 if(flash>0)rect(0,0,W,H,0,"rgba(255,180,170,"+(flash*.32)+")");
 ctx.restore();
}
function frame(now){let dt=Math.min(.035,Math.max(0,(now-prev)/1000));prev=now;
 if(state==="play")update(dt);else time+=dt*.2;
 draw();requestAnimationFrame(frame);}
window.addEventListener("blur",()=>{if(state==="play")pause()});
wallet=save.wallet;render("menu");requestAnimationFrame(frame);
})();
</script></body></html>

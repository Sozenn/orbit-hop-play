<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const COLORS=['#ff3b4e','#ff9a2e','#ffe14a','#8be04a','#16b25a','#2dd4bf','#38bdf8','#3b5bff','#8b5cf6','#ff5fc8','#a0622d','#e8edf5'];
const SYM=['●','▲','■','◆','★','♥','✚','⬟','✿','☾','⬢','✦'];
const CNAME=['kırmızı','turuncu','sarı','açık yeşil','yeşil','turkuaz','gök mavisi','mavi','mor','pembe','kahverengi','beyaz'];
const CHAPTERS=['Başlangıç','Renk Bahçesi','Gizem Laboratuvarı','Kurdele Atölyesi','Gökkuşağı Kulesi','Usta Çırağı','Renk Ustası','Efsane'];
const chapterName=n=>CHAPTERS[Math.min(Math.floor((n-1)/20),CHAPTERS.length-1)]+(n>140?' '+(Math.floor((n-141)/20)+2):'');
const THEMES=[
  {id:'gece',n:'Gece Mavisi',p:0,bg:'radial-gradient(ellipse at 50% 30%,#22306a 0%,#0d1530 60%,#070b1c 100%)',sw:['#22306a','#0d1530']},
  {id:'gunbatimi',n:'Gün Batımı',p:120,bg:'radial-gradient(ellipse at 50% 20%,#ff8a5c 0%,#b33a6b 45%,#3a1240 100%)',sw:['#ff8a5c','#3a1240']},
  {id:'orman',n:'Orman',p:120,bg:'radial-gradient(ellipse at 50% 30%,#2f7a4f 0%,#123a2a 60%,#071a12 100%)',sw:['#2f7a4f','#071a12']},
  {id:'seker',n:'Şeker',p:180,bg:'radial-gradient(ellipse at 50% 30%,#ffb3d9 0%,#c06ac9 55%,#5b2a86 100%)',sw:['#ffb3d9','#5b2a86']},
  {id:'uzay',n:'Uzay',p:250,bg:'radial-gradient(ellipse at 30% 20%,#3b2a7a 0%,#120a2e 55%,#02010a 100%)',sw:['#3b2a7a','#02010a']},
  {id:'deniz',n:'Okyanus',p:250,bg:'radial-gradient(ellipse at 50% 10%,#36c5e0 0%,#11628a 50%,#062a40 100%)',sw:['#36c5e0','#062a40']}
];
const BOTTLES=[
  {id:'tup',n:'Cam Tüp',p:0},{id:'lab',n:'Laboratuvar',p:150},{id:'iksir',n:'İksir Şişesi',p:220},{id:'kavanoz',n:'Kavanoz',p:300},{id:'kristal',n:'Kristal',p:400}
];

// ---------- save ----------
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
let save={lv:1,st:{},coins:100,snd:true,vib:true,cb:false,theme:'gece',bottle:'tup',own:['gece','tup'],daily:{last:'',streak:0},stats:{bottles:0,levels:0},seen:{}};
try{const s=JSON.parse(localStorage.getItem('oznurun_siseleri_v2'));if(s&&s.lv)save=Object.assign(save,s);}catch(e){}
const store=()=>{try{localStorage.setItem('oznurun_siseleri_v2',JSON.stringify(save));}catch(e){}};

// ---------- sound / haptic ----------
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f1,f2,dur,type,vol,delay){
  if(!save.snd)return;const a=ac();if(!a)return;const t=a.currentTime+(delay||0);
  const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f1,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.12,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.05);
}
const vib=ms=>{if(save.vib)try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}};
const SFX={
  pick:()=>tone(500,720,.08,'sine',.1),
  drop:()=>tone(700,500,.08,'sine',.08),
  err:()=>{tone(180,140,.14,'square',.05);vib(40);},
  pour:n=>{for(let i=0;i<n*4;i++)tone(260+Math.random()*520,0,.05,'sine',.03,.25+i*.07);},
  done:k=>{const b=[784,880,988,1047][Math.min(k,3)];[b,b*1.26,b*1.5].forEach((f,i)=>tone(f,0,.35,'triangle',.11,i*.07));vib(30);},
  win:()=>{[523,659,784,1047,1319].forEach((f,i)=>tone(f,0,.5,'triangle',.1,i*.1));vib([30,40,60]);},
  pop:()=>tone(900,1400,.08,'sine',.08),
  coin:()=>tone(1200,1800,.07,'square',.04),
  ribbon:()=>{tone(600,1200,.25,'sine',.1);tone(900,1800,.2,'triangle',.06,.1);}
};

// ---------- rng ----------
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// ---------- rules ----------
// tüp: [{c,h}], locks: tüp->renk (kurdele)
function topRun(t){if(!t.length)return 0;const c=t[t.length-1].c;let k=0;for(let i=t.length-1;i>=0&&t[i].c===c&&!t[i].h;i--)k++;return k;}
const isDone=(t,cap)=>t.length===cap&&t.every(l=>l.c===t[0].c&&!l.h);
function doneColors(T,cap){const s=new Set();for(const t of T)if(isDone(t,cap))s.add(t[0].c);return s;}
function lockedNow(T,cap,locks,i,dc){return locks[i]!=null&&!(dc||doneColors(T,cap)).has(locks[i]);}
function canPour(T,a,b,cap,locks){
  if(a===b)return 0;const A=T[a],B=T[b];if(!A.length||B.length>=cap)return 0;
  const dc=doneColors(T,cap);if(lockedNow(T,cap,locks,a,dc)||lockedNow(T,cap,locks,b,dc))return 0;
  const c=A[A.length-1].c;if(B.length&&B[B.length-1].c!==c)return 0;
  return Math.min(topRun(A),cap-B.length);
}

// ---------- solver ----------
function solve(T0,cap,locks,budget){
  const seen=new Set();let n=0;const path=[];
  const T=T0.map(t=>t.map(l=>({c:l.c,h:l.h})));
  const done=()=>T.every(t=>!t.length||isDone(t,cap));
  const run=t=>topRun(t);
  const key=()=>T.map((t,i)=>(locks[i]!=null?'L'+i:'')+t.map(l=>(l.h?'h':'')+l.c.toString(36)).join(',')).sort().join('|');
  function dfs(){
    if(done())return true;if(++n>budget)return false;
    const k=key();if(seen.has(k))return false;seen.add(k);
    const dc=doneColors(T,cap);const moves=[];
    for(let a=0;a<T.length;a++){const A=T[a];if(!A.length||lockedNow(T,cap,locks,a,dc))continue;const r=run(A);if(isDone(A,cap))continue;
      let triedEmpty=false;
      for(let b=0;b<T.length;b++){if(a===b)continue;const B=T[b];if(B.length>=cap||lockedNow(T,cap,locks,b,dc))continue;
        if(B.length&&B[B.length-1].c!==A[A.length-1].c)continue;
        if(!B.length){if(r===A.length||triedEmpty)continue;triedEmpty=true;}
        const amt=Math.min(r,cap-B.length);
        let sc=B.length?10+B.length:0;if(B.length&&run(B)===B.length)sc+=5;if(amt===r)sc+=3;if(A.length>r&&A[A.length-r-1].h)sc+=2;
        if(B.length+amt===cap&&run(B)===B.length)sc+=8;
        moves.push([sc,a,b,amt]);}
    }
    moves.sort((x,y)=>y[0]-x[0]);
    for(const [,a,b,amt] of moves){
      for(let i=0;i<amt;i++)T[b].push(T[a].pop());
      const A=T[a];let rev=false;if(A.length&&A[A.length-1].h){A[A.length-1].h=false;rev=true;}
      path.push([a,b]);
      if(dfs())return true;
      path.pop();if(rev)A[A.length-1].h=true;for(let i=0;i<amt;i++)T[a].push(T[b].pop());
      if(n>budget)return false;
    }
    return false;
  }
  return dfs()?path:null;
}

// ---------- levels ----------
function levelSpec(n){
  if(n===1)return {colors:2,cap:4,empty:1,mystery:false,ribbons:0};
  if(n===2)return {colors:3,cap:4,empty:2,mystery:false,ribbons:0};
  const colors=Math.min(3+Math.floor((n-2)/3),12);
  const cap=n>=12&&n%5===0?5:4;
  const mystery=n>=9&&n%4===1;
  const ribbons=n>=16&&n%3===0?(n>=45?2:1):0;
  return {colors,cap,empty:2,mystery,ribbons};
}
function build(sp,seed,minLen){
  for(let s=0;s<250;s++){
    const R=rng(seed+s*31);
    const pal=[...Array(12).keys()];for(let i=pal.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[pal[i],pal[j]]=[pal[j],pal[i]];}
    const cols=pal.slice(0,sp.colors);const deck=[];
    for(const c of cols)for(let k=0;k<sp.cap;k++)deck.push(c);
    for(let i=deck.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
    const T=[];for(let i=0;i<sp.colors;i++)T.push(deck.slice(i*sp.cap,(i+1)*sp.cap).map(c=>({c,h:false})));
    if(T.some(t=>isDone(t,sp.cap)))continue;
    if(sp.colors>3&&T.filter(t=>topRun(t)>=3).length>1)continue;
    for(let i=0;i<sp.empty;i++)T.push([]);
    if(sp.mystery)T.forEach(t=>t.forEach((l,i)=>{if(i<t.length-1)l.h=true;}));
    const locks={};
    if(sp.ribbons){

function outline(X,x,y,w,h,kind){

  if(kind==='lab'){const r=w*.18;X.moveTo(x-w*.06,y);X.lineTo(x+w*1.06,y);X.lineTo(x+w,y+w*.1);X.lineTo(x+w,y+h-r);X.quadraticCurveTo(x+w,y+h,x+w-r,y+h);X.lineTo(x+r,y+h);X.quadraticCurveTo(x,y+h,x,y+h-r);X.lineTo(x,y+w*.1);X.closePath();}
  else if(kind==='iksir'){const nk=w*.22,ny=h*.2;X.moveTo(x+nk-w*.05,y);X.lineTo(x+w-nk+w*.05,y);X.lineTo(x+w-nk,y+w*.12);X.lineTo(x+w-nk,y+ny);X.quadraticCurveTo(x+w,y+ny,x+w,y+ny+w*.35);X.lineTo(x+w,y+h-w*.45);X.quadraticCurveTo(x+w,y+h,x+w/2,y+h);X.quadraticCurveTo(x,y+h,x,y+h-w*.45);X.lineTo(x,y+ny+w*.35);X.quadraticCurveTo(x,y+ny,x+nk,y+ny);X.lineTo(x+nk,y+w*.12);X.closePath();}
  else if(kind==='kavanoz'){const r=w*.2;X.moveTo(x+w*.04,y);X.lineTo(x+w*.96,y);X.lineTo(x+w*.96,y+w*.14);X.quadraticCurveTo(x+w,y+w*.16,x+w,y+w*.3);X.lineTo(x+w,y+h-r);X.quadraticCurveTo(x+w,y+h,x+w-r,y+h);X.lineTo(x+r,y+h);X.quadraticCurveTo(x,y+h,x,y+h-r);X.lineTo(x,y+w*.3);X.quadraticCurveTo(x,y+w*.16,x+w*.04,y+w*.14);X.closePath();}
  else if(kind==='kristal'){X.moveTo(x-w*.08,y);X.lineTo(x+w*1.08,y);X.lineTo(x+w,y+w*.15);X.lineTo(x+w,y+h-w*.5);X.lineTo(x+w/2,y+h);X.lineTo(x,y+h-w*.5);X.lineTo(x,y+w*.15);X.closePath();}

function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;r=Math.min(255,Math.max(0,r*f));g=Math.min(255,Math.max(0,g*f));b=Math.min(255,Math.max(0,b*f));return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';}

// genel şişe çizimi (oyun + mağaza önizleme)
function drawBottle(X,w,h,unit,layers,time,kind,o){

}

function drawTube(i,x,y,ang,layers,time,o){

  drawBottle(ctx,tw,th,lh,layers,time,save.bottle,Object.assign({i},o));
  // kurdele
  if(o.lock!=null){
    const c=COLORS[o.lock],ry=th*.45;
    ctx.fillStyle=c;ctx.globalAlpha=.85;ctx.fillRect(-3,ry-tw*.07,tw+6,tw*.14);ctx.fillRect(tw/2-tw*.055,0,tw*.11,th*.98);ctx.globalAlpha=1;
    ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1;ctx.strokeRect(-3,ry-tw*.07,tw+6,tw*.14);
    // fiyonk

    for(const s of [-1,1]){ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(s*tw*.55,-tw*.45,s*tw*.5,0);ctx.quadraticCurveTo(s*tw*.55,tw*.45,0,0);ctx.fill();ctx.stroke();}

    ctx.restore();

    ctx.beginPath();const cx0=tw*(1-bw)/2;if(ctx.roundRect)ctx.roundRect(cx0,dy-tw*.22,tw*bw,tw*.36,4);else ctx.rect(cx0,dy-tw*.22,tw*bw,tw*.36);ctx.fill();ctx.stroke();
    ctx.fillStyle='rgba(0,0,0,.15)';ctx.fillRect(cx0,dy+tw*.04,tw*bw,tw*.06);
    if(k>=1){ctx.beginPath();ctx.arc(tw/2,dy-tw*.04,tw*.22,0,6.28);ctx.fillStyle='#22c55e';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(tw*.4,dy-tw*.05);ctx.lineTo(tw*.47,dy+tw*.03);ctx.lineTo(tw*.61,dy-tw*.13);ctx.stroke();}
  }
  ctx.restore();
}
const layersOf=t=>t.map(l=>({c:l.c,h:l.h,amt:1}));
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;

function draw(time){
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,VW,VH);
  for(let i=0;i<T.length;i++){const p=pos[i];if(!p)continue;ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(p.x+tw/2,p.y+th+8,tw*.7,6,0,0,6.28);ctx.fill();}
  let late=null;
  for(let i=0;i<T.length;i++){
    const p=pos[i];if(!p)continue;let x=p.x,y=p.y,ang=0;let L=layersOf(T[i]);
    if(shake[i]>0)x+=Math.sin(shake[i]*50)*5;
    if(i===sel)y-=22;
    const lockOn=isLocked(i);
    let o={done:doneSet.has(i),cork:corks[i],lock:lockOn?locks[i]:null};
    if(hintShow&&i===hintShow.a)o.glow='#ffd23a';
    if(hintShow&&i===hintShow.b)o.glow='rgba(255,210,58,.6)';
    if(i===sel)o.glow='#ffffff';
    if(lockOn){ctx.globalAlpha=.85;}
    if(anim){
      const A=anim;
      if(i===A.a){
        const pb=pos[A.b],side=pb.x>p.x?-1:1;
        const tx=pb.x+side*tw*.55,ty=pb.y-th*.55;
        let k,a2,flow=0;
        if(A.t<A.p1){k=ease(A.t/A.p1);a2=k;}
        else if(A.t<A.p2){k=1;a2=1;flow=(A.t-A.p1)/(A.p2-A.p1);}
        else{k=1-ease((A.t-A.p2)/(A.dur-A.p2));a2=k;flow=1;}
        const sy=A.t<A.p2?p.y-22:p.y;
        x=p.x+(tx-p.x)*k;y=sy+(ty-sy)*k;ang=-side*a2*1.15;
        let rem=A.amt*flow;for(let j=L.length-1;j>=0&&rem>0;j--){const d=Math.min(L[j].amt,rem);L[j].amt-=d;rem-=d;}
        L=L.filter(l=>l.amt>.001);
        late={i,x,y,ang,L,o:{noBubbles:true},flowing:A.t>=A.p1&&A.t<A.p2,side};
        ctx.globalAlpha=1;continue;
      }
      if(i===A.b){const flow=A.t<A.p1?0:A.t<A.p2?(A.t-A.p1)/(A.p2-A.p1):1;if(flow>0)L.push({c:A.c,h:false,amt:A.amt*flow});}
    }
    drawTube(i,x,y,ang,L,time,o);ctx.globalAlpha=1;
  }
  // kurdele uçuşu
  for(const f of ribbonFx){const p=pos[f.i];if(!p)continue;const k=f.t;ctx.save();ctx.globalAlpha=Math.max(0,1-k);ctx.translate(p.x+tw/2+k*60,p.y+th*.45-k*120);ctx.rotate(k*6);ctx.fillStyle=COLORS[f.c];
    for(const s of [-1,1]){ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(s*tw*.55,-tw*.45,s*tw*.5,0);ctx.quadraticCurveTo(s*tw*.55,tw*.45,0,0);ctx.fill();}ctx.restore();}
  if(late){
    drawTube(late.i,late.x,late.y,late.ang,late.L,time,late.o);
    if(late.flowing){
      const A=anim,pb=pos[A.b];
      const lipX=late.side<0?tw*1.1:-tw*.1;
      const cxp=late.x+tw/2,cyp=late.y;const ax=cxp+Math.cos(late.ang)*(lipX-tw/2),ay=cyp+Math.sin(late.ang)*(lipX-tw/2);
      const fl=(A.t-A.p1)/(A.p2-A.p1);const surf=pb.y+th-(T[A.b].length+A.amt*fl)*lh;
      const col=COLORS[A.c];
      ctx.strokeStyle=col;ctx.lineWidth=Math.max(4,tw*.15);ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(ax,ay);ctx.quadraticCurveTo(pb.x+tw/2,ay,pb.x+tw/2+Math.sin(time*30)*1.2,surf);ctx.stroke();
      ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;ctx.stroke();
      if(Math.random()<.6)splash.push({x:pb.x+tw/2,y:surf,vx:(Math.random()-.5)*90,vy:-60-Math.random()*90,c:col,life:.35});
    }
  }
  for(const s of splash){ctx.globalAlpha=Math.max(0,s.life*2.5);ctx.fillStyle=s.c;ctx.beginPath();ctx.arc(s.x,s.y,2.6,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  if(hintShow){const pa=pos[hintShow.a],pb=pos[hintShow.b];const bob=Math.sin(time*6)*6;drawArrow(pa.x+tw/2,pa.y-42+bob,'#ffd23a');drawArrow(pb.x+tw/2,pb.y-42+bob,'rgba(255,210,58,.7)',true);}
  if(tutorial&&!anim&&tutMove&&tutMove.length){const t=tutorial===1?tutMove[0][0]:tutMove[0][1];const p=pos[t];const bob=Math.sin(time*5)*8;
    ctx.font=Math.round(tw*.9)+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('👆',p.x+tw/2,p.y+th+tw*.7+bob);}
  for(const q of parts){ctx.globalAlpha=Math.max(0,Math.min(1,q.life));ctx.fillStyle=q.c;ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.r);ctx.fillRect(-4,-2,8,4);ctx.restore();}
  ctx.globalAlpha=1;
  for(const f of floats){ctx.globalAlpha=Math.min(1,f.life*1.5);ctx.font='900 '+Math.round(Math.max(16,tw*.42))+'px system-ui';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(f.t,f.x,f.y);ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y);}
  ctx.globalAlpha=1;
}
function drawArrow(x,y,col,hollow){ctx.beginPath();ctx.moveTo(x-12,y-14);ctx.lineTo(x+12,y-14);ctx.lineTo(x+12,y);ctx.lineTo(x+20,y);ctx.lineTo(x,y+18);ctx.lineTo(x-20,y);ctx.lineTo(x-12,y);ctx.closePath();
  if(hollow){ctx.strokeStyle=col;ctx.lineWidth=3;ctx.stroke();}else{ctx.fillStyle=col;ctx.fill();ctx.strokeStyle='#7a5a00';ctx.lineWidth=2;ctx.stroke();}}

let last=0;
function loop(t){
  const dt=Math.min(.05,(t-last)/1000||0);last=t;const time=t/1000;
  if(anim){anim.t+=dt;if(anim.t>=anim.dur)finishPour();}
  for(const k in shake){shake[k]-=dt;if(shake[k]<=0)delete shake[k];}
  for(const k in corks)corks[k]+=dt;
  for(let i=ribbonFx.length-1;i>=0;i--){ribbonFx[i].t+=dt*1.2;if(ribbonFx[i].t>1)ribbonFx.splice(i,1);}
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=500*dt;q.r+=dt*8;if(q.life<=0)parts.splice(i,1);}
  for(let i=splash.length-1;i>=0;i--){const q=splash[i];q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=600*dt;if(q.life<=0)splash.splice(i,1);}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.life-=dt;f.y-=30*dt;if(f.life<=0)floats.splice(i,1);}
  if(spec&&!won&&performance.now()>statusUntil){const s='Tamamlanan şişe:&nbsp;<b>'+doneSet.size+'&nbsp;/&nbsp;'+spec.colors+'</b>';if($('status').dataset.s!==s){$('status').dataset.s=s;$('status').innerHTML=s;$('status').className='';}}
  if(T.length)draw(time);
  requestAnimationFrame(loop);
}

// ---------- intro (yeni mekanik) ----------
const INTRO={
  mystery:{tag:'GİZEMLİ ŞİŞELER',col:'#8b5cf6',t:'Gizli Renkler',x:'Alttaki renkler "?" ile gizli. Üstteki rengi başka şişeye döktüğünde altındaki renk ortaya çıkar.',ex:[[{c:0,h:0},{c:3,h:1},{c:7,h:1}].reverse(),[{c:5,h:0},{c:1,h:1}].reverse()]},
  long:{tag:'UZUN ŞİŞELER',col:'#ff9a2e',t:'5 Katlı Şişeler',x:'Bu bölümde şişeler 5 katlı. Bir şişenin tamamlanması için aynı renkten 5 kat gerekir.',ex:[[{c:2},{c:2},{c:2},{c:2}],[{c:2},{c:9}]],cap:5},
  ribbon:{tag:'KURDELELİ ŞİŞE',col:'#ff5fc8',t:'Kurdele',x:'Kurdeleli şişeye dokunamazsın. Kurdele hangi renkteyse, o rengin şişesini tamamla; kurdele çözülür ve şişe açılır.',ex:[[{c:4},{c:4},{c:4}],[{c:1},{c:6},{c:3}]],lock:4}
};
let introAnim=null;
function showIntro(k){
  const d=INTRO[k];$('inTag').textContent='YENİ: '+d.tag;$('inTag').style.background=d.col;$('inTitle').textContent=d.t;$('inText').textContent=d.x;
  $('intro').classList.remove('hide');introAnim=d;
}
function drawIntro(time){
  if(!introAnim||$('intro').classList.contains('hide'))return;
  const X=$('inCv').getContext('2d');X.setTransform(2,0,0,2,0,0);X.clearRect(0,0,220,170);
  const d=introAnim,c=d.cap||4,w=38,u=26,h=u*c+w*.55;
  d.ex.forEach((ls,j)=>{X.save();X.translate(55+j*80,(170-h)/2+4);
    drawBottle(X,w,h,u,ls.map(l=>({c:l.c,h:!!l.h&&!(Math.floor(time)%3===2&&j===0),amt:1})),time,save.bottle,{i:j});
    if(d.lock!=null&&j===1){const cc=COLORS[d.lock];X.fillStyle=cc;X.fillRect(-2,h*.45-3,w+4,7);X.fillRect(w/2-3,0,7,h);X.beginPath();X.arc(w/2,h*.45,7,0,6.28);X.fill();X.font='14px system-ui';X.textAlign='center';X.fillText('🔒',w/2,h+14);}
    X.restore();});
}
$('inOk').onclick=()=>{$('intro').classList.add('hide');introAnim=null;};

// ---------- screens ----------
const OVS=['menu','lvs','win','pause','shop','settings'];
const hideAll=()=>OVS.forEach(i=>$(i).classList.add('hide'));
let ret='menu';
function menu(){hideAll();renderMenu();$('menu').classList.remove('hide');}
function renderMenu(){
  $('playLv').textContent='Bölüm '+save.lv;
  const done=save.daily.last===today();
  $('dailyInfo').textContent=done?'✓ 🔥'+save.daily.streak:(save.daily.streak?'🔥'+save.daily.streak:'');
  const tot=Object.values(save.st).reduce((a,b)=>a+b,0);
  $('menuStats').innerHTML='⭐ '+tot+' yıldız &nbsp;•&nbsp; 🧪 '+save.stats.bottles+' şişe &nbsp;•&nbsp; 💧 '+save.coins;
}
function levels(){
  hideAll();const wrap=$('lvWrap');wrap.innerHTML='';
  const maxN=Math.ceil(Math.max(save.lv,1)/20)*20;
  for(let ch=0;ch<maxN/20;ch++){
    const div=document.createElement('div');div.className='chap';
    let got=0;for(let i=ch*20+1;i<=ch*20+20;i++)got+=save.st[i]||0;
    div.innerHTML='<h3>'+(ch+1)+'. '+chapterName(ch*20+1).toUpperCase()+'<span>★ '+got+'/60</span></h3>';
    const g=document.createElement('div');g.className='lvGrid';
    for(let i=ch*20+1;i<=ch*20+20;i++){const b=document.createElement('button');const lock=i>save.lv,s=save.st[i]||0;
      b.className='lv'+(i===save.lv?' cur':'')+(lock?' lock':'');
      b.innerHTML=(lock?'🔒':i)+'<small>'+(s?'★'.repeat(s):'')+'</small>';if(!lock)b.onclick=()=>start(i);g.appendChild(b);}
    div.appendChild(g);wrap.appendChild(div);
  }
  $('lvs').classList.remove('hide');
  setTimeout(()=>{const c=wrap.querySelector('.cur');if(c)c.scrollIntoView({block:'center'});},0);
}
let shopTab='b';
function shop(from){
  ret=from||ret;hideAll();$('shopCoins').textContent=save.coins;
  $('tabB').classList.toggle('on',shopTab==='b');$('tabT').classList.toggle('on',shopTab==='t');
  const g=$('shopGrid');g.innerHTML='';
  const list=shopTab==='b'?BOTTLES:THEMES;
  for(const it of list){
    const d=document.createElement('div');const owned=save.own.includes(it.id),on=shopTab==='b'?save.bottle===it.id:save.theme===it.id;
    d.className='item'+(on?' on':'');
    const c=document.createElement('canvas');c.width=240;c.height=220;const X=c.getContext('2d');X.scale(2,2);
    if(shopTab==='b'){const kind=it.id;const w=kind==='kavanoz'?44:36,u=17,h=u*4+w*.55;
      [[0,2,9,6],[5,5,1]].forEach((ls,j)=>{X.save();X.translate(22+j*52,(110-h)/2);drawBottle(X,w,h,u,ls.map(c=>({c,amt:1})),0,kind,{i:j,noBubbles:true});X.restore();});}
    else{const gr=X.createLinearGradient(0,0,0,110);gr.addColorStop(0,it.sw[0]);gr.addColorStop(1,it.sw[1]);X.fillStyle=gr;X.fillRect(0,0,120,110);
      X.save();X.translate(42,18);drawBottle(X,36,80,17,[{c:0,amt:1},{c:2,amt:1},{c:6,amt:1}],0,save.bottle,{noBubbles:true});X.restore();}
    d.appendChild(c);
    const nm=document.createElement('b');nm.textContent=it.n;d.appendChild(nm);
    const pr=document.createElement('span');pr.textContent=on?'✓ Kullanılıyor':owned?'Seç':'💧 '+it.p;d.appendChild(pr);
    d.onclick=()=>{
      if(!owned){if(save.coins<it.p){SFX.err();pr.textContent='Yetersiz damla';return;}save.coins-=it.p;save.own.push(it.id);SFX.win();}
      if(shopTab==='b')save.bottle=it.id;else{save.theme=it.id;applyTheme();}
      store();layout();shop();updUI();SFX.pick();
    };
    g.appendChild(d);
  }
  $('shop').classList.remove('hide');
}
function applyTheme(){const th=THEMES.find(t=>t.id===save.theme)||THEMES[0];document.body.style.background=th.bg;}
function settings(from){ret=from||ret;hideAll();$('sSnd').classList.toggle('on',save.snd);$('sVib').classList.toggle('on',save.vib);$('sCb').classList.toggle('on',save.cb);$('settings').classList.remove('hide');}
const back=()=>{hideAll();if(ret==='menu')menu();else if(ret==='pause')$('pause').classList.remove('hide');};
$('sSnd').onclick=()=>{save.snd=!save.snd;store();settings();SFX.pick();};
$('sVib').onclick=()=>{save.vib=!save.vib;store();settings();vib(30);};
$('sCb').onclick=()=>{save.cb=!save.cb;store();settings();};
$('setBack').onclick=back;$('shopBack').onclick=back;
$('tabB').onclick=()=>{shopTab='b';shop();};$('tabT').onclick=()=>{shopTab='t';shop();};
$('play').onclick=()=>{ac();start(save.lv);};
$('daily').onclick=()=>{ac();start(0,true);};
$('toLv').onclick=levels;$('toShop').onclick=()=>shop('menu');$('toSet').onclick=()=>settings('menu');
$('bMenu').onclick=()=>{if(anim)return;hideAll();$('pause').classList.remove('hide');};
$('coinBtn').onclick=()=>{if(anim)return;shop(T.length?'pause':'menu');};
$('pResume').onclick=hideAll;$('pLevels').onclick=levels;$('pShop').onclick=()=>shop('pause');$('pSet').onclick=()=>settings('pause');$('pMenu').onclick=menu;
$('lvBack').onclick=()=>{hideAll();if(!T.length||won)menu();};
$('wNext').onclick=()=>start(lvl+1);$('wRe').onclick=()=>{if(mode==='daily')menu();else start(lvl);};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&AC)AC.suspend();});

// logo
const L1="ÖZNUR'UN",L2='ŞİŞELERİ';
$('logo').innerHTML=[...L1].map((ch,i)=>'<span style="color:'+COLORS[i%12]+';animation-delay:'+(i*.12)+'s">'+ch+'</span>').join('')+'<br>'+[...L2].map((ch,i)=>'<span style="color:'+COLORS[[9,8,7,6,5,4,1,0][i]]+';animation-delay:'+(i*.12+.5)+'s">'+ch+'</span>').join('');

applyTheme();
// menü arkasında oynanan bölüm görünsün
start(save.lv,false,true);menu();updUI();
function frame(t){drawIntro(t/1000);requestAnimationFrame(frame);}requestAnimationFrame(frame);
window.__rd={start,get T(){return T},get won(){return won},solve:()=>solve(T,cap,locks,200000),pour:(a,b)=>{const amt=canPour(T,a,b,cap,locks);if(amt)pour(a,b,amt);return amt;},get anim(){return !!anim},levelSpec,makeLevel,makeDaily,get save(){return save}};
requestAnimationFrame(loop);
})();
</script>

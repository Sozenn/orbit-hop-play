<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b2f3a">
<title>Bilye Atölyesi</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#2b2f3a;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
canvas#c{display:block;position:fixed;inset:0;width:100%;height:100%}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:calc(env(safe-area-inset-left,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:2}
.pill{background:rgba(20,22,30,.55);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:8px 14px 9px;font-weight:800;font-size:16px;letter-spacing:.3px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);min-width:120px}
.bar{height:6px;background:rgba(255,255,255,.15);border-radius:4px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7be35a,#c6ff6b);border-radius:4px;transition:width .3s}
.btns{display:flex;gap:10px}
.btn{pointer-events:auto;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(20,22,30,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.btn svg{width:22px;height:22px;fill:#fff}
.btn:active{transform:scale(.92)}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(14,16,22,.62);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);z-index:5;transition:opacity .25s}
.ov.hide{opacity:0;pointer-events:none}
.card{width:min(88vw,380px);background:linear-gradient(180deg,rgba(60,66,80,.95),rgba(36,40,50,.95));border:1px solid rgba(255,255,255,.12);border-radius:26px;padding:24px 22px 20px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
h1{margin:0 0 6px;font-size:40px;line-height:1;font-weight:900;letter-spacing:-.5px;background:linear-gradient(180deg,#fff,#c9d4e4);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin:0 0 8px;font-size:28px;font-weight:900}
.sub{opacity:.7;font-size:14px;margin:0 0 12px}
.how{font-size:14px;line-height:1.45;opacity:.85;margin:10px 0 16px}
canvas#show{width:100%;height:auto;aspect-ratio:2/1;display:block;margin:4px 0}
.big{width:100%;border:0;border-radius:16px;padding:16px;font-size:20px;font-weight:800;color:#fff;background:linear-gradient(180deg,#76c94a,#4c9a2a);box-shadow:0 5px 0 #2f6b18,0 10px 24px rgba(0,0,0,.35);cursor:pointer;font-family:inherit}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #2f6b18}
.ghost{width:100%;margin-top:12px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#fff;border-radius:14px;padding:13px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.ver{font-size:11px;opacity:.4;margin-top:12px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud">
  <div class="pill"><span id="lvl">Seviye 1</span><div class="bar"><i id="prog"></i></div></div>
  <div class="btns">
    <button class="btn" id="bSound" aria-label="Ses"><svg viewBox="0 0 24 24" id="icoSound"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button>
    <button class="btn" id="bPause" aria-label="Duraklat"><svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg></button>
  </div>
</div>

<div class="ov" id="menu"><div class="card">
  <h1>Bilye<br>Atölyesi</h1>
  <p class="sub">Her bilye kendi maddesinden</p>
  <canvas id="show" width="600" height="300"></canvas>
  <p class="how">Bir kuleye dokun: en üstteki tepsi huniye dökülür.<br>Bant bilyeleri aynı renkteki kutulara taşır.<br><b>Bant dolup tıkanmasın!</b></p>
  <button class="big" id="bPlay">Oyna</button>
  <div class="ver">v1.0</div>
</div></div>

<div class="ov hide" id="pauseO"><div class="card">
  <h2>Duraklatıldı</h2>
  <button class="big" id="bResume">Devam et</button>
  <button class="ghost" id="bRestart">Seviyeyi yeniden başlat</button>
  <button class="ghost" id="bMenu">Ana menü</button>
</div></div>

<div class="ov hide" id="endO"><div class="card">
  <h2 id="endT"></h2>
  <p class="how" id="endP"></p>
  <button class="big" id="endB"></button>
  <button class="ghost" id="endR">Tekrar oyna</button>
</div></div>

<script>
'use strict';
// ================= Sabitler =================
const W = 720, H = 1280, R = 19, D = R * 2;
const G = 2100;
const MATS = {
  jelly:  {name:'Jöle',   c:'#5fe04a', c2:'#258a1c', rest:.12, fric:.10,  mass:.8,  T:.46, Hh:80},
  metal:  {name:'Çelik',  c:'#9ba7b4', c2:'#47505b', rest:.16, fric:.05,  mass:3,   T:.22, Hh:18},
  glass:  {name:'Cam',    c:'#41b2ff', c2:'#1559b0', rest:.5,  fric:.02,  mass:1.2, T:.38, Hh:70},
  lava:   {name:'Lav',    c:'#ff5a1a', c2:'#8a1d05', rest:.2,  fric:.07,  mass:1.6, T:.42, Hh:45},
  wood:   {name:'Ahşap',  c:'#c27c40', c2:'#6b3a14', rest:.34, fric:.08,  mass:.9,  T:.40, Hh:55},
  gold:   {name:'Altın',  c:'#ffc928', c2:'#a96b00', rest:.24, fric:.05,  mass:3.2, T:.36, Hh:75},
  ice:    {name:'Buz',    c:'#dff4ff', c2:'#7fb9db', rest:.3,  fric:.002, mass:1,   T:.30, Hh:30},
  rubber: {name:'Lastik', c:'#ff5fae', c2:'#ad1f68', rest:.82, fric:.12,  mass:.7,  T:.42, Hh:110},
};
const MAT_KEYS = Object.keys(MATS);

// Konveyör (stadyum)
const CV = {xL:96, xR:624, cy:724, r:48};
CV.S = CV.xR - CV.xL; CV.A = Math.PI * CV.r; CV.L = 2 * CV.S + 2 * CV.A;
const NS = Math.floor(CV.L / 41); const SP = CV.L / NS;
const S_ENTRY = CV.xR - 360;
const BOX_COLS_X = [96, 268, 452, 624];
const BOX_Y0 = 830, BOX_STEP = 106, BOX_W = 158, BOX_TH = 60, BOX_FH = 44;
const TRAY_BASE = 446, TRAY_T = 22;

// ================= Canvas / ölçek =================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let dpr = 1, scale = 1, offX = 0, offY = 0, spriteK = 0, sprites = null, cssW = 0, cssH = 0;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cssW = innerWidth; cssH = innerHeight;
  cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
  scale = Math.min(cssW / W, cssH / H);
  offX = (cssW - W * scale) / 2; offY = (cssH - H * scale) / 2;
  const k = Math.max(2, Math.min(4, Math.ceil(scale * dpr * 1.2)));
  if (k !== spriteK) { spriteK = k; buildSprites(); }
}

// ================= Yardımcılar =================
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(h, h2, t) { const a = hexRgb(h), b = hexRgb(h2); return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(',')})`; }
function rgba(h, a) { const c = hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function load(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }

// ================= Bilye sprite'ları =================
function buildSprites() {
  sprites = {};
  const k = spriteK, PAD = 10, S = Math.ceil((D + PAD * 2) * k);
  for (const key of MAT_KEYS) {
    const m = MATS[key], rnd = mulberry32(key.length * 7919 + key.charCodeAt(0));
    const body = document.createElement('canvas'), shine = document.createElement('canvas');
    body.width = body.height = shine.width = shine.height = S;
    const b = body.getContext('2d'), s = shine.getContext('2d');
    b.scale(k, k); b.translate(S / k / 2, S / k / 2);
    s.scale(k, k); s.translate(S / k / 2, S / k / 2);
    const circ = (g) => { g.beginPath(); g.arc(0, 0, R, 0, Math.PI * 2); };
    let gr;
    switch (key) {
      case 'glass': {
        gr = b.createRadialGradient(-4, -5, 2, 0, 0, R);
        gr.addColorStop(0, 'rgba(200,240,255,.55)'); gr.addColorStop(.65, 'rgba(70,175,255,.55)'); gr.addColorStop(1, 'rgba(18,80,190,.92)');
        circ(b); b.fillStyle = gr; b.fill();
        b.strokeStyle = 'rgba(255,255,255,.55)'; b.lineWidth = .8;
        for (let i = 0; i < 5; i++) { b.beginPath(); b.arc(rand(-10, 10), rand(-10, 10), rand(.8, 2.2), 0, 7); b.stroke(); }
        // kıvrımlı iç şerit (cam bilye)
        b.save(); circ(b); b.clip();
        b.strokeStyle = 'rgba(120,255,230,.55)'; b.lineWidth = 3.2; b.beginPath(); b.moveTo(-R, 4); b.bezierCurveTo(-6, -12, 6, 16, R, -4); b.stroke();
        b.strokeStyle = 'rgba(255,255,255,.35)'; b.lineWidth = 1.2; b.stroke();
        b.restore();
        gr = s.createRadialGradient(6, 8, 0, 6, 8, 10); gr.addColorStop(0, 'rgba(220,255,255,.55)'); gr.addColorStop(1, 'rgba(220,255,255,0)');
        s.fillStyle = gr; circ(s); s.fill();
        shineStd(s, .95, .18); break;
      }
      case 'metal': {
        gr = b.createRadialGradient(-5, -6, 1, 0, 0, R); gr.addColorStop(0, '#eef2f6'); gr.addColorStop(.6, m.c); gr.addColorStop(1, m.c2);
        circ(b); b.fillStyle = gr; b.fill();
        b.save(); circ(b); b.clip(); b.strokeStyle = 'rgba(255,255,255,.18)'; b.lineWidth = .6;
        for (let i = 0; i < 9; i++) { b.beginPath(); const a = rnd() * 7; b.arc(0, 0, rand(5, R), a, a + rand(.3, 1)); b.stroke(); }
        b.restore();
        s.save(); circ(s); s.clip();
        gr = s.createLinearGradient(0, -R, 0, R);
        gr.addColorStop(0, 'rgba(255,255,255,.8)'); gr.addColorStop(.36, 'rgba(255,255,255,.08)'); gr.addColorStop(.47, 'rgba(25,30,40,.55)');
        gr.addColorStop(.58, 'rgba(255,255,255,.12)'); gr.addColorStop(1, 'rgba(255,255,255,.3)');
        s.fillStyle = gr; s.fillRect(-R, -R, D, D); s.restore();
        shineStd(s, 1, .3); break;
      }
      case 'wood': {
        gr = b.createRadialGradient(-4, -5, 2, 0, 0, R); gr.addColorStop(0, '#e2a066'); gr.addColorStop(.7, m.c); gr.addColorStop(1, m.c2);
        circ(b); b.fillStyle = gr; b.fill();
        b.save(); circ(b); b.clip();
        for (let i = 0; i < 9; i++) { b.strokeStyle = `rgba(90,45,12,${.18 + rnd() * .25})`; b.lineWidth = 1 + rnd() * 1.4; b.beginPath(); b.ellipse(R * .55, R * .2, 3 + i * 4.2, 2 + i * 2.6, .5, 0, 7); b.stroke(); }
        b.fillStyle = 'rgba(80,40,10,.55)'; b.beginPath(); b.ellipse(R * .55, R * .2, 2.6, 1.6, .5, 0, 7); b.fill();
        b.restore(); shineStd(s, .45, .38); break;
      }
      case 'jelly': {
        gr = b.createRadialGradient(-3, -4, 1, 0, 0, R); gr.addColorStop(0, 'rgba(200,255,170,.95)'); gr.addColorStop(.6, rgba(m.c, .9)); gr.addColorStop(1, rgba(m.c2, .95));
        circ(b); b.fillStyle = gr; b.fill();
        b.fillStyle = 'rgba(255,255,255,.35)';
        for (let i = 0; i < 4; i++) { b.beginPath(); b.arc(rand(-9, 9), rand(-6, 11), rand(1, 2.6), 0, 7); b.fill(); }
        s.save(); s.globalAlpha = .75; s.fillStyle = '#fff'; s.beginPath(); s.ellipse(-6, -9, 7.5, 4.2, -.6, 0, 7); s.fill(); s.restore();
        s.strokeStyle = 'rgba(230,255,200,.5)'; s.lineWidth = 1.6; s.beginPath(); s.arc(0, 0, R - 2, .2, 1.4); s.stroke();
        shineStd(s, .4, .22); break;
      }
      case 'lava': {
        gr = b.createRadialGradient(0, 0, R * .8, 0, 0, R + 9); gr.addColorStop(0, 'rgba(255,110,20,.55)'); gr.addColorStop(1, 'rgba(255,60,0,0)');
        b.fillStyle = gr; b.beginPath(); b.arc(0, 0, R + 9, 0, 7); b.fill();
        gr = b.createRadialGradient(-3, -4, 1, 0, 0, R); gr.addColorStop(0, '#6a2410'); gr.addColorStop(1, '#1c0603');
        circ(b); b.fillStyle = gr; b.fill();
        b.save(); circ(b); b.clip(); b.lineCap = 'round'; b.lineJoin = 'round';
        const paths = [];
        for (let i = 0; i < 7; i++) { let x = rand(-12, 12), y = rand(-12, 12); const p = [[x, y]]; for (let j = 0; j < 4; j++) { x += rand(-9, 9); y += rand(-9, 9); p.push([x, y]); } paths.push(p); }
        const strokeP = (col, lw, blur) => { b.strokeStyle = col; b.lineWidth = lw; b.shadowColor = '#ff7a00'; b.shadowBlur = blur; for (const p of paths) { b.beginPath(); b.moveTo(p[0][0], p[0][1]); for (const q of p) b.lineTo(q[0], q[1]); b.stroke(); } };
        strokeP('#ff6a00', 3.2, 6); strokeP('#ffc23a', 1.6, 3); strokeP('#fff3b0', .6, 0);
        b.restore(); shineStd(s, .35, .45); break;
      }
      case 'ice': {
        gr = b.createRadialGradient(-4, -5, 1, 0, 0, R); gr.addColorStop(0, '#ffffff'); gr.addColorStop(.7, '#cbeafc'); gr.addColorStop(1, '#86bfe0');
        circ(b); b.fillStyle = gr; b.fill();
        b.save(); circ(b); b.clip();
        const pts = []; for (let i = 0; i < 9; i++) { const a = i / 9 * Math.PI * 2 + rnd() * .4; pts.push([Math.cos(a) * R * 1.2, Math.sin(a) * R * 1.2]); }
        const cx = rand(-4, 4), cy = rand(-4, 4);
        for (let i = 0; i < 9; i++) { const p = pts[i], q = pts[(i + 1) % 9]; b.fillStyle = i % 2 ? 'rgba(255,255,255,.28)' : 'rgba(110,170,215,.22)'; b.beginPath(); b.moveTo(cx, cy); b.lineTo(p[0], p[1]); b.lineTo(q[0], q[1]); b.closePath(); b.fill(); }
        b.strokeStyle = 'rgba(255,255,255,.7)'; b.lineWidth = .7; for (const p of pts) { b.beginPath(); b.moveTo(cx, cy); b.lineTo(p[0] * .7, p[1] * .7); b.stroke(); }
        b.restore(); shineStd(s, 1, .15); break;
      }
      case 'gold': {
        gr = b.createRadialGradient(-6, -7, 1, 0, 0, R); gr.addColorStop(0, '#fff6c0'); gr.addColorStop(.35, '#ffcf35'); gr.addColorStop(.8, '#d18600'); gr.addColorStop(1, '#6e4200');
        circ(b); b.fillStyle = gr; b.fill();
        s.save(); circ(s); s.clip(); gr = s.createLinearGradient(0, -R, 0, R);
        gr.addColorStop(0, 'rgba(255,255,230,.5)'); gr.addColorStop(.45, 'rgba(255,255,255,0)'); gr.addColorStop(.52, 'rgba(120,60,0,.35)'); gr.addColorStop(.62, 'rgba(255,240,180,.2)'); gr.addColorStop(1, 'rgba(255,220,120,0)');
        s.fillStyle = gr; s.fillRect(-R, -R, D, D); s.restore();
        shineStd(s, 1, .3); break;
      }
      case 'rubber': {
        gr = b.createRadialGradient(-4, -5, 1, 0, 0, R); gr.addColorStop(0, '#ff9fd0'); gr.addColorStop(.7, m.c); gr.addColorStop(1, m.c2);
        circ(b); b.fillStyle = gr; b.fill();
        b.save(); circ(b); b.clip(); b.strokeStyle = 'rgba(255,255,255,.55)'; b.lineWidth = 3.2; b.beginPath(); b.ellipse(0, 0, R * 1.05, R * .42, .5, 0, 7); b.stroke();
        b.strokeStyle = '#ffe14d'; b.lineWidth = 2.2; b.beginPath(); b.ellipse(0, 0, R * .42, R * 1.05, .5, 0, 7); b.stroke(); b.restore();
        shineStd(s, .45, .3); break;
      }
    }
    // lav için ek parıltı
    let glow = null;
    if (key === 'lava') {
      glow = document.createElement('canvas'); glow.width = glow.height = S;
      const gg = glow.getContext('2d'); gg.scale(k, k); gg.translate(S / k / 2, S / k / 2);
      const g2 = gg.createRadialGradient(0, 0, 2, 0, 0, R + 10); g2.addColorStop(0, 'rgba(255,160,40,.9)'); g2.addColorStop(.6, 'rgba(255,80,0,.35)'); g2.addColorStop(1, 'rgba(255,40,0,0)');
      gg.fillStyle = g2; gg.beginPath(); gg.arc(0, 0, R + 10, 0, 7); gg.fill();
    }
    sprites[key] = {body, shine, glow, size: S / k};
  }
  function shineStd(s, str, shadow) {
    let g = s.createRadialGradient(-R * .25, -R * .3, R * .45, 0, 0, R * 1.02);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${shadow})`);
    s.fillStyle = g; s.beginPath(); s.arc(0, 0, R, 0, 7); s.fill();
    g = s.createRadialGradient(-R * .38, -R * .42, 0, -R * .38, -R * .42, R * .62);
    g.addColorStop(0, `rgba(255,255,255,${.75 * str})`); g.addColorStop(1, 'rgba(255,255,255,0)');
    s.fillStyle = g; s.beginPath(); s.arc(0, 0, R, 0, 7); s.fill();
    s.fillStyle = `rgba(255,255,255,${.95 * str})`; s.beginPath(); s.ellipse(-R * .42, -R * .5, R * .17, R * .11, -.6, 0, 7); s.fill();
    s.strokeStyle = `rgba(255,255,255,${.25 * str})`; s.lineWidth = 1.2; s.beginPath(); s.arc(0, 0, R - 1.5, .3, 1.5); s.stroke();
  }
  // gölge
  const sh = document.createElement('canvas'); sh.width = sh.height = S; const sg = sh.getContext('2d');
  sg.scale(k, k); sg.translate(S / k / 2, S / k / 2);
  const g3 = sg.createRadialGradient(0, 0, 0, 0, 0, R * 1.1); g3.addColorStop(0, 'rgba(0,0,0,.42)'); g3.addColorStop(1, 'rgba(0,0,0,0)');
  sg.fillStyle = g3; sg.beginPath(); sg.arc(0, 0, R * 1.1, 0, 7); sg.fill();
  sprites._shadow = sh;
}

let time = 0;
function drawBall(g, x, y, mat, rot = 0, sx = 1, sy = 1, sc = 1, alpha = 1) {
  const sp = sprites[mat], sz = sp.size;
  g.save(); g.translate(x, y);
  if (alpha !== 1) g.globalAlpha = alpha;
  if (sc !== 1) g.scale(sc, sc);
  if (sx !== 1 || sy !== 1) { g.translate(0, R * (1 - sy)); g.scale(sx, sy); }
  if (rot) g.rotate(rot);
  g.drawImage(sp.body, -sz / 2, -sz / 2, sz, sz);
  if (rot) g.rotate(-rot);
  g.drawImage(sp.shine, -sz / 2, -sz / 2, sz, sz);
  if (sp.glow) { g.globalCompositeOperation = 'lighter'; g.globalAlpha = alpha * (.25 + .2 * Math.sin(time * 5 + x * .05)); g.drawImage(sp.glow, -sz / 2, -sz / 2, sz, sz); }
  g.restore();
}
function drawShadow(g, x, y, s = 1, a = 1) {
  const sz = sprites[MAT_KEYS[0]].size;
  g.save(); g.globalAlpha = a; g.translate(x + 3, y + R * .75); g.scale(s, .38 * s); g.drawImage(sprites._shadow, -sz / 2, -sz / 2, sz, sz); g.restore();
}

// ================= Ses =================
let AC = null, master = null, revIn = null, noiseBuf = null, muted = load('bilye_mute', '0') === '1';
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  master = AC.createGain(); master.gain.value = muted ? 0 : .9;

  if (flash) { rr(ctx, x0, y, w, BOX_TH + BOX_FH, 14); ctx.fillStyle = `rgba(255,255,255,${flash * .7})`; ctx.fill(); }
  ctx.restore();
}
function drawHint() {
  const col = trayCols[0]; if (!col || !col.trays.length) return;
  const x = col.x, y = trayTopY(col) + col.tw * .3, p = (time % 1.2) / 1.2;
  ctx.strokeStyle = `rgba(255,255,255,${1 - p})`; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(x, y, 20 + p * 40, 0, 7); ctx.stroke();
  ctx.font = '64px system-ui,"Apple Color Emoji","Segoe UI Emoji",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('👆', x + 34, y + 54 + Math.sin(time * 6) * 6);
}

// ================= Menü vitrini =================
const show = document.getElementById('show'), sctx = show.getContext('2d');
function renderShow() {
  sctx.setTransform(1, 0, 0, 1, 0, 0); sctx.clearRect(0, 0, 600, 300);
  sctx.setTransform(1.55, 0, 0, 1.55, 0, 0);
  MAT_KEYS.forEach((k, i) => {
    const cx = 48 + (i % 4) * 96, cy = 52 + Math.floor(i / 4) * 88;
    const bob = Math.sin(time * 3 + i) * 3;
    drawShadow(sctx, cx, cy + 4, .9, .5);
    drawBall(sctx, cx, cy - 10 + bob, k, time * (i % 2 ? 1 : -1) * 1.2, 1, 1, 1.15);
    sctx.fillStyle = 'rgba(255,255,255,.8)'; sctx.font = '700 11px system-ui,sans-serif'; sctx.textAlign = 'center';
    sctx.fillText(MATS[k].name, cx, cy + 26);
  });
}

// ================= UI =================
const $ = (id) => document.getElementById(id);
function showOv(id, on) { $(id).classList.toggle('hide', !on); }
function play() { initAudio(); sfxClick(); showOv('menu', false); showOv('endO', false); showOv('pauseO', false); startLevel(level); mode = 'play'; }
function pause() { if (mode !== 'play') return; mode = 'pause'; showOv('pauseO', true); }
function resume() { initAudio(); sfxClick(); mode = 'play'; showOv('pauseO', false); }
function showEnd() {
  mode = 'end';
  if (endWin) { $('endT').textContent = 'Seviye ' + level + ' tamam!'; $('endP').textContent = cleared + ' kutu dolduruldu. Harika iş!'; $('endB').textContent = 'Sonraki seviye'; store('bilye_level', String(level + 1)); }
  else { $('endT').textContent = balls.length > 36 ? 'Huni taştı!' : 'Bant tıkandı!'; $('endP').textContent = 'Banttaki bilyelerin hiçbiri öndeki kutulara uymadı. Tepsileri daha dikkatli seç.'; $('endB').textContent = 'Tekrar dene'; }
  $('endR').style.display = endWin ? '' : 'none';
  showOv('endO', true);
}
$('bPlay').onclick = play;
$('bResume').onclick = resume;
$('bRestart').onclick = () => { initAudio(); sfxClick(); showOv('pauseO', false); startLevel(level); mode = 'play'; };
$('bMenu').onclick = () => { sfxClick(); showOv('pauseO', false); mode = 'menu'; updPlayBtn(); showOv('menu', true); };
$('endB').onclick = () => { initAudio(); sfxClick(); showOv('endO', false); startLevel(endWin ? level + 1 : level); mode = 'play'; };
$('endR').onclick = () => { initAudio(); sfxClick(); showOv('endO', false); startLevel(level); mode = 'play'; };
$('bPause').onclick = () => { initAudio(); sfxClick(); mode === 'play' ? pause() : mode === 'pause' && resume(); };
function setMute(m) {
  muted = m; store('bilye_mute', m ? '1' : '0'); if (master) master.gain.value = m ? 0 : .9;
  $('icoSound').innerHTML = m ? '<path d="M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/>' : '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/>';
}
$('bSound').onclick = () => { initAudio(); setMute(!muted); sfxClick(); };
setMute(muted);
function updPlayBtn() { $('bPlay').textContent = level > 1 ? 'Oyna · Seviye ' + level : 'Oyna'; }
updPlayBtn();

cv.addEventListener('pointerdown', (e) => {
  e.preventDefault(); initAudio();
  if (mode !== 'play') return;
  const x = (e.clientX - offX) / scale, y = (e.clientY - offY) / scale;
  if (y < 120 || y > 470) return;
  let best = -1, bd = 1e9;
  trayCols.forEach((c, i) => { const d = Math.abs(x - c.x); if (d < c.tw / 2 + 18 && d < bd) { bd = d; best = i; } });
  if (best >= 0) dump(best);
}, {passive: false});
window.addEventListener('keydown', (e) => {
  if (e.key >= '1' && e.key <= '4') { initAudio(); dump(+e.key - 1); }
  if (e.key === 'p' || e.key === 'Escape') mode === 'play' ? pause() : mode === 'pause' && resume();
});
document.addEventListener('touchmove', (e) => e.preventDefault(), {passive: false});
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { pause(); if (AC && AC.state === 'running') AC.suspend(); }
  else if (AC && mode === 'play') AC.resume();
});
window.addEventListener('resize', resize);

// ================= Döngü =================
resize();
startLevel(level);
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30); last = now;
  if (mode === 'play' || (mode === 'end')) update(dt);
  else { time += dt; updParts(dt); }
  render();
  if (mode === 'menu') renderShow();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
// test kancası
window.__bilye = {dump, get s() { return {mode, balls: balls.length, slots: slots.filter(Boolean).length, flights: flights.length, cleared, totalBoxes, endT, endWin}; }, startLevel, setMode: (m) => mode = m};
</script>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07060f">
<title>Işın Ustası</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;background:#07060f;overflow:hidden;overscroll-behavior:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
#bg{position:fixed;inset:0;width:100%;height:100%}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#top{display:flex;align-items:center;gap:8px;padding:10px 12px 4px}
#lvl{flex:1;text-align:center;font-weight:900;font-size:18px;letter-spacing:1px;line-height:1.1}
#lvl small{display:block;font-size:11px;letter-spacing:2px;font-weight:800}
.ib{width:44px;height:44px;flex:none;border-radius:12px;border:2px solid #3a3560;background:rgba(20,18,42,.85);color:#e0dbff;font-size:19px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ib:active{transform:scale(.92)}
#board{flex:1;position:relative;min-height:0}
#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#bottom{padding:4px 12px 12px;display:flex;flex-direction:column;gap:8px}
#status{min-height:44px;text-align:center;font-size:15px;color:#e0dbff;line-height:1.3;display:flex;align-items:center;justify-content:center;padding:0 6px}
#status b{color:#fff}
#status.bad{color:#ff8a7a}
#bar{display:flex;gap:10px;align-items:center;justify-content:center}
#inv{flex:1;max-width:200px;height:54px;border-radius:14px;border:2px solid #fff;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;font-size:22px;box-shadow:0 0 14px rgba(255,255,255,.18);transition:transform .15s}
#inv.pop{transform:scale(1.08)}
#inv svg{width:26px;height:26px}
#inv small{font-size:11px;font-weight:700;color:#a9a3d6;display:block;letter-spacing:1px}
.ib.big{width:54px;height:54px}
#hint{border-color:#ffd23a;color:#ffd23a}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(7,6,15,.95);z-index:5;text-align:center;padding:calc(20px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));overflow-y:auto}
.ov.hide{display:none}
.ov.scroll{justify-content:flex-start}
h1{font-size:50px;line-height:.95;font-weight:900;letter-spacing:2px;color:#fff;text-shadow:0 0 6px #ff2d55,0 0 26px #ff2d55}
h1 span{color:#7dffb0;text-shadow:0 0 6px #7dffb0,0 0 26px #3dff8a}
h2{font-size:32px;color:#7dffb0;text-shadow:0 0 16px #3dff8a}
p{max-width:340px;line-height:1.45;color:#cfc9ff;font-size:16px}
.small{font-size:13px;color:#8b86b5}
.btn{border:2px solid #ff2d55;background:rgba(80,0,20,.6);color:#fff;font-weight:900;font-size:19px;padding:13px 26px;border-radius:14px;box-shadow:0 0 16px rgba(255,45,85,.5);min-width:230px;cursor:pointer}
.btn.g{border-color:#7dffb0;background:rgba(0,60,30,.6);box-shadow:0 0 16px rgba(125,255,176,.4)}
.btn.s{border-color:#3a3560;background:#14122a;box-shadow:none;font-size:15px;padding:10px 18px;min-width:170px;color:#cfc9ff}
.world{width:100%;max-width:340px;text-align:left;margin-top:8px}
.world h3{font-size:15px;letter-spacing:2px;margin-bottom:8px;display:flex;justify-content:space-between}
.world h3 span{font-size:12px;color:#8b86b5;letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.lv{height:64px;border-radius:12px;border:2px solid #3a3560;background:#14122a;color:#fff;font-weight:900;font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer}
.lv small{font-size:11px;color:#ffd23a;letter-spacing:1px}
.lv.lock{opacity:.28;cursor:default}
.stars{font-size:42px;letter-spacing:8px;color:#ffd23a;text-shadow:0 0 14px #ffd23a}
.stars .off{color:#2a2745;text-shadow:none}
.legend{display:grid;grid-template-columns:52px 1fr;gap:10px 12px;align-items:center;text-align:left;max-width:340px;width:100%}
.legend canvas{width:52px;height:52px;border-radius:10px;background:#0d0b1c;border:1px solid #26224a}
.legend b{display:block;font-size:15px;color:#fff}
.legend span{font-size:13px;color:#b8b2e6;line-height:1.35}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="app">
  <div id="top">
    <button class="ib" id="bMenu" aria-label="Bölümler">☰</button>
    <button class="ib" id="bHelp" aria-label="Rehber">?</button>
    <div id="lvl">BÖLÜM 1<small>LABORATUVAR</small></div>
    <button class="ib" id="bSnd" aria-label="Ses">🔊</button>
    <button class="ib" id="bReset" aria-label="Baştan">⟲</button>
  </div>
  <div id="board"><canvas id="c"></canvas></div>
  <div id="bottom">
    <div id="status"></div>
    <div id="bar">
      <button class="ib big" id="bUndo" aria-label="Geri al">↶</button>
      <div id="inv"><svg viewBox="0 0 26 26"><line x1="4" y1="22" x2="22" y2="4" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg><div><span id="invN">x0</span><small>AYNAN</small></div></div>
      <button class="ib big" id="hint" aria-label="İpucu">💡</button>
    </div>
  </div>
</div>

<div id="menu" class="ov">
  <h1>IŞIN<br><span>USTASI</span></h1>
  <p>Aynaları yerleştir ve çevir. Lazeri bütün elmaslara ulaştır, mayınlara değdirme!</p>
  <button class="btn" id="play">OYNA</button>
  <button class="btn s" id="toLevels">BÖLÜMLER</button>
  <button class="btn s" id="toHelp">NASIL OYNANIR?</button>
</div>

<div id="levels" class="ov scroll hide">
  <h2 style="color:#fff;text-shadow:none;font-size:26px">BÖLÜMLER</h2>
  <div id="worlds" style="display:flex;flex-direction:column;align-items:center;gap:10px;width:100%"></div>
  <p class="small" id="lvInfo"></p>
  <button class="btn s" id="lvBack">GERİ</button>
</div>

<div id="help" class="ov scroll hide">
  <h2 style="font-size:26px">REHBER</h2>
  <p class="small">Oyunda bir şeye dokunursan ne olduğunu alttaki yazıda da görürsün.</p>
  <div class="legend" id="legend"></div>
  <button class="btn s" id="helpBack">TAMAM</button>
</div>

<div id="win" class="ov hide">
  <div class="small" id="wNum" style="letter-spacing:3px;font-weight:800"></div>
  <h2 id="wTitle">HEDEF VURULDU!</h2>
  <div class="stars" id="wStars"></div>
  <p class="small" id="wInfo"></p>
  <button class="btn g" id="wNext">SONRAKİ BÖLÜM</button>
  <button class="btn s" id="wLevels">BÖLÜMLER</button>
</div>

(()=>{
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const DX=[1,0,-1,0],DY=[0,1,0,-1];
const REF={'/':[3,2,1,0],'\\':[1,0,3,2]};

let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f1,f2,dur,type,vol,delay){
  if(save.mute)return;const a=ac();if(!a)return;const t=a.currentTime+(delay||0);
  const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f1,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);

function noise(dur,vol){

// ---------- state ----------
let idx=0,L,W,H,g,em,inv,hist,locked,hints,won=false,parts=[],rings=[];
let tr={segs:[],tg:new Map(),mn:new Map(),max:0},reveal=0,fired=new Set(),infoCell=-1,infoT=0,shakeCell=-1,shakeT=0,flash=0,winT=-1;
let coach=[],partner={};
const world=()=>WORLDS[Math.floor(idx/8)];
function load(i){
  idx=i;L=LEVELS[i];W=L.w;H=L.h;g=L.r.join('').split('');em={x:L.e[0],y:L.e[1],d:L.e[2]};
  partner={};const pl={};g.forEach((c,j)=>{if(c==='O'||c==='U'){if(pl[c]!==undefined){partner[j]=pl[c];partner[pl[c]]=j;}else pl[c]=j;}});
  inv=L.k;hist=[];locked=new Set();hints=0;won=false;winT=-1;parts=[];rings=[];flash=0;
  const w=world();
  $('lvl').innerHTML='BÖLÜM '+(i+1)+' <span style="font-size:13px;color:#8b86b5">('+(i%8+1)+'/8)</span><small style="color:'+w.c+'">'+w.n+'</small>';
  document.documentElement.style.setProperty('--acc',w.c);
  tr={segs:[],tg:new Map(),mn:new Map(),max:0};fired=new Set();reveal=0;
  retrace(true);
  // coach steps
  coach=[];
  if(i%8===0)coach.push({cell:-1,t:'DÜNYA '+(i/8+1)+': '+w.n,x:w.d+'. '+(i===0?'Lazeri yeşil elmasa ulaştırman gerekiyor.':''),col:w.c});
  for(const f of FEATURES[i]){const C=COACH[f];let cell=-1;if(C.ch){cell=g.findIndex(c=>C.ch.test(c));}coach.push({cell,t:C.t,x:C.x,col:f==='mine'?'#ff4040':w.c});}
  status(defaultStatus());updateInv();resize();
}
function nT(){let n=0;for(const c of g)if(c==='T')n++;return n;}
function defaultStatus(){
  const lit=[...tr.tg.values()].filter(d=>d<=reveal+1e-6).length;
  return 'Elmaslar:&nbsp;<b>'+lit+'&nbsp;/&nbsp;'+nT()+'</b>&nbsp;&nbsp;•&nbsp;&nbsp;'+(L.k?'Ayna:&nbsp;<b>'+inv+'</b>':'Mavi aynaları çevir');
}
let statusUntil=0,lastD='';
function status(t,bad,hold){$('status').innerHTML=t;$('status').className=bad?'bad':'';statusUntil=hold?performance.now()+hold:0;}

// ---------- trace ----------
function retrace(fresh){
  const prev=new Set(tr.segs.filter(s=>s.d0+s.len<=reveal+1e-6).map(s=>s.k));
  const prevLit=new Set([...tr.tg.entries()].filter(([i,d])=>d<=reveal+1e-6).map(([i])=>i));
  const segs=[],tg=new Map(),mn=new Map(),seen=new Set();
  const st=[[em.x,em.y,em.d,0,0]];let max=0;
  while(st.length){
    let [x,y,d,dist,skip]=st.pop();
    for(let gd=0;gd<800;gd++){
      const key=(y*W+x)*4+d;if(!skip){if(seen.has(key))break;seen.add(key);}skip=0;
      const nx=x+DX[d],ny=y+DY[d];
      const out=nx<0||ny<0||nx>=W||ny>=H;
      if(out||g[ny*W+nx]==='#'){segs.push({a:[x+.5,y+.5],b:[x+.5+DX[d]*.5,y+.5+DY[d]*.5],d0:dist,len:.5});max=Math.max(max,dist+.5);break;}
      segs.push({a:[x+.5,y+.5],b:[nx+.5,ny+.5],d0:dist,len:1});dist+=1;max=Math.max(max,dist);
      x=nx;y=ny;const i=y*W+x,c=g[i];
      if(c==='T'){if(!tg.has(i)||tg.get(i)>dist)tg.set(i,dist);break;}
      if(c==='X'){if(!mn.has(i))mn.set(i,dist);break;}
      if(c==='E')break;
      if(c==='O'||c==='U'){const j=partner[i];x=j%W;y=(j/W)|0;continue;}
      const m=mirrorOf(c);
      if(m){if(c==='s'||c==='z')st.push([x,y,d,dist,1]);d=REF[m][d];}
    }
  }
  segs.forEach(s=>s.k=s.a+'|'+s.b+'|'+s.d0);
  tr={segs,tg,mn,max};
  if(fresh){reveal=0;fired=new Set();}
  else{
    let minNew=max;for(const s of segs)if(!prev.has(s.k))minNew=Math.min(minNew,s.d0);
    reveal=Math.min(reveal,minNew);
    fired=new Set();for(const [i,d] of tg)if(d<=reveal+1e-6||prevLit.has(i)&&d<=reveal+1e-6)fired.add('t'+i);
    for(const [i] of tg)if(prevLit.has(i))fired.add('t'+i);
  }
}

// ---------- input ----------
function cellAt(e){
  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  const cx=Math.floor((x-ox)/cs),cy=Math.floor((y-oy)/cs);
  if(cx<0||cy<0||cx>=W||cy>=H)return -1;return cy*W+cx;
}
function snapshot(){hist.push({g:g.slice(),inv,locked:new Set(locked)});if(hist.length>100)hist.shift();}
function showInfo(i){const k=infoKey(g[i]);if(!INFO[k])return;infoCell=i;infoT=2.2;status('<b>'+INFO[k][0]+':</b> '+INFO[k][1],k==='X',3200);SFX.info();}
function tap(i){
  if(won||i<0)return;
  const c=g[i];
  if(locked.has(i)){bump(i);status('Bu ayna ipucuyla doğru yerine sabitlendi.',false,2000);return;}
  if(c==='a'||c==='b'){snapshot();g[i]=c==='a'?'b':'a';SFX.rot();}
  else if(c==='P'){snapshot();g[i]='Q';SFX.rot();}
  else if(c==='Q'){snapshot();g[i]='.';inv++;SFX.remove();popInv();}
  else if(c==='.'){
    if(L.k===0){bump(i);SFX.err();status('Bu bölümde ayna koyamazsın. <b>Mavi aynaları</b> çevir.',true,2400);return;}
    if(inv<=0){bump(i);SFX.err();status('Ayna kalmadı! Koyduğun bir aynaya dokunup geri al.',true,2400);return;}
    snapshot();g[i]='P';inv--;SFX.place();popInv();
  }
  else{showInfo(i);bump(i);return;}
  after();
}
function popInv(){const e=$('inv');e.classList.add('pop');setTimeout(()=>e.classList.remove('pop'),150);}
function bump(i){shakeCell=i;shakeT=.3;}
function after(){retrace(false);updateInv();statusUntil=0;}
function updateInv(){$('invN').textContent='x'+inv;$('inv').style.opacity=L.k?1:.3;$('bUndo').style.opacity=hist.length?1:.35;}
cv.addEventListener('pointerdown',e=>{e.preventDefault();ac();
  if(coach.length){coach.shift();SFX.info();return;}
  tap(cellAt(e));});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());

$('bUndo').onclick=()=>{if(won||!hist.length)return;const h=hist.pop();g=h.g;inv=h.inv;locked=h.locked;SFX.remove();after();};
$('bReset').onclick=()=>{if(won)return;const hs=hints;load(idx);coach=[];hints=hs;status('Bölüm baştan başladı.',false,1500);};
$('bSnd').onclick=()=>{save.mute=!save.mute;store();updSnd();if(!save.mute)SFX.info();};
$('hint').onclick=()=>{
  if(won)return;coach=[];
  const done=msg=>{hints++;after();status('💡 '+msg,false,2600);SFX.place();};
  for(const [i,m] of L.sr){const want=m==='/'?'a':'b';if(g[i]!==want){snapshot();g[i]=want;locked.add(i);infoCell=i;infoT=1.5;return done('Altın renkli mavi ayna doğru yöne çevrildi.');}}
  for(const [i,m] of L.sp){const want=m==='/'?'P':'Q';if(g[i]===want)continue;
    if(g[i]==='.'&&inv<=0){const ex=g.findIndex((c,j)=>(c==='P'||c==='Q')&&!locked.has(j));if(ex<0)break;snapshot();g[ex]='.';inv++;}
    else snapshot();
    if(g[i]==='.')inv--;g[i]=want;locked.add(i);infoCell=i;infoT=1.5;return done('Altın renkli ayna doğru yerine kondu.');}
  const ex=g.findIndex((c,j)=>(c==='P'||c==='Q')&&!locked.has(j));
  if(ex>=0){snapshot();g[ex]='.';inv++;return done('Yoldaki fazla bir ayna kaldırıldı.');}
};

// ---------- win ----------
function winSeq(){
  won=true;winT=0;flash=1;SFX.win();
  for(const [i] of tr.tg)burst(i%W,(i/W)|0,'#7dffb0',36);
  const st=hints===0?3:hints===1?2:1;
  const prevUn=save.un;
  save.st[idx]=Math.max(save.st[idx]||0,st);if(idx+1<LEVELS.length)save.un=Math.max(save.un,idx+2);store();
  status('Mükemmel! Bütün elmaslar parlıyor ✨');
  const tok=idx;
  setTimeout(()=>{
    if(!won||idx!==tok)return;
    const w=world();
    $('wNum').innerHTML='<span style="color:'+w.c+'">'+w.n+'</span> • BÖLÜM '+(idx+1);
    $('wTitle').textContent=idx%8===7?'DÜNYA TAMAMLANDI!':'HEDEF VURULDU!';
    $('wStars').innerHTML=[0,1,2].map(i=>i<st?'★':'<span class="off">★</span>').join('');
    let info=hints?'Kullandığın ipucu: '+hints+'. İpucusuz bitirirsen 3 yıldız alırsın.':'İpucusuz çözdün!';
    if(idx%8===7&&idx+1<LEVELS.length)info+='<br><b style="color:'+WORLDS[idx/8+1|0].c+'">Yeni dünya açıldı: '+WORLDS[idx/8+1|0].n+'</b>';
    if(idx+1>=LEVELS.length){info+='<br>Tüm bölümleri bitirdin! 🎉';$('wNext').style.display='none';}else $('wNext').style.display='';
    $('wInfo').innerHTML=info;
    $('win').classList.remove('hide');
  },1500);
}
function burst(cx,cy,col,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=1+Math.random()*5;parts.push({x:cx+.5,y:cy+.5,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.6+Math.random()*.6,col});}rings.push({x:cx+.5,y:cy+.5,r:0,col,life:1});}

// ---------- layout ----------
let cs=40,ox=0,oy=0,dpr=1;
const bg=$('bg'),bgx=bg.getContext('2d');let stars=[];
function resize(){
  const r=$('board').getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,2.5);
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);
  bg.width=Math.round(innerWidth*dpr);bg.height=Math.round(innerHeight*dpr);
  if(!stars.length)for(let i=0;i<70;i++)stars.push({x:Math.random(),y:Math.random(),s:Math.random()*1.6+.4,v:Math.random()*.01+.003});
  if(!L)return;
  cs=Math.floor(Math.min((r.width-20)/W,(r.height-12)/H));
  ox=Math.floor((r.width-cs*W)/2);oy=Math.floor((r.height-cs*H)/2);
}
window.addEventListener('resize',resize);

// ---------- drawing ----------
function rr(X,x,y,w,h,r){X.beginPath();if(X.roundRect)X.roundRect(x,y,w,h,r);else X.rect(x,y,w,h);}
function mline(X,px,py,s,m,col,lw,dash){
  const p=s*.2;X.lineCap='round';X.strokeStyle=col;X.lineWidth=lw;if(dash)X.setLineDash(dash);
  X.beginPath();if(m==='/'){X.moveTo(px+p,py+s-p);X.lineTo(px+s-p,py+p);}else{X.moveTo(px+p,py+p);X.lineTo(px+s-p,py+s-p);}
  X.stroke();X.setLineDash([]);
}
// tek bir öğeyi çiz (oyun ve rehber ortak)
function drawItem(X,c,px,py,s,time,o){
  o=o||{};const cx=px+s/2,cy=py+s/2;
  if(c==='#'){
    rr(X,px+2,py+2,s-4,s-4,6);X.fillStyle='#1e1b36';X.fill();X.strokeStyle='#3d3775';X.lineWidth=1.5;X.stroke();
    X.save();X.beginPath();X.rect(px+3,py+3,s-6,s-6);X.clip();X.strokeStyle='rgba(140,130,220,.16)';X.lineWidth=2;
    for(let k=-1;k<4;k++){X.beginPath();X.moveTo(px+k*s/3,py+s);X.lineTo(px+k*s/3+s,py);X.stroke();}X.restore();
  }
  else if(c==='E'){
    const d=o.dir||0;
    rr(X,px+s*.12,py+s*.12,s*.76,s*.76,s*.18);X.fillStyle='#3a0614';X.fill();X.strokeStyle='#ff2d55';X.lineWidth=3;X.stroke();
    X.save();X.translate(cx,cy);X.rotate(d*Math.PI/2);X.fillStyle='#ff2d55';X.beginPath();X.moveTo(s*.2,-s*.15);X.lineTo(s*.46,-s*.08);X.lineTo(s*.46,s*.08);X.lineTo(s*.2,s*.15);X.fill();X.restore();
    X.beginPath();X.arc(cx,cy,s*.15*(.9+Math.sin(time*5)*.12),0,6.28);X.fillStyle='#ffd0d8';X.shadowColor='#ff2d55';X.shadowBlur=12;X.fill();X.shadowBlur=0;
  }
  else if(c==='T'){
    const lit=o.lit;X.save();X.translate(cx,cy);
    const sc=lit?1+Math.sin(time*7)*.07:1+Math.sin(time*2)*.03;const sz=s*.3*sc;
    if(lit){X.beginPath();X.arc(0,0,s*.44,0,6.28);X.fillStyle='rgba(61,255,138,.18)';X.fill();}
    X.rotate(lit?time*1.2:0);
    X.beginPath();X.moveTo(0,-sz);X.lineTo(sz*.85,-sz*.25);X.lineTo(sz*.55,sz);X.lineTo(-sz*.55,sz);X.lineTo(-sz*.85,-sz*.25);X.closePath();
    if(lit){X.shadowColor='#3dff8a';X.shadowBlur=22;X.fillStyle='#7dffb0';X.fill();X.shadowBlur=0;X.strokeStyle='#fff';X.lineWidth=2;X.stroke();}
    else{X.fillStyle='rgba(125,255,176,.1)';X.fill();X.strokeStyle='#7dffb0';X.lineWidth=2.5;X.stroke();}
    X.beginPath();X.moveTo(-sz*.85,-sz*.25);X.lineTo(sz*.85,-sz*.25);X.moveTo(0,-sz);X.lineTo(-sz*.3,-sz*.25);X.lineTo(0,sz);X.lineTo(sz*.3,-sz*.25);X.closePath();
    X.strokeStyle=lit?'rgba(255,255,255,.7)':'rgba(125,255,176,.35)';X.lineWidth=1;X.stroke();
    X.restore();
  }
  else if(c==='X'){
    const hit=o.hit;
    // tehlike zemini
    X.save();rr(X,px+3,py+3,s-6,s-6,6);X.clip();
    X.fillStyle=hit?'rgba(255,60,30,.35)':'rgba(255,50,50,.1)';X.fillRect(px,py,s,s);
    X.strokeStyle=hit?'rgba(255,200,0,.5)':'rgba(255,90,60,.22)';X.lineWidth=s*.08;
    for(let k=-2;k<4;k++){X.beginPath();X.moveTo(px+k*s/3,py+s);X.lineTo(px+k*s/3+s,py);X.stroke();}
    X.restore();
    // bomba
    const r=s*.24,bx=cx-s*.03,by=cy+s*.05;
    X.beginPath();X.arc(bx,by,r,0,6.28);X.fillStyle='#1a1418';X.fill();X.strokeStyle=hit?'#fff':'#ff4040';X.lineWidth=2.5;X.stroke();
    X.beginPath();X.arc(bx-r*.35,by-r*.35,r*.25,0,6.28);X.fillStyle='rgba(255,255,255,.25)';X.fill();
    X.fillStyle='#ff4040';X.fillRect(bx+r*.45,by-r*1.05,r*.42,r*.38);
    X.beginPath();X.moveTo(bx+r*.66,by-r*1.05);X.quadraticCurveTo(bx+r*.9,by-r*1.6,bx+r*1.35,by-r*1.45);X.strokeStyle='#d9b38c';X.lineWidth=2;X.stroke();
    const fl=.6+Math.sin(time*18)*.4;X.beginPath();X.arc(bx+r*1.38,by-r*1.48,s*.06*fl+1.5,0,6.28);X.fillStyle=Math.sin(time*25)>0?'#ffd23a':'#ff7a1a';X.fill();
    X.font='900 '+Math.round(r*1.15)+'px system-ui';X.textAlign='center';X.textBaseline='middle';X.fillStyle='#ff4040';X.fillText('!',bx,by+1);
  }
  else if(c==='/'||c==='\\'){
    mline(X,px,py,s,c,'#4a4e63',s*.17);mline(X,px,py,s,c,'#c3c7d8',s*.06);
    X.fillStyle='#8a8ea3';const p=s*.2;(c==='/'?[[p,s-p],[s-p,p]]:[[p,p],[s-p,s-p]]).forEach(([a,b])=>{X.beginPath();X.arc(px+a,py+b,s*.055,0,6.28);X.fill();});
  }
  else if(c==='a'||c==='b'){
    const lk=o.locked,col=lk?'#ffd23a':'#4fd1ff';
    X.beginPath();X.arc(cx,cy,s*.42,0,6.28);X.strokeStyle=lk?'rgba(255,210,58,.6)':'rgba(79,209,255,.4)';X.lineWidth=2;X.setLineDash([4,4]);X.lineDashOffset=-time*6;X.stroke();X.setLineDash([]);
    // dönüş okları
    X.save();X.translate(cx,cy);X.rotate(time*.8);X.strokeStyle=lk?'rgba(255,210,58,.5)':'rgba(79,209,255,.55)';X.lineWidth=2;
    for(let k=0;k<2;k++){X.beginPath();X.arc(0,0,s*.42,k*Math.PI+.2,k*Math.PI+.9);X.stroke();}X.restore();
    mline(X,px,py,s,mirrorOf(c),lk?'rgba(255,210,58,.3)':'rgba(79,209,255,.3)',s*.2);mline(X,px,py,s,mirrorOf(c),col,s*.08);
  }
  else if(c==='P'||c==='Q'){
    const lk=o.locked;
    mline(X,px,py,s,mirrorOf(c),lk?'rgba(255,210,58,.35)':'rgba(255,255,255,.28)',s*.2);mline(X,px,py,s,mirrorOf(c),lk?'#ffd23a':'#ffffff',s*.08);
  }
  else if(c==='s'||c==='z'){
    const m=mirrorOf(c);
    X.save();X.translate(cx,cy);X.rotate(m==='/'?-Math.PI/4:Math.PI/4);
    rr(X,-s*.4,-s*.09,s*.8,s*.18,s*.06);const gr=X.createLinearGradient(-s*.4,0,s*.4,0);
    gr.addColorStop(0,'rgba(255,90,90,.6)');gr.addColorStop(.33,'rgba(255,230,90,.6)');gr.addColorStop(.66,'rgba(90,200,255,.6)');gr.addColorStop(1,'rgba(199,125,255,.7)');
    X.fillStyle=gr;X.fill();X.strokeStyle='#e2c4ff';X.lineWidth=1.5;X.stroke();X.restore();
  }
  else if(c==='O'||c==='U'){
    const col=PCOL[c];
    X.beginPath();X.arc(cx,cy,s*.36,0,6.28);X.fillStyle='rgba(0,0,0,.6)';X.fill();
    for(let k=0;k<3;k++){X.save();X.translate(cx,cy);X.rotate(time*(1.5+k*.7)*(k%2?-1:1));X.beginPath();X.arc(0,0,s*(.36-k*.09),0,4.3);X.strokeStyle=col;X.globalAlpha=1-k*.25;X.lineWidth=2.5;X.stroke();X.restore();}
    X.globalAlpha=1;X.beginPath();X.arc(cx,cy,s*.06,0,6.28);X.fillStyle=col;X.fill();
  }
}

function drawBG(t){
  const w=L?world():WORLDS[0],[r,g2,b]=w.bg;
  bgx.setTransform(dpr,0,0,dpr,0,0);
  const gr=bgx.createRadialGradient(innerWidth/2,innerHeight*.45,10,innerWidth/2,innerHeight*.45,Math.max(innerWidth,innerHeight)*.8);
  gr.addColorStop(0,'rgb('+(r+14)+','+(g2+14)+','+(b+22)+')');gr.addColorStop(1,'#050409');
  bgx.fillStyle=gr;bgx.fillRect(0,0,innerWidth,innerHeight);
  bgx.fillStyle=w.c;
  for(const s of stars){s.y-=s.v/60;if(s.y<0)s.y=1;bgx.globalAlpha=.25+.25*Math.sin(t/700+s.x*20);bgx.fillRect(s.x*innerWidth,s.y*innerHeight,s.s,s.s);}
  bgx.globalAlpha=1;
}

function draw(t){
  const time=t/1000;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  if(!L)return;
  const w=world();
  // board
  rr(ctx,ox-8,oy-8,cs*W+16,cs*H+16,16);ctx.fillStyle='rgba(10,9,22,.92)';ctx.fill();
  ctx.strokeStyle=w.c;ctx.globalAlpha=.55;ctx.lineWidth=2;ctx.shadowColor=w.c;ctx.shadowBlur=14;ctx.stroke();ctx.shadowBlur=0;ctx.globalAlpha=1;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const px=ox+x*cs,py=oy+y*cs;rr(ctx,px+2,py+2,cs-4,cs-4,6);ctx.fillStyle='rgba(255,255,255,.035)';ctx.fill();}
  // walls under beam
  for(let i=0;i<g.length;i++)if(g[i]==='#')drawItem(ctx,'#',ox+(i%W)*cs,oy+((i/W)|0)*cs,cs,time);
  // beam
  ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
  const heads=[];
  ctx.beginPath();
  for(const s of tr.segs){
    if(reveal<=s.d0)continue;const f=Math.min(1,(reveal-s.d0)/s.len);
    const ax=ox+s.a[0]*cs,ay=oy+s.a[1]*cs,bx=ox+(s.a[0]+(s.b[0]-s.a[0])*f)*cs,by=oy+(s.a[1]+(s.b[1]-s.a[1])*f)*cs;
    ctx.moveTo(ax,ay);ctx.lineTo(bx,by);if(f<1)heads.push([bx,by]);
  }
  const pulse=.85+Math.sin(time*6)*.15,fl=flash;
  ctx.strokeStyle='rgba(255,45,85,'+(.2*pulse+fl*.3)+')';ctx.lineWidth=cs*(.45+fl*.3);ctx.stroke();
  ctx.strokeStyle='rgba(255,45,85,.6)';ctx.lineWidth=cs*.16;ctx.stroke();
  ctx.strokeStyle=fl>0?'#fff':'#ffd0d8';ctx.lineWidth=Math.max(2,cs*.055);ctx.stroke();
  ctx.setLineDash([cs*.1,cs*.45]);ctx.lineDashOffset=-time*cs*3.5;ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=Math.max(2,cs*.07);ctx.stroke();ctx.setLineDash([]);
  for(const [hx,hy] of heads){ctx.beginPath();ctx.arc(hx,hy,cs*.16,0,6.28);ctx.fillStyle='rgba(255,220,230,.9)';ctx.fill();}
  ctx.globalCompositeOperation='source-over';
  // items
  for(let i=0;i<g.length;i++){
    const c=g[i];if(c==='.'||c==='#')continue;
    let px=ox+(i%W)*cs,py=oy+((i/W)|0)*cs;if(i===shakeCell&&shakeT>0)px+=Math.sin(shakeT*60)*4;
    drawItem(ctx,c,px,py,cs,time,{dir:em.d,lit:tr.tg.has(i)&&tr.tg.get(i)<=reveal+1e-6,hit:tr.mn.has(i)&&tr.mn.get(i)<=reveal+1e-6,locked:locked.has(i)});
  }
  // info ring
  if(infoT>0&&infoCell>=0){const px=ox+(infoCell%W)*cs,py=oy+((infoCell/W)|0)*cs;ctx.globalAlpha=Math.min(1,infoT*2);rr(ctx,px-2,py-2,cs+4,cs+4,9);ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.setLineDash([6,4]);ctx.lineDashOffset=-time*20;ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;}
  // fx
  for(const r of rings){ctx.globalAlpha=Math.max(0,r.life);ctx.beginPath();ctx.arc(ox+r.x*cs,oy+r.y*cs,r.r*cs,0,6.28);ctx.strokeStyle=r.col;ctx.lineWidth=3;ctx.stroke();}
  for(const p of parts){ctx.globalAlpha=Math.max(0,Math.min(1,p.life*1.5));ctx.fillStyle=p.col;ctx.fillRect(ox+p.x*cs-2,oy+p.y*cs-2,4,4);}
  ctx.globalAlpha=1;
  if(coach.length)drawCoach(coach[0],time);
}

function wrap(text,maxW){const words=text.split(' ');const lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}if(cur)lines.push(cur);return lines;}
function drawCoach(c,time){
  const r=cv.getBoundingClientRect(),VW=r.width,VH=r.height;
  ctx.save();ctx.beginPath();ctx.rect(0,0,VW,VH);
  let hx=-1,hy=-1;
  if(c.cell>=0){hx=ox+(c.cell%W+.5)*cs;hy=oy+(((c.cell/W)|0)+.5)*cs;ctx.arc(hx,hy,cs*.75,0,6.28,true);}
  ctx.fillStyle='rgba(4,3,10,.78)';ctx.fill('evenodd');
  if(hx>=0){ctx.beginPath();ctx.arc(hx,hy,cs*(.75+Math.sin(time*5)*.06),0,6.28);ctx.strokeStyle=c.col;ctx.lineWidth=3;ctx.shadowColor=c.col;ctx.shadowBlur=14;ctx.stroke();ctx.shadowBlur=0;}
  // bubble
  const bw=Math.min(VW-30,330);ctx.font='600 15px system-ui';const lines=wrap(c.x,bw-32);
  const bh=58+lines.length*21+26;
  let by=hy<0?VH/2-bh/2:(hy>VH/2?hy-cs*.9-bh-10:hy+cs*.9+10);by=Math.max(6,Math.min(VH-bh-6,by));
  const bx=(VW-bw)/2;
  rr(ctx,bx,by,bw,bh,14);ctx.fillStyle='#14122a';ctx.fill();ctx.strokeStyle=c.col;ctx.lineWidth=2.5;ctx.stroke();
  ctx.textAlign='left';ctx.textBaseline='top';
  ctx.font='900 18px system-ui';ctx.fillStyle=c.col;ctx.fillText(c.t,bx+16,by+16);
  ctx.font='600 15px system-ui';ctx.fillStyle='#e8e4ff';lines.forEach((l,i)=>ctx.fillText(l,bx+16,by+46+i*21));
  ctx.font='700 12px system-ui';ctx.fillStyle='#8b86b5';ctx.textAlign='right';ctx.fillText('devam için dokun ▸',bx+bw-14,by+bh-22);
  ctx.restore();
}

// ---------- loop ----------
let last=0;
function loop(t){
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  drawBG(t);
  if(L&&!coach.length){
    const speed=Math.max(22,tr.max/0.6);
    if(reveal<tr.max){reveal=Math.min(tr.max,reveal+speed*dt);}
    // events
    let k=0;
    for(const [i,d] of [...tr.tg.entries()].sort((a,b)=>a[1]-b[1])){if(d<=reveal+1e-6&&!fired.has('t'+i)){fired.add('t'+i);SFX.chime(k);burst(i%W,(i/W)|0,'#7dffb0',14);}k++;}
    for(const [i,d] of tr.mn){if(d<=reveal+1e-6&&!fired.has('m'+i)){fired.add('m'+i);SFX.boom();burst(i%W,(i/W)|0,'#ff7a1a',40);burst(i%W,(i/W)|0,'#ffd23a',20);shakeCell=i;shakeT=.5;try{navigator.vibrate&&navigator.vibrate(120);}catch(e){}
      status('💥 <b>Işın mayına değdi!</b> Başka bir yol dene.',true,2600);}}
    if(!won&&reveal>=tr.max&&!tr.mn.size&&tr.tg.size===nT())winSeq();
    if(!won&&performance.now()>statusUntil){const d=defaultStatus();if(lastD!==d||statusUntil!==-1){lastD=d;statusUntil=-1;$('status').innerHTML=d;$('status').className='';}}
  }
  shakeT=Math.max(0,shakeT-dt);infoT=Math.max(0,infoT-dt);flash=Math.max(0,flash-dt*1.2);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.94;p.vy*=.94;if(p.life<=0)parts.splice(i,1);}
  for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.life-=dt*1.6;r.r+=dt*2.2;if(r.life<=0)rings.splice(i,1);}
  draw(t);requestAnimationFrame(loop);
}

// ---------- screens ----------
const hideAll=()=>['menu','levels','win','help'].forEach(i=>$(i).classList.add('hide'));
let helpReturn=null;
function levels(){
  hideAll();const box=$('worlds');box.innerHTML='';
  WORLDS.forEach((w,wi)=>{
    const div=document.createElement('div');div.className='world';
    const got=[0,1,2,3,4,5,6,7].reduce((a,j)=>a+(save.st[wi*8+j]||0),0);
    div.innerHTML='<h3 style="color:'+w.c+'">'+(wi+1)+'. '+w.n+'<span>★ '+got+'/24</span></h3>';
    const gr=document.createElement('div');gr.className='grid';
    for(let j=0;j<8;j++){const i=wi*8+j;const b=document.createElement('button');const lock=i+1>save.un,s=save.st[i]||0;
      b.className='lv'+(lock?' lock':'');if(i+1===save.un){b.style.borderColor=w.c;b.style.boxShadow='0 0 12px '+w.c;}
      b.innerHTML=(lock?'🔒':i+1)+'<small>'+(lock?'':'★'.repeat(s)+'☆'.repeat(3-s))+'</small>';
      if(!lock)b.onclick=()=>{hideAll();load(i);};gr.appendChild(b);}
    div.appendChild(gr);box.appendChild(div);
  });
  const tot=Object.values(save.st).reduce((a,b)=>a+b,0);$('lvInfo').textContent='Toplam yıldız: '+tot+' / '+LEVELS.length*3;
  $('levels').classList.remove('hide');$('levels').scrollTop=0;
}
function help(from){
  helpReturn=from;hideAll();const lg=$('legend');lg.innerHTML='';
  const items=[['E'],['T',{lit:false}],['P'],['a'],['/'],['#'],['X'],['s'],['O']];
  for(const [c,o] of items){
    const cvs=document.createElement('canvas');cvs.width=104;cvs.height=104;const X=cvs.getContext('2d');X.scale(2,2);drawItem(X,c,0,0,52,0,o||{});
    if(c==='T'){/* lit version side by side not needed */}
    const k=infoKey(c);const t=document.createElement('div');t.innerHTML='<b>'+INFO[k][0]+'</b><span>'+INFO[k][1]+'</span>';
    lg.appendChild(cvs);lg.appendChild(t);
  }
  $('help').classList.remove('hide');$('help').scrollTop=0;
}
$('play').onclick=()=>{ac();hideAll();load(Math.min(save.un,LEVELS.length)-1);};
$('toLevels').onclick=levels;$('toHelp').onclick=()=>help('menu');$('bHelp').onclick=()=>help(null);
$('helpBack').onclick=()=>{hideAll();if(helpReturn==='menu')$('menu').classList.remove('hide');};
$('lvBack').onclick=()=>{hideAll();if(!L)$('menu').classList.remove('hide');};
$('bMenu').onclick=levels;$('wLevels').onclick=levels;
$('wNext').onclick=()=>{hideAll();load(idx+1);};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&AC)AC.suspend();});

updSnd();resize();
window.__iu={load:i=>{hideAll();load(i);coach=[];},tap,get won(){return won},LEVELS,g:()=>g,skip:()=>{reveal=tr.max;},get coach(){return coach.length}};
requestAnimationFrame(loop);
})();
</script>

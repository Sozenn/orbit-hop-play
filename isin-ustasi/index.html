<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07060f">
<title>Işın Ustası</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;background:#07060f;overflow:hidden;overscroll-behavior:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#top{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 4px;gap:8px}
#lvl{font-weight:900;font-size:18px;letter-spacing:1px}
#lvl small{display:block;font-size:11px;color:#8b86b5;letter-spacing:2px;font-weight:700}
.ib{width:46px;height:46px;border-radius:12px;border:2px solid #3a3560;background:#14122a;color:#cfc9ff;font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ib:active{transform:scale(.93)}
#board{flex:1;position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#bottom{padding:6px 12px 12px;display:flex;flex-direction:column;gap:8px}
#status{min-height:40px;text-align:center;font-size:15px;color:#d8d3ff;line-height:1.35;display:flex;align-items:center;justify-content:center;padding:0 6px}
#status.bad{color:#ffb070}
#bar{display:flex;gap:10px;align-items:center;justify-content:center}
#inv{flex:1;max-width:190px;height:52px;border-radius:14px;border:2px solid #fff;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;font-size:22px;box-shadow:0 0 14px rgba(255,255,255,.2)}
#inv svg{width:26px;height:26px}
.ib.big{width:52px;height:52px}
#hint{border-color:#ffd23a;color:#ffd23a}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(7,6,15,.94);z-index:5;text-align:center;padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));overflow-y:auto}
.ov.hide{display:none}
h1{font-size:46px;line-height:1;font-weight:900;letter-spacing:2px;color:#fff;text-shadow:0 0 6px #ff2d55,0 0 22px #ff2d55}
h1 span{color:#7dffb0;text-shadow:0 0 6px #7dffb0,0 0 22px #3dff8a}
h2{font-size:34px;color:#7dffb0;text-shadow:0 0 16px #3dff8a}
p{max-width:340px;line-height:1.45;color:#cfc9ff;font-size:16px}
.small{font-size:13px;color:#8b86b5}
.btn{border:2px solid #ff2d55;background:rgba(80,0,20,.6);color:#fff;font-weight:900;font-size:19px;padding:13px 26px;border-radius:14px;box-shadow:0 0 16px rgba(255,45,85,.5);min-width:220px;cursor:pointer}
.btn.g{border-color:#7dffb0;background:rgba(0,60,30,.6);box-shadow:0 0 16px rgba(125,255,176,.4)}
.btn.s{border-color:#3a3560;background:#14122a;box-shadow:none;font-size:15px;padding:9px 18px;min-width:160px;color:#cfc9ff}
#grid{display:grid;grid-template-columns:repeat(4,70px);gap:10px}
.lv{height:70px;border-radius:12px;border:2px solid #3a3560;background:#14122a;color:#fff;font-weight:900;font-size:21px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.lv small{font-size:12px;color:#ffd23a;letter-spacing:1px}
.lv.lock{opacity:.3;cursor:default}
.lv.cur{border-color:#ff2d55;box-shadow:0 0 12px rgba(255,45,85,.6)}
.stars{font-size:40px;letter-spacing:8px;color:#ffd23a;text-shadow:0 0 14px #ffd23a}
.stars .off{color:#2a2745;text-shadow:none}
.legend{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;text-align:left;max-width:330px;font-size:14px;color:#cfc9ff}
.legend i{width:30px;height:30px;display:block}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button class="ib" id="bMenu" aria-label="Bölümler">☰</button>
    <div id="lvl">BÖLÜM 1<small>IŞIN USTASI</small></div>
    <button class="ib" id="bReset" aria-label="Baştan">⟲</button>
  </div>
  <div id="board"><canvas id="c"></canvas></div>
  <div id="bottom">
    <div id="status"></div>
    <div id="bar">
      <button class="ib big" id="bUndo" aria-label="Geri al">↶</button>
      <div id="inv"><svg viewBox="0 0 26 26"><line x1="4" y1="22" x2="22" y2="4" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg><span id="invN">x0</span></div>
      <button class="ib big" id="hint" aria-label="İpucu">💡</button>
    </div>
  </div>
</div>

<div id="menu" class="ov">
  <h1>IŞIN<br><span>USTASI</span></h1>
  <p>Aynaları yerleştir ve çevir, lazeri bütün elmaslara ulaştır.</p>
  <div class="legend" id="legend"></div>
  <button class="btn" id="play">OYNA</button>
  <button class="btn s" id="toLevels">BÖLÜMLER</button>
</div>

<div id="levels" class="ov hide">
  <h2 style="color:#fff;text-shadow:none;font-size:26px">BÖLÜMLER</h2>
  <div id="grid"></div>
  <p class="small" id="lvInfo"></p>
  <button class="btn s" id="lvBack">GERİ</button>
</div>

<div id="win" class="ov hide">
  <div class="small" id="wNum" style="letter-spacing:3px;font-weight:700"></div>
  <h2>HEDEF VURULDU!</h2>
  <div class="stars" id="wStars"></div>
  <p class="small" id="wInfo"></p>
  <button class="btn g" id="wNext">SONRAKİ BÖLÜM</button>
  <button class="btn s" id="wLevels">BÖLÜMLER</button>
</div>

<script>
const LEVELS=[{"w":6,"h":8,"r":[".E....","......","......",".aT...","...#..","..#...","......","......"],"e":[1,0,1],"k":0,"sr":[[19,"\\"]],"sp":[]},{"w":6,"h":8,"r":["......","......","E.....","......","......",".....#","......",".T...#"],"e":[0,2,0],"k":1,"sr":[],"sp":[[13,"\\"]]},{"w":6,"h":8,"r":["......","..T...","......","E.....",".#....","......",".....#","......"],"e":[0,3,0],"k":1,"sr":[],"sp":[[20,"/"]]},{"w":6,"h":8,"r":["...E..","......","...#..","......",".#....",".....#","..T...","...#.."],"e":[3,0,1],"k":2,"sr":[],"sp":[[9,"/"],[8,"/"]]},{"w":7,"h":9,"r":["....#..",".......","#.T....","....###","E......",".X.....",".......",".......","...#..."],"e":[0,4,0],"k":1,"sr":[],"sp":[[30,"/"]]},{"w":7,"h":9,"r":[".......","......#","#.#...#","..../T.","#......","#......",".......",".......","..EX..."],"e":[2,8,3],"k":2,"sr":[],"sp":[[51,"/"],[53,"/"]]},{"w":7,"h":9,"r":["..XE...","#......","...\\...","#.T....",".#.....","....b..","...#...","...##..","......."],"e":[3,0,1],"k":2,"sr":[[39,"/"]],"sp":[[10,"/"],[9,"/"]]},{"w":7,"h":9,"r":[".#..T#.",".#.....","#./.s.T",".......","...Xa..",".......","E....#.","#......","......."],"e":[0,6,0],"k":1,"sr":[[32,"/"]],"sp":[[44,"/"]]},{"w":7,"h":9,"r":["...##..","E.\\...a",".......",".X.....","/.s....","...#.#.","...X...","......#",".TT.#.."],"e":[0,1,0],"k":1,"sr":[[13,"/"]],"sp":[[29,"/"]]},{"w":7,"h":9,"r":[".E.....","X...z.T","..##...","b......","..#X...","T......","....#..",".#..a..","......#"],"e":[1,0,1],"k":2,"sr":[[21,"/"],[53,"/"]],"sp":[[8,"\\"],[25,"/"]]},{"w":7,"h":9,"r":["..E....","...X...",".......","/....#.",".....#.","..#....",".T..X#.","z....##","T.....b"],"e":[2,0,1],"k":2,"sr":[[62,"/"]],"sp":[[23,"/"],[50,"/"]]},{"w":7,"h":9,"r":["...##..","..##...","./.....","......T","..X..#.","...\\...",".......","#......","...EXb."],"e":[3,8,3],"k":2,"sr":[[61,"/"]],"sp":[[52,"/"],[55,"/"]]},{"w":7,"h":9,"r":["...#...","b..b...","#..X#..",".b.....","Ts....X","....#.#","XT.....","...../.",".E#...."],"e":[1,8,3],"k":2,"sr":[[7,"/"],[10,"/"],[22,"/"]],"sp":[[50,"/"],[33,"\\"]]},{"w":7,"h":9,"r":[".....EX","..a../#",".#.....","...X...","/.../..","....#..",".z....T",".T.X.#.","#.b.#.."],"e":[5,0,1],"k":2,"sr":[[9,"/"],[58,"/"]],"sp":[[11,"/"],[29,"/"]]},{"w":8,"h":11,"r":["..#...T.","#.....z.","..b...\\E",".....#XX","b.....#.",".....X..","..a..T..",".#..#...","......#.",".......#",".......b"],"e":[7,2,2],"k":2,"sr":[[18,"/"],[32,"/"],[50,"/"],[87,"/"]],"sp":[[12,"/"],[52,"\\"]]},{"w":8,"h":11,"r":["#.#..a..","........","E....\\..","...X...#",".....b..","...#\\..\\","#..#.a..",".X....#.","T..s....","..#.X...","...T...."],"e":[0,2,0],"k":2,"sr":[[5,"/"],[37,"/"],[53,"/"]],"sp":[[20,"\\"],[71,"/"]]},{"w":8,"h":11,"r":[".#..#...","..#b....","X#...XX.","T.s./..E","X.......",".b/....#",".....#..","...#...a",".......#","........",".T......"],"e":[7,3,2],"k":3,"sr":[[11,"/"],[41,"/"],[63,"/"]],"sp":[[36,"/"],[35,"\\"],[27,"\\"]]},{"w":8,"h":11,"r":[".#.E.#..","....z..T","........","#.X.....","......#.","......b.","...b....","....X#X#","a...z..T",".......X","##.....T"],"e":[3,0,1],"k":4,"sr":[[46,"/"],[51,"/"],[64,"/"]],"sp":[[11,"\\"],[52,"/"],[67,"\\"],[84,"\\"]]},{"w":8,"h":11,"r":[".......b","bX..XX..","...z....","....T...","......#.","........","E....#..","........","###.\\..b",".#..X#..","...T..#b"],"e":[0,6,0],"k":3,"sr":[[7,"/"],[8,"/"],[71,"/"],[87,"/"]],"sp":[[49,"/"],[17,"/"],[20,"\\"]]},{"w":8,"h":11,"r":["...a#...","bb.#..#.","........","........","/..#.X..","..a.....",".X#.....","..T.....","..s.T\\.E","....XX.#","#...#..."],"e":[7,8,2],"k":3,"sr":[[3,"/"],[8,"/"],[9,"/"],[42,"\\"]],"sp":[[45,"\\"],[34,"\\"],[64,"\\"]]},{"w":8,"h":11,"r":["a..b....","..#.....","E....##X","....\\#.T","..X.....","....\\...","..X..X..","..#.....",".../.#..","...#..b#","........"],"e":[0,2,0],"k":3,"sr":[[0,"/"],[3,"/"],[78,"/"]],"sp":[[17,"\\"],[25,"\\"],[47,"/"]]},{"w":8,"h":11,"r":[".b.##...","T....b..","......#.",".....#..",".....\\..",".....s.T",".....X..","X....b.E",".\\......","..#XX#..","..#..#b."],"e":[7,7,2],"k":3,"sr":[[1,"/"],[13,"/"],[61,"/"],[86,"/"]],"sp":[[69,"/"],[41,"/"],[32,"\\"]]},{"w":8,"h":11,"r":["...X...a","#...T...","...X....","#...\\..#","........","....aa.#","...#....","b..X....","...../#a",".......#","#..EX..."],"e":[3,10,3],"k":3,"sr":[[7,"/"],[44,"/"],[45,"/"],[56,"/"],[71,"/"]],"sp":[[75,"/"],[76,"/"],[29,"\\"]]},{"w":8,"h":11,"r":[".#.T..T.","...z.a.X","......z#",".X.#.#\\E","......X.","...X....","....\\..#","#.#...#a","......b.","....T...","........"],"e":[7,3,2],"k":3,"sr":[[13,"/"],[63,"/"],[70,"/"]],"sp":[[19,"\\"],[10,"/"],[50,"\\"]]}];
(()=>{
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const DX=[1,0,-1,0],DY=[0,1,0,-1];
const REF={'/':[3,2,1,0],'\\':[1,0,3,2]};
const mirrorOf=c=>c==='/'||c==='a'||c==='P'||c==='s'?'/':c==='\\'||c==='b'||c==='Q'||c==='z'?'\\':null;

// ---- save ----
let save={un:1,st:{}};
try{const s=JSON.parse(localStorage.getItem('isinustasi_v1'));if(s&&s.un)save=s;}catch(e){}
const store=()=>{try{localStorage.setItem('isinustasi_v1',JSON.stringify(save));}catch(e){}};

// ---- tips: ilk görünüşte ----
const TIP_FIRST={};
LEVELS.forEach((L,i)=>{const s=L.r.join('');
  [['a','rot'],['b','rot'],['X','mine'],['s','split'],['z','split'],['/','fixed'],['\\','fixed']].forEach(([ch,k])=>{if(s.includes(ch)&&TIP_FIRST[k]===undefined)TIP_FIRST[k]=i;});
  if(L.k>0&&TIP_FIRST.place===undefined)TIP_FIRST.place=i;
  if((s.match(/T/g)||[]).length>1&&TIP_FIRST.multi===undefined)TIP_FIRST.multi=i;
});
const TIPS={
  rot:'Mavi halkalı aynaya dokun, yönü değişsin. Lazeri elmasa ulaştır.',
  place:'Boş kareye dokun, ayna koy. Tekrar dokun yönü değişir, üçüncü dokunuşta ayna geri gelir.',
  fixed:'Gri aynalar sabittir, değiştirilemez. Onları kendi lehine kullan.',
  mine:'Turuncu mayınlara dikkat! Lazer mayına değerse bölüm geçilmez.',
  multi:'Birden fazla elmas var. Hepsine ışık ulaşmalı.',
  split:'Mor ayırıcı ışığı ikiye böler: bir kısmı geçer, bir kısmı yansır.'
};

// ---- state ----
let idx=0,L,W,H,g,em,inv,hist,locked,hints,won=false,winT=0,t0=0,tr=null,shakeCell=-1,shakeT=0,parts=[];
function load(i){
  idx=i;L=LEVELS[i];W=L.w;H=L.h;g=L.r.join('').split('');em={x:L.e[0],y:L.e[1],d:L.e[2]};
  inv=L.k;hist=[];locked=new Set();hints=0;won=false;winT=0;parts=[];
  $('lvl').innerHTML='BÖLÜM '+(i+1)+'<small>'+(i+1)+' / '+LEVELS.length+'</small>';
  retrace();
  let tip='';for(const k in TIP_FIRST)if(TIP_FIRST[k]===i){tip=TIPS[k];break;}
  status(tip||defaultStatus());
  resize();
}
function defaultStatus(){
  const nT=g.filter(c=>c==='T').length;
  return 'Elmaslar: '+tr.targets.size+' / '+nT+(L.k?'  •  Kalan ayna: '+inv:'');
}
let statusLock=0;
function status(t,bad){$('status').textContent=t;$('status').className=bad?'bad':'';statusLock=performance.now()+2600;}

// ---- trace ----
function retrace(){
  const segs=[],targets=new Set(),mines=new Set(),seen=new Set();
  const st=[[em.x,em.y,em.d]];
  while(st.length){
    let [x,y,d,skip]=st.pop();
    for(let guard=0;guard<500;guard++){
      const key=(y*W+x)*4+d;if(!skip){if(seen.has(key))break;seen.add(key);}skip=0;
      const nx=x+DX[d],ny=y+DY[d];
      if(nx<0||ny<0||nx>=W||ny>=H){segs.push([x+.5,y+.5,x+.5+DX[d]*.5,y+.5+DY[d]*.5]);break;}
      const c=g[ny*W+nx];
      if(c==='#'){segs.push([x+.5,y+.5,x+.5+DX[d]*.5,y+.5+DY[d]*.5]);break;}
      segs.push([x+.5,y+.5,nx+.5,ny+.5]);
      x=nx;y=ny;
      if(c==='T'){targets.add(y*W+x);break;}
      if(c==='X'){mines.add(y*W+x);break;}
      if(c==='E')break;
      const m=mirrorOf(c);
      if(m){
        if(c==='s'||c==='z')st.push([x,y,d,1]);
        d=REF[m][d];
      }
    }
  }
  tr={segs,targets,mines};
}

// ---- input ----
function cellFromEvent(e){
  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  const cx=Math.floor((x-ox)/cs),cy=Math.floor((y-oy)/cs);
  if(cx<0||cy<0||cx>=W||cy>=H)return -1;return cy*W+cx;
}
function snapshot(){hist.push({g:g.slice(),inv,locked:new Set(locked)});if(hist.length>80)hist.shift();}
function tap(i){
  if(won||i<0)return;
  const c=g[i];
  if(locked.has(i)){bump(i);status('Bu ayna ipucuyla sabitlendi.');return;}
  if(c==='a'||c==='b'){snapshot();g[i]=c==='a'?'b':'a';}
  else if(c==='P'){snapshot();g[i]='Q';}
  else if(c==='Q'){snapshot();g[i]='.';inv++;}
  else if(c==='.'){
    if(L.k===0){bump(i);status('Bu bölümde ayna koyamazsın. Mavi aynaları çevir.',true);return;}
    if(inv<=0){bump(i);status('Ayna kalmadı! Koyduğun bir aynaya dokunarak geri al.',true);return;}
    snapshot();g[i]='P';inv--;
  }
  else if(c==='/'||c==='\\'||c==='s'||c==='z'){bump(i);status('Bu sabit, değiştirilemez.');return;}
  else return;
  after();
}
function bump(i){shakeCell=i;shakeT=.3;}
function after(){
  retrace();updateInv();
  const nT=g.filter(c=>c==='T').length;
  if(tr.mines.size){status('Lazer mayına değiyor! Yolunu değiştir.',true);}
  else if(tr.targets.size===nT){win();}
  else status(defaultStatus());
}
function updateInv(){$('invN').textContent='x'+inv;$('inv').style.opacity=L.k?1:.35;$('bUndo').style.opacity=hist.length?1:.4;}
cv.addEventListener('pointerdown',e=>{e.preventDefault();tap(cellFromEvent(e));});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());

$('bUndo').onclick=()=>{if(won||!hist.length)return;const h=hist.pop();g=h.g;inv=h.inv;locked=h.locked;after();};
$('bReset').onclick=()=>{if(won)return;const hs=hints;load(idx);hints=hs;status('Bölüm baştan başladı.');};
$('hint').onclick=()=>{
  if(won)return;
  // 1) döndürülebilirler
  for(const [i,m] of L.sr){const want=m==='/'?'a':'b';if(g[i]!==want){snapshot();g[i]=want;locked.add(i);hints++;after();if(!won)status('İpucu: bir mavi aynanın doğru yönü gösterildi.');return;}}
  // 2) yerleştirilecekler
  for(const [i,m] of L.sp){const want=m==='/'?'P':'Q';if(g[i]===want)continue;
    snapshot();
    if(g[i]==='.'){if(inv<=0){const extra=[...g.keys()].find(j=>(g[j]==='P'||g[j]==='Q')&&!locked.has(j)&&!L.sp.some(s=>s[0]===j));if(extra===undefined){hist.pop();break;}g[extra]='.';inv++;}inv--;}
    g[i]=want;locked.add(i);hints++;after();if(!won)status('İpucu: bir ayna doğru yerine kondu.');return;}
  // 3) fazla aynaları kaldır
  const extra=[...g.keys()].find(j=>(g[j]==='P'||g[j]==='Q')&&!locked.has(j));
  if(extra!==undefined){snapshot();g[extra]='.';inv++;hints++;after();if(!won)status('İpucu: yoldaki fazla bir ayna kaldırıldı.');}
};

// ---- win ----
function win(){
  won=true;winT=0;
  const st=hints===0?3:hints===1?2:1;
  save.st[idx]=Math.max(save.st[idx]||0,st);if(idx+1<LEVELS.length)save.un=Math.max(save.un,idx+2);store();
  for(const i of tr.targets)burst(i%W,Math.floor(i/W));
  status('Mükemmel! Bütün elmaslar parlıyor.');
  const tok=idx;
  setTimeout(()=>{
    if(!won||idx!==tok)return;
    $('wNum').textContent='BÖLÜM '+(idx+1);
    $('wStars').innerHTML=[0,1,2].map(i=>i<st?'★':'<span class="off">★</span>').join('');
    $('wInfo').textContent=hints?'Kullandığın ipucu: '+hints+' (ipucusuz bitirirsen 3 yıldız)':'İpucusuz çözdün!';
    if(idx+1>=LEVELS.length){$('wNext').style.display='none';$('wInfo').textContent+=' — Tüm bölümleri bitirdin! 🎉';}else $('wNext').style.display='';
    $('win').classList.remove('hide');
  },1100);
}
function burst(cx,cy){for(let i=0;i<26;i++){const a=Math.random()*6.28,s=1.5+Math.random()*4;parts.push({x:cx+.5,y:cy+.5,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.8+Math.random()*.5});}}

// ---- layout ----
let cs=40,ox=0,oy=0,dpr=1;
function resize(){
  const r=$('board').getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,2.5);
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);
  if(!L)return;
  cs=Math.floor(Math.min((r.width-16)/W,(r.height-8)/H));
  ox=Math.floor((r.width-cs*W)/2);oy=Math.floor((r.height-cs*H)/2);
}
window.addEventListener('resize',resize);

// ---- draw ----
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
function drawMirror(px,py,m,col,lw,dash){
  const p=cs*.2;ctx.lineCap='round';ctx.strokeStyle=col;ctx.lineWidth=lw;if(dash)ctx.setLineDash(dash);
  ctx.beginPath();if(m==='/'){ctx.moveTo(px+p,py+cs-p);ctx.lineTo(px+cs-p,py+p);}else{ctx.moveTo(px+p,py+p);ctx.lineTo(px+cs-p,py+cs-p);}
  ctx.stroke();ctx.setLineDash([]);
}
function draw(t){
  const time=t/1000;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  if(!L)return;
  // board bg
  rr(ox-6,oy-6,cs*W+12,cs*H+12,14);ctx.fillStyle='#0d0b1c';ctx.fill();ctx.strokeStyle='#26224a';ctx.lineWidth=2;ctx.stroke();
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=y*W+x,c=g[i];let px=ox+x*cs,py=oy+y*cs;
    if(i===shakeCell&&shakeT>0)px+=Math.sin(shakeT*60)*4;
    rr(px+2,py+2,cs-4,cs-4,6);ctx.fillStyle=c==='#'?'#1e1b36':'rgba(255,255,255,.035)';ctx.fill();
    if(c==='#'){ctx.strokeStyle='#36316a';ctx.lineWidth=1.5;ctx.stroke();ctx.beginPath();for(let k=1;k<4;k++){ctx.moveTo(px+4,py+k*cs/4);ctx.lineTo(px+cs-4,py+k*cs/4);}ctx.strokeStyle='rgba(120,110,200,.15)';ctx.stroke();}
  }
  // beam
  ctx.globalCompositeOperation='lighter';ctx.lineCap='round';ctx.lineJoin='round';
  const path=()=>{ctx.beginPath();for(const s of tr.segs){ctx.moveTo(ox+s[0]*cs,oy+s[1]*cs);ctx.lineTo(ox+s[2]*cs,oy+s[3]*cs);}};
  path();
  const pulse=.85+Math.sin(time*6)*.15;
  ctx.strokeStyle='rgba(255,45,85,'+(.18*pulse)+')';ctx.lineWidth=cs*.42;ctx.stroke();
  ctx.strokeStyle='rgba(255,45,85,.55)';ctx.lineWidth=cs*.16;ctx.stroke();
  ctx.strokeStyle='#ffd0d8';ctx.lineWidth=Math.max(2,cs*.05);ctx.stroke();
  ctx.setLineDash([cs*.12,cs*.5]);ctx.lineDashOffset=-time*cs*3;ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=Math.max(2,cs*.07);ctx.stroke();ctx.setLineDash([]);
  ctx.globalCompositeOperation='source-over';
  // items
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=y*W+x,c=g[i];let px=ox+x*cs,py=oy+y*cs;const cx=px+cs/2,cy=py+cs/2;
    if(i===shakeCell&&shakeT>0)px+=Math.sin(shakeT*60)*4;
    const lk=locked.has(i);
    if(c==='E'){
      rr(px+cs*.14,py+cs*.14,cs*.72,cs*.72,cs*.16);ctx.fillStyle='#3a0614';ctx.fill();ctx.strokeStyle='#ff2d55';ctx.lineWidth=3;ctx.stroke();
      ctx.save();ctx.translate(cx,cy);ctx.rotate(em.d*Math.PI/2);ctx.fillStyle='#ff2d55';ctx.fillRect(cs*.2,-cs*.1,cs*.22,cs*.2);ctx.restore();
      ctx.beginPath();ctx.arc(cx,cy,cs*.14*(.9+Math.sin(time*5)*.12),0,6.28);ctx.fillStyle='#ffd0d8';ctx.fill();
    }
    else if(c==='T'){
      const lit=tr.targets.has(i);ctx.save();ctx.translate(cx,cy);ctx.rotate(lit?time*1.5:Math.PI/4*0);
      const s=cs*.3*(lit?1+Math.sin(time*8)*.06:1);
      ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(s*.8,0);ctx.lineTo(0,s);ctx.lineTo(-s*.8,0);ctx.closePath();
      if(lit){ctx.shadowColor='#3dff8a';ctx.shadowBlur=20;ctx.fillStyle='#7dffb0';ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();}
      else{ctx.fillStyle='rgba(125,255,176,.08)';ctx.fill();ctx.strokeStyle='#7dffb0';ctx.lineWidth=2.5;ctx.stroke();ctx.beginPath();ctx.moveTo(-s*.8,0);ctx.lineTo(s*.8,0);ctx.strokeStyle='rgba(125,255,176,.4)';ctx.lineWidth=1;ctx.stroke();}
      ctx.restore();
    }
    else if(c==='X'){
      const hit=tr.mines.has(i);const r=cs*.2;
      ctx.save();ctx.translate(cx,cy);ctx.rotate(time*.6);
      ctx.strokeStyle=hit?'#fff':'#ff9f1a';ctx.lineWidth=3;
      for(let k=0;k<8;k++){const a=k*Math.PI/4;ctx.beginPath();ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);ctx.lineTo(Math.cos(a)*r*1.55,Math.sin(a)*r*1.55);ctx.stroke();}
      ctx.restore();
      ctx.beginPath();ctx.arc(cx,cy,r,0,6.28);ctx.fillStyle=hit?(Math.sin(time*20)>0?'#ff3b1a':'#ffb070'):'#4a2400';ctx.fill();ctx.strokeStyle='#ff9f1a';ctx.lineWidth=2.5;ctx.stroke();
      if(hit){ctx.beginPath();ctx.arc(cx,cy,cs*.45,0,6.28);ctx.strokeStyle='rgba(255,80,30,'+(.5+Math.sin(time*20)*.4)+')';ctx.lineWidth=3;ctx.stroke();}
    }
    else if(c==='/'||c==='\\'){drawMirror(px,py,c,'#5d6178',cs*.16);drawMirror(px,py,c,'#c3c7d8',cs*.06);
      ctx.fillStyle='#8a8ea3';[[.2,.2],[.8,.8],[.2,.8],[.8,.2]].forEach(([a,b])=>{ctx.beginPath();ctx.arc(px+a*cs,py+b*cs,1.8,0,6.28);ctx.fill();});}
    else if(c==='a'||c==='b'){
      ctx.beginPath();ctx.arc(cx,cy,cs*.42,0,6.28);ctx.strokeStyle=lk?'rgba(255,210,58,.6)':'rgba(79,209,255,.35)';ctx.lineWidth=2;ctx.setLineDash([4,4]);ctx.stroke();ctx.setLineDash([]);
      drawMirror(px,py,mirrorOf(c),lk?'rgba(255,210,58,.35)':'rgba(79,209,255,.35)',cs*.2);drawMirror(px,py,mirrorOf(c),lk?'#ffd23a':'#4fd1ff',cs*.08);
    }
    else if(c==='P'||c==='Q'){
      drawMirror(px,py,mirrorOf(c),lk?'rgba(255,210,58,.35)':'rgba(255,255,255,.3)',cs*.2);drawMirror(px,py,mirrorOf(c),lk?'#ffd23a':'#ffffff',cs*.08);
    }
    else if(c==='s'||c==='z'){
      rr(px+5,py+5,cs-10,cs-10,6);ctx.strokeStyle='rgba(199,125,255,.4)';ctx.lineWidth=1.5;ctx.stroke();
      drawMirror(px,py,mirrorOf(c),'rgba(199,125,255,.35)',cs*.2);drawMirror(px,py,mirrorOf(c),'#c77dff',cs*.07,[cs*.08,cs*.06]);
    }
  }
  // particles
  for(const p of parts){ctx.globalAlpha=Math.max(0,Math.min(1,p.life));ctx.fillStyle=Math.random()<.5?'#7dffb0':'#fff';ctx.fillRect(ox+p.x*cs-2,oy+p.y*cs-2,4,4);}
  ctx.globalAlpha=1;
}
let last=0;
function loop(t){
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  shakeT=Math.max(0,shakeT-dt);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.95;p.vy*=.95;if(p.life<=0)parts.splice(i,1);}
  if(L&&!won&&performance.now()>statusLock&&!tr.mines.size){const d=defaultStatus();if($('status').textContent!==d){$('status').textContent=d;$('status').className='';}}
  draw(t);requestAnimationFrame(loop);
}

// ---- screens ----
const hideAll=()=>['menu','levels','win'].forEach(i=>$(i).classList.add('hide'));
function levels(){
  hideAll();const gr=$('grid');gr.innerHTML='';
  LEVELS.forEach((_,i)=>{const b=document.createElement('button');const lock=i+1>save.un,s=save.st[i]||0;
    b.className='lv'+(lock?' lock':'')+(i+1===save.un?' cur':'');
    b.innerHTML=(lock?'🔒':i+1)+'<small>'+(lock?'':'★'.repeat(s)+'☆'.repeat(3-s))+'</small>';
    if(!lock)b.onclick=()=>{hideAll();load(i);updateInv();};gr.appendChild(b);});
  const tot=Object.values(save.st).reduce((a,b)=>a+b,0);$('lvInfo').textContent='Toplam yıldız: '+tot+' / '+LEVELS.length*3;
  $('levels').classList.remove('hide');
}
$('play').onclick=()=>{hideAll();load(Math.min(save.un,LEVELS.length)-1);updateInv();};
$('toLevels').onclick=levels;$('lvBack').onclick=()=>{hideAll();if(!L)$('menu').classList.remove('hide');};
$('bMenu').onclick=levels;$('wLevels').onclick=levels;
$('wNext').onclick=()=>{hideAll();load(idx+1);updateInv();};

// legend
const lg=[['<svg viewBox="0 0 30 30"><rect x="4" y="4" width="22" height="22" rx="5" fill="#3a0614" stroke="#ff2d55" stroke-width="2.5"/><circle cx="15" cy="15" r="4" fill="#ffd0d8"/></svg>','Lazer kaynağı'],
 ['<svg viewBox="0 0 30 30"><path d="M15 5 L23 15 L15 25 L7 15Z" fill="none" stroke="#7dffb0" stroke-width="2.5"/></svg>','Elmas: ışığı buraya ulaştır'],
 ['<svg viewBox="0 0 30 30"><line x1="7" y1="23" x2="23" y2="7" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>','Senin aynan: boş kareye dokunarak koy'],
 ['<svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="12" fill="none" stroke="#4fd1ff" stroke-dasharray="3 3" stroke-width="1.5"/><line x1="8" y1="8" x2="22" y2="22" stroke="#4fd1ff" stroke-width="3.5" stroke-linecap="round"/></svg>','Mavi ayna: dokununca döner'],
 ['<svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="7" fill="#4a2400" stroke="#ff9f1a" stroke-width="2.5"/></svg>','Mayın: ışık değmemeli']];
$('legend').innerHTML=lg.map(([s,t])=>'<i>'+s+'</i><span>'+t+'</span>').join('');

window.__iu={load:i=>{hideAll();load(i);updateInv();},tap,get won(){return won},LEVELS,g:()=>g};
requestAnimationFrame(loop);
})();
</script>
